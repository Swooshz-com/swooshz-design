          printf 'CAPABILITY_PROBE=PASS\nINITIAL_CAPABILITY_PROBE=PASS\n'
          admit_root_and_carrier || fail_hold "POST_INITIAL_PROBE_IDENTITY_FAILED"
          mount_table_admission "$carrier" || fail_hold "MOUNT_ADMISSION_POST_INITIAL_PROBE_FAILED"
          admit_work_for_use || fail_hold "WORK_POST_INITIAL_PROBE_ADMISSION_FAILED"

