                  fail("MAPPED_SEED_PROBE_RUNNER_FAILED", "CANDIDATE_DEFECT__SEED_ACL_MAPPED")
              receipt_prefix = b"S8_RUNNER_RECEIPT:"
              probe_prefix = b"S8_SEED_MAPPED_PROBE:"
              try:
                  result.stdout.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  prove_seed_candidate_defect("MAPPED_SEED_PROBE_OUTPUT_INVALID", "MAPPED")
              if not result.stdout.endswith(b"\n"):
