              ("filename", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "FILENAME_INVALID"),
              ("size", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "SIZE_INVALID"),
              ("sha256", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "SHA256_INVALID"),
