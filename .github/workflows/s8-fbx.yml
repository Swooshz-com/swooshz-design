            }
          printf '%s\n' "$apt_plan_output" > "$package_plan"
          mapfile -t plan_installs < <(awk '$1 == "Inst" { print $2 }' "$package_plan")
          mapfile -t plan_confs < <(awk '$1 == "Conf" { print $2 }' "$package_plan")
          [[ "${#plan_installs[@]}" == 1 && "${plan_installs[0]}" == bubblewrap ]] || fail_hold "BUBBLEWRAP_INSTALL_PLAN_PACKAGE_SET_INVALID"
          [[ "${#plan_confs[@]}" == 1 && "${plan_confs[0]}" == bubblewrap ]] || fail_hold "BUBBLEWRAP_INSTALL_PLAN_CONFIGURATION_SET_INVALID"
          if grep -Eiq '^(Trig|Processing triggers)' "$package_plan"; then
            fail_hold "BUBBLEWRAP_INSTALL_PLAN_TRIGGER_SET_INVALID"
          fi
          if grep -E '^(Remv|Purg|Del|Downgrade|Remove|Inst )' "$package_plan" | grep -Ev '^Inst bubblewrap( |$)' >/dev/null; then
            fail_hold "BUBBLEWRAP_INSTALL_PLAN_MUTATION_SET_INVALID"
          fi
          grep -F "Inst bubblewrap ($expected_bwrap_version" "$package_plan" >/dev/null || fail_hold "BUBBLEWRAP_INSTALL_PLAN_VERSION_INVALID"
          printf 'ONE_NEW_PACKAGE=bubblewrap:amd64=0.9.0-1ubuntu0.3\nNO_VERSION_SUBSTITUTION=PASS\nPACKAGE_INSTALL_PLAN=PASS\n'

          /usr/bin/sudo -n /usr/bin/dpkg --install "$bubblewrap_deb" || fail_hold "BUBBLEWRAP_INSTALL_FAILED"
          installed_status="$(/usr/bin/dpkg-query -W -f='${Status}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_STATUS_UNAVAILABLE"
          installed_version="$(/usr/bin/dpkg-query -W -f='${Version}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_VERSION_UNAVAILABLE"
          installed_architecture="$(/usr/bin/dpkg-query -W -f='${Architecture}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_ARCHITECTURE_UNAVAILABLE"
          [[ "$installed_status" == 'install ok installed' ]] || fail_hold "BUBBLEWRAP_INSTALLED_STATUS_INVALID"
          [[ "$installed_version" == "$expected_bwrap_version" ]] || fail_hold "BUBBLEWRAP_INSTALLED_VERSION_INVALID"
          [[ "$installed_architecture" == amd64 ]] || fail_hold "BUBBLEWRAP_INSTALLED_ARCHITECTURE_INVALID"

          bwrap_path=/usr/bin/bwrap
          bwrap_realpath="$(realpath -e -- "$bwrap_path")" || fail_hold "BWRAP_REALPATH_FAILED"
          [[ "$bwrap_realpath" == "$bwrap_path" ]] || fail_hold "BWRAP_REALPATH_UNEXPECTED"
          [[ -f "$bwrap_path" && ! -L "$bwrap_path" ]] || fail_hold "BWRAP_PATH_INVALID"
          [[ "$(stat -c '%u:%g' -- "$bwrap_path")" == '0:0' ]] || fail_hold "BWRAP_OWNER_INVALID"
          bwrap_mode="$(stat -c '%a' -- "$bwrap_path")"
          (( (8#$bwrap_mode & 6000) == 0 )) || fail_hold "BWRAP_SUID_SGID_PRESENT"
          command -v /usr/sbin/getcap >/dev/null 2>&1 || fail_hold "GETCAP_UNAVAILABLE"
          [[ -z "$(/usr/sbin/getcap -n "$bwrap_path" 2>/dev/null)" ]] || fail_hold "BWRAP_FILE_CAPABILITIES_PRESENT"
          bwrap_owner_record="$(/usr/bin/dpkg-query -S "$bwrap_path" 2>/dev/null)" || fail_hold "BWRAP_DPKG_OWNER_UNAVAILABLE"
          [[ "${bwrap_owner_record%%:*}" == bubblewrap ]] || fail_hold "BWRAP_DPKG_OWNER_INVALID"
          bwrap_sha256="$(sha256sum -- "$bwrap_path" | awk '{print $1}')" || fail_hold "BWRAP_HASH_FAILED"
          [[ "$bwrap_sha256" == "$verified_bwrap_sha256" ]] || fail_hold "BWRAP_INSTALLED_HASH_MISMATCH"
          bwrap_version="$(/usr/bin/sudo -n "$bwrap_path" --version)" || fail_hold "BWRAP_VERSION_FAILED"
          bwrap_help="$(/usr/bin/sudo -n "$bwrap_path" --help)" || fail_hold "BWRAP_HELP_FAILED"
          for required_option in --unshare-user --unshare-net --unshare-pid --unshare-ipc --unshare-uts --disable-userns --assert-userns-disabled --uid --gid --cap-drop --die-with-parent --new-session --clearenv --ro-bind --bind --proc --dev --tmpfs --size --chdir; do
            grep -F -- "$required_option" <<< "$bwrap_help" >/dev/null || fail_hold "BWRAP_OPTION_UNAVAILABLE_${required_option#--}"
          done
          printf 'PATH=%s\nREALPATH=%s\nTYPE=regular_file\nOWNER=root:root\nNO_SYMLINK=PASS\nNO_SUID=PASS\nNO_SGID=PASS\nNO_FILE_CAPABILITIES=PASS\nDPKG_OWNER=bubblewrap\nDPKG_VERSION=%s\nINSTALLED_HASH=%s\nBWRAP_PATH=%s\nBWRAP_VERSION=%s\nBWRAP_ADMISSION=PASS\n' "$bwrap_path" "$bwrap_realpath" "$installed_version" "$bwrap_sha256" "$bwrap_path" "$bwrap_version"

          for system_path in /usr /lib /etc; do
            [[ -e "$system_path" ]] || fail_hold "SYSTEM_BIND_SOURCE_MISSING_${system_path#/}"
            [[ -d "$(realpath -e -- "$system_path")" ]] || fail_hold "SYSTEM_BIND_SOURCE_NOT_DIRECTORY_${system_path#/}"
          done
          if [[ -e /lib64 || -L /lib64 ]]; then
            [[ -d "$(realpath -e -- /lib64)" ]] || fail_hold "LIB64_BIND_SOURCE_INVALID"
            printf 'LIB64_BIND=present\n'
