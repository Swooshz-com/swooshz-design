          def _permission_text(value: int) -> str:
              return ("r" if value & 4 else "-") + ("w" if value & 2 else "-") + ("x" if value & 1 else "-")


          def parse_numeric_acl_evidence(
              output: str,
              path: pathlib.Path,
              observed: os.stat_result,
              scope: str,
          ) -> dict[str, dict[str, str | None]]:
              if scope not in {"access", "default"}:
                  raise ValueError("ACL_SCOPE_INVALID")
              headers: dict[str, str] = {}
              entries: dict[str, dict[str, str | None]] = {}
              prefix = "default:" if scope == "default" else ""
              for raw_line in output.splitlines():
                  if not raw_line.strip():
                      continue
                  entry_part, has_comment, comment_part = raw_line.partition("#")
                  entry = entry_part.strip()
                  comment = comment_part.strip() if has_comment else ""
                  if not entry:
                      if not has_comment:
                          raise ValueError("ACL_HEADER_MISSING")
                      header_match = re.fullmatch(r"(file|owner|group):\s*(\S.*)", comment)
                      if header_match is None:
                          raise ValueError("ACL_HEADER_GRAMMAR")
                      header_name, header_value = header_match.groups()
                      if header_name in headers:
                          raise ValueError("ACL_HEADER_DUPLICATE")
                      headers[header_name] = header_value.strip()
                      continue
                  annotation = None
                  if has_comment:
                      annotation_match = re.fullmatch(r"effective:\s*([r-][w-][x-])", comment)
                      if annotation_match is None:
                          raise ValueError("ACL_ANNOTATION_GRAMMAR")
                      annotation = annotation_match.group(1)
                  if scope == "default":
                      if entry.startswith("default:"):
                          raise ValueError("ACL_DEFAULT_PREFIX_IN_DEFAULT_QUERY")
                      body = entry
                  else:
                      if entry.startswith("default:"):
                          raise ValueError("ACL_DEFAULT_ENTRY_IN_ACCESS_QUERY")
                      body = entry
                  parts = body.split(":")
                  if len(parts) != 3:
                      raise ValueError("ACL_ENTRY_GRAMMAR")
                  kind, qualifier, permissions = parts
                  _permission_bits(permissions)
                  if kind in {"user", "group"}:
                      if qualifier and re.fullmatch(r"(?:0|[1-9][0-9]*)", qualifier) is None:
                          raise ValueError("ACL_NUMERIC_QUALIFIER_INVALID")
                      key = f"{prefix}{kind}:{qualifier}" if qualifier else f"{prefix}{kind}::"
                  elif kind in {"mask", "other"}:
                      if qualifier:
                          raise ValueError("ACL_RESERVED_QUALIFIER_INVALID")
                      key = f"{prefix}{kind}::"
                  else:
                      raise ValueError("ACL_KIND_INVALID")
                  if key in entries:
                      raise ValueError("ACL_ENTRY_DUPLICATE")
                  entries[key] = {"raw": permissions, "annotation": annotation}
              if set(headers) != {"file", "owner", "group"}:
                  raise ValueError("ACL_HEADERS_INCOMPLETE")
              expected_path = os.path.abspath(os.fspath(path))
