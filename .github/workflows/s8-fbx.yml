              no_valid = lambda signed: synthetic_payload(archive_timestamp(signed))
              expect_pass("NO_VALID_UNTIL__AGE_BELOW_48H", no_valid(base), base + 172799, base + 172799)
              expect_reject("NO_VALID_UNTIL__AGE_EXACTLY_48H", no_valid(base), base + 172800, base + 172800)
              expect_reject("NO_VALID_UNTIL__AGE_ABOVE_48H", no_valid(base), base + 172801, base + 172801)
              expect_pass("DATE_10_SECONDS_IN_FUTURE", no_valid(base + 10), base, base)
              expect_reject("DATE_11_SECONDS_IN_FUTURE", no_valid(base + 11), base, base)
              expect_pass(
                  "VALID_UNTIL_PRESENT__EARLIER_THAN_LOCAL_EXPIRY__NOT_EXPIRED",
                  synthetic_payload(archive_timestamp(base), archive_timestamp(base + 3600)),
                  base + 3599,
                  base + 3599,
                  base + 3600,
              )
              expect_reject(
                  "VALID_UNTIL_PRESENT__EXPIRED",
                  synthetic_payload(archive_timestamp(base), archive_timestamp(base + 3600)),
                  base + 3600,
                  base + 3600,
              )
              expect_pass(
                  "VALID_UNTIL_PRESENT__LATER_THAN_LOCAL_EXPIRY",
                  synthetic_payload(archive_timestamp(base), archive_timestamp(base + 200000)),
                  base + 172799,
                  base + 172799,
                  base + LOCAL_MAX_AGE,
                  "PASS_LOCAL_48H_EXPIRY_WINS",
              )
              expect_reject(
                  "DUPLICATE_DATE",
                  synthetic_payload(extra_lines=(f"Date: {archive_timestamp(base)}", f"Date: {archive_timestamp(base)}")),
                  base,
                  base,
              )
              expect_reject(
                  "DUPLICATE_VALID_UNTIL",
                  synthetic_payload(
                      archive_timestamp(base),
                      archive_timestamp(base + 3600),
                      (f"Valid-Until: {archive_timestamp(base + 7200)}",),
                  ),
                  base,
                  base,
              )
              expect_reject(
                  "MISSING_DATE",
                  synthetic_payload(valid_until_value=archive_timestamp(base + 3600)),
                  base,
                  base,
              )
              expect_reject(
                  "INVALID_TIMESTAMP",
                  synthetic_payload("Sun, 29 Feb 2025 2:10:56 UTC"),
                  base,
                  base,
              )
              expect_reject(
                  "NON_UTC_TIMESTAMP",
                  synthetic_payload("Sun, 20 Sep 2026 2:10:56 +0000"),
                  base,
                  base,
              )
              expect_reject("BACKWARD_CLOCK", no_valid(base), base + 1, base)
              observed_signed = calendar.timegm((2026, 9, 20, 2, 10, 56, 0, 0, 0))
