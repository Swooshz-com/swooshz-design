              if snapshot["version"] != "0.9.0-1ubuntu0.3" or snapshot["architecture"] != "amd64":
                  reject("BWRAP_POST_PACKAGE_VERSION_INVALID")
              if snapshot["post_hash"] != pre_hash or snapshot["post_hash"] != snapshot["auth_hash"]:
