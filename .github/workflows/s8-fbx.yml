            fi
            [[ "$hold_reason" == BWRAP_INFO_ADMISSION_FAILED ]]
            [[ "$info_success" == 0 ]]
            [[ "$injected_call" == "$inject_at" ]]
            [[ ! -e "$candidate_marker_file" && ! -L "$candidate_marker_file" ]]
            printf 'GUARDED_INFORMATIONAL_%s=PASS\n' "$label"
          }

          run_informational_case VERSION 1
          run_informational_case HELP 2

          run_capability_case() {
            local mode="$1"
            local capability_success=0
            injected_call=0
            injected_at=1
            hold_reason=""
            if ! run_capability_probe "$mode"; then
              fail_hold "CAPABILITY_PROBE_FAILED"
            else
              capability_success=1
            fi
            [[ "$hold_reason" == CAPABILITY_PROBE_FAILED ]]
            [[ "$capability_success" == 0 ]]
            [[ "$injected_call" == 1 ]]
            [[ ! -e "$candidate_marker_file" && ! -L "$candidate_marker_file" ]]
            printf 'GUARDED_CAPABILITY_%s=PASS\n' "$mode"
          }

          run_capability_case initial
          run_capability_case staged

          run_qualification_case() {
            local label="$1"
            local create_marker="$2"
            local marker="$regression_root/$label.marker"
            local qualification_status=0
            local candidate_started=0
            local failure_reported=0
            local qualification_pass=0
            local -a qualification_command
            /usr/bin/rm -f -- "$marker"
            if [[ "$create_marker" == 1 ]]; then
