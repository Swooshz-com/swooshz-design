                  ("EMPTY_FILENAME", _exact({"Filename": ""}), "REQUIRED_FIELD_EMPTY"),
                  ("EMPTY_SIZE", _exact({"Size": ""}), "REQUIRED_FIELD_EMPTY"),
                  ("EMPTY_SHA256", _exact({"SHA256": ""}), "REQUIRED_FIELD_EMPTY"),
                  ("MALFORMED_SIZE", _exact({"Size": "12x"}), "SIZE_INVALID"),
                  ("MALFORMED_SHA256", _exact({"SHA256": "g" * 64}), "SHA256_INVALID"),
                  ("WRONG_FILENAME", _exact({"Filename": "pool/main/b/bubblewrap/wrong.deb"}), "FILENAME_INVALID"),
                  ("UNRELATED_STANZAS_PRESENT", _join_paragraphs(unrelated, exact), None),
                  ("FIELD_ORDER_CHANGED", _exact(order=("SHA256", "Architecture", "Filename", "Package", "Size", "Version")), None),
                  ("DUPLICATE_IDENTITY_FIELD", _duplicate("Package"), "DUPLICATE_FIELD"),
                  ("CASE_VARIANT_DUPLICATE_FIELD", _duplicate("Filename", "FILENAME"), "DUPLICATE_FIELD"),
