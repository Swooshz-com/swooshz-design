              declare -f run_tracked_command
              declare -f validate_bwrap_info_after_carrier
              declare -f run_capability_probe
              /usr/bin/cat <<'SH'
          set -Eeuo pipefail
          regression_root="$1"
          candidate_marker_file=""
          tmpfs_bytes=1073741824
          bwrap_path=/usr/bin/bwrap
          carrier=/carrier
          common_bwrap_args=(--unshare-user)
          host_user_ns=user:[host]
          host_pid_ns=pid:[host]
          host_net_ns=net:[host]
          host_ipc_ns=ipc:[host]
          host_uts_ns=uts:[host]
          capability_script=':'
          tracked_children=()
          all_launched_children_reaped=1
          stop_new_launches=0
          critical_section=0
          pending_signal=""
          received_signal=""
          iproute2_admission_baseline=""
          admit_iproute2_snapshot() { return 0; }
          validate_capability_ip_paths() { return 0; }
          validate_route_evidence() { return 0; }

          fail_hold() {
            hold_reason="$1"
          }

          fail_amendment() {
            amendment_reason="$1"
            return 1
          }

          admit_before_bwrap() {
            return 0
          }

          admit_root_and_carrier() {
            return 0
          }

          mount_table_admission() {
            return 0
          }

          admit_work_for_use() {
            return 0
          }

          run_bwrap_argv_grammar_regression() {
            return 0
          }

          validate_bwrap_destination_order() {
            return 0
          }

          injected_call=0
          injected_at=0
          run_tracked_command() {
            injected_call=$((injected_call + 1))
            printf 'injected informational output\n'
            if [[ "$injected_call" == "$injected_at" ]]; then
              return 42
            fi
            return 0
          }

          run_informational_case() {
            local label="$1"
            local inject_at="$2"
            local version_output="$regression_root/info-$label.version"
            local help_output="$regression_root/info-$label.help"
            local info_success=0
            injected_call=0
            injected_at="$inject_at"
            hold_reason=""
            if ! validate_bwrap_info_after_carrier "$version_output" "$help_output"; then
              fail_hold "BWRAP_INFO_ADMISSION_FAILED"
            else
