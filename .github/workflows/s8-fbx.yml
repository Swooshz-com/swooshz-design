                      and _identity_value(record, "version") == EXPECTED_VERSION
                      and _identity_value(record, "architecture") == EXPECTED_ARCHITECTURE
                  ):
                      matches.append(record)
              if len(matches) != 1:
                  reject("MATCH_COUNT_INVALID")

              record = matches[0]
              values = {}
              for field_name, missing_code, empty_code, invalid_code in REQUIRED_OUTPUT_FIELDS:
                  if field_name not in record:
                      reject(missing_code)
                  raw_value = _trim_ascii_space(record[field_name])
                  if raw_value == b"":
                      reject(empty_code)
                  try:
                      value = raw_value.decode("ascii")
                  except UnicodeDecodeError:
                      reject(invalid_code)
