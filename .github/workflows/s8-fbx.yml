          }

          protected_host_path_is_safe() {
            local path="$1"
            local resolved
            local mode
            [[ -d "$path" && ! -L "$path" ]] || return 1
            resolved="$(realpath -e -- "$path")" || return 1
            [[ "$resolved" == "$path" ]] || return 1
            mode="$(stat -c '%a' -- "$path")"
            [[ "$mode" =~ ^[0-7]{3,4}$ ]] || return 1
            (( (8#$mode & 022) == 0 )) || return 1
          }

          man_cache_manifest() {
            local root="$1"
            local path
            local relative_path
            local file_type
            local mode
            local owner
            local size
            local mtime
            local content
            [[ -d "$root" && ! -L "$root" ]] || return 1
            {
              while IFS= read -r -d '' path; do
                if [[ "$path" == "$root" ]]; then
                  relative_path='.'
                else
                  relative_path="${path#"$root"/}"
                fi
                file_type="$(stat -c '%F' -- "$path")"
                mode="$(stat -c '%a' -- "$path")"
                owner="$(stat -c '%u:%g' -- "$path")"
                size="$(stat -c '%s' -- "$path")"
                mtime="$(stat -c '%Y' -- "$path")"
                case "$file_type" in
                  'regular file')
                    content="$(sha256sum -- "$path" | awk '{print $1}')"
                    ;;
                  'symbolic link')
                    content="SYMLINK->$(readlink -- "$path")"
                    ;;
                  directory)
                    content=DIRECTORY
                    ;;
                  *)
                    content="TYPE:$file_type"
                    ;;
                esac
                printf 'TYPE=%s\tPATH=%s\tMODE=%s\tOWNER=%s\tSIZE=%s\tMTIME=%s\tCONTENT=%s\n' \
                  "$file_type" "$relative_path" "$mode" "$owner" "$size" "$mtime" "$content"
              done < <(/usr/bin/find -P "$root" -print0)
            } | LC_ALL=C /usr/bin/sort
          }

