            printf 'ROOT_ADMISSION=PASS\nROOT_LITERAL=/\nROOT_CANONICAL=/\nROOT_DIRECTORY=YES\nROOT_SYMLINK=NO\nROOT_UID=0\nROOT_GID=0\nROOT_MODE_GROUP_OTHER_WRITE=NONE\nROOT_EXTENDED_ACCESS_ACL=NONE\nROOT_DEFAULT_ACL=NONE\nROOT_BASELINE_IDENTITY=%s\n' "$root_baseline_identity"
