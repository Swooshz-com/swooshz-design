            local live_probe='/s8-mount-admission-live-reader-probe'
            findmnt_version="$(/usr/bin/findmnt --version 2>&1 | /usr/bin/tr '\r\n' ' ')" || return 1
            [[ -n "$findmnt_version" ]] || return 1
            printf 'FINDMNT_VERSION=%s\n' "$findmnt_version"
            verify_mountinfo || return 1
            printf 'PROC_SELF_MOUNTINFO=READABLE_NONEMPTY\n'
            mount_table_admission "$live_probe" || return 1
            printf 'UNFILTERED_KERNEL_TABLE_COMMAND=PASS\nCAPTURED_MOUNT_TARGET_SET=NONEMPTY\nLIVE_MOUNT_TABLE_READ=PASS\nLIVE_ROOT_MOUNT_PRESENT=PASS\nMOUNT_TABLE_LIVE_READER=PASS\n'
          }

          admit_root_owned_directory() {
            local literal="$1"
            local canonical="$2"
            local expected_parent="$3"
            local exact_mode="$4"
            local before after resolved owner mode_raw full_mode_value mode_value
            before="$(stable_identity "$literal")" || return 1
            [[ -d "$literal" && ! -L "$literal" ]] || return 1
            resolved="$(/usr/bin/realpath -e -- "$literal")" || return 1
            [[ "$resolved" == "$canonical" ]] || return 1
            [[ "$(/usr/bin/dirname -- "$resolved")" == "$expected_parent" ]] || return 1
            owner="$(/usr/bin/stat -c '%u:%g' -- "$literal")" || return 1
            [[ "$owner" == 0:0 ]] || return 1
            mode_raw="$(/usr/bin/stat -c '%a' -- "$literal")" || return 1
            [[ "$mode_raw" =~ ^[0-7]{3,4}$ ]] || return 1
            full_mode_value=$((8#$mode_raw))
            mode_value=$((full_mode_value & 0777))
            if [[ -n "$exact_mode" ]]; then
              [[ "$full_mode_value" == $((8#$exact_mode)) ]] || return 1
            else
              (( (mode_value & 0022) == 0 )) || return 1
            fi
            ordinary_acl_is_exact "$literal" "$(printf '0%03o' "$mode_value")" || return 1
            after="$(stable_identity "$literal")" || return 1
            [[ "$before" == "$after" ]] || return 1
            printf '%s\n' "$after"
          }

          mark_carrier_identity_poisoned() {
            carrier_identity_poisoned=1
            identity_poisoned=1
            printf 'CARRIER_IDENTITY_POISONED=YES\n' >&2
          }

          admit_root_snapshot() {
            local current
            if ! current="$(admit_root_owned_directory / / / '')"; then
              [[ -n "$carrier_baseline_identity" ]] && mark_carrier_identity_poisoned
              return 1
            fi
            if [[ -z "$root_baseline_identity" ]]; then
              root_baseline_identity="$current"
            elif [[ "$current" != "$root_baseline_identity" ]]; then
              mark_carrier_identity_poisoned
              return 1
            fi
            printf 'ROOT_ADMISSION=PASS\nROOT_LITERAL=/\nROOT_CANONICAL=/\nROOT_DIRECTORY=YES\nROOT_SYMLINK=NO\nROOT_UID=0\nROOT_GID=0\nROOT_MODE_GROUP_OTHER_WRITE=NONE\nROOT_EXTENDED_ACCESS_ACL=NONE\nROOT_DEFAULT_ACL=NONE\nROOT_BASELINE_IDENTITY=%s\n' "$root_baseline_identity"
          }

          admit_carrier_snapshot() {
            local current
            [[ "$carrier" == "/s8-ci-carrier-${run_id}.${run_attempt}" ]] || return 1
            if ! current="$(admit_root_owned_directory "$carrier" "$carrier" / 0755)"; then
              [[ "$carrier_identity_recorded" == 1 ]] && mark_carrier_identity_poisoned
