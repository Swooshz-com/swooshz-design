name: S8 FBX end-to-end contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  s8-static:
    name: S8 static and TypeScript floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret preflight
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- .; then
            echo "credential-like material detected in tracked files" >&2
            exit 1
          fi
      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false
      - name: Full repository tests
        run: pnpm test
      - name: Writer contract regression
        run: python3 scripts/s8/blender_writer_contract_regression.py
      - name: Python syntax
        run: python3 -m py_compile blender/s8-fbx-writer/writer.py scripts/s8/*.py
      - name: Diff hygiene
        run: git diff --check
      - name: Application build
        run: pnpm run build

  s8-native:
    name: S8 native validator and process runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Build and run native process boundary
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-process-runner -B "$RUNNER_TEMP/s8-runner" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-runner" --config Release --parallel
          registered="$(ctest --test-dir "$RUNNER_TEMP/s8-runner" -N | awk 'index($0, "s8-runner.") { count += 1 } END { print count + 0 }')"
          printf 'REGISTERED_NATIVE_CASES=%s\n' "$registered"
          test "$registered" -eq 20
          ctest --test-dir "$RUNNER_TEMP/s8-runner" -R '^s8-runner\.' --output-on-failure
      - name: Build and run native validator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-fbx-validator -B "$RUNNER_TEMP/s8-validator" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-validator" --config Release --parallel
          ctest --test-dir "$RUNNER_TEMP/s8-validator" --output-on-failure
          "$RUNNER_TEMP/s8-validator/s8-fbx-validator" --self-test

  # This job is the accepted Option-B environment amendment. It intentionally
  # keeps the native runner and candidate qualification inside the hosted
  # Bubblewrap boundary; no product or native source is changed here.
  s8-pinned-blender:
    name: S8 pinned Blender hosted sandbox amendment
    runs-on: ubuntu-24.04
    env:
      S8_RUNNER_LABEL: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Hosted sandbox environment amendment
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C

          candidate_started=0
          failure_reported=0
          carrier_created=0
          temp_created=0
          provision_created=0
          carrier_parent="/opt/s8-ci-carrier"
          run_id="${GITHUB_RUN_ID:-}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-}"
          carrier=""
          temp_root=""
          provision_root=""
          candidate_marker_file=""
          tmpfs_bytes=1073741824

          fail_hold() {
            failure_reported=1
            printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            printf 'HOSTED_SANDBOX_HOLD_REASON=%s\n' "$1" >&2
            exit 1
          }

          fail_amendment() {
            failure_reported=1
            printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
            printf 'AMENDMENT_FAILURE_REASON=%s\n' "$1" >&2
            exit 1
          }

          assert_root_component() {
            local path="$1"
            local mode
            [[ -e "$path" && ! -L "$path" ]] || return 1
            [[ "$(stat -c '%u:%g' -- "$path")" == "0:0" ]] || return 1
            mode="$(stat -c '%a' -- "$path")"
            (( (8#$mode & 022) == 0 )) || return 1
          }

          mount_target_admission() {
            local resolved="$1"
            local mount_targets="$2"
            local matching_targets
            if ! matching_targets="$(printf '%s\n' "$mount_targets" | awk -v p="$resolved" 'NF && ($0 == p || index($0, p "/") == 1) { print }')"; then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_FILTER_FAILED\n' >&2
              return 1
            fi
            if [[ -n "$matching_targets" ]]; then
              printf 'MOUNT_TABLE_ADMISSION=EXACT_OR_DESCENDANT_MOUNT_PRESENT\n' >&2
              return 1
            fi
            printf 'MOUNT_TABLE_ADMISSION=NO_EXACT_OR_DESCENDANT_MOUNT\n'
            return 0
          }

          mount_table_targets=""

          read_mount_table() {
            local stderr_file
            local stderr_excerpt
            stderr_file="$(/usr/bin/mktemp)" || {
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=READER_TEMPFILE_CREATE_FAILED\n' >&2
              return 1
            }
            if ! mount_table_targets="$(/usr/bin/findmnt -k -r -n -o TARGET 2>"$stderr_file")"; then
              stderr_excerpt="$(/usr/bin/head -c 512 -- "$stderr_file" | /usr/bin/tr '\r\n' '  ' || true)"
              /usr/bin/rm -f -- "$stderr_file" || true
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=FINDMNT_COMMAND_FAILURE\n' >&2
              if [[ -n "$stderr_excerpt" ]]; then
                printf 'MOUNT_TABLE_LIVE_READER_DIAGNOSTIC=%s\n' "$stderr_excerpt" >&2
              else
                printf 'MOUNT_TABLE_LIVE_READER_DIAGNOSTIC=NO_STDERR\n' >&2
              fi
              return 1
            fi
            stderr_excerpt="$(/usr/bin/head -c 512 -- "$stderr_file" | /usr/bin/tr '\r\n' '  ' || true)"
            /usr/bin/rm -f -- "$stderr_file" || true
            if [[ -n "$stderr_excerpt" ]]; then
              printf 'MOUNT_TABLE_LIVE_READER_DIAGNOSTIC=%s\n' "$stderr_excerpt" >&2
            fi
            if [[ -z "$mount_table_targets" ]]; then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=EMPTY_TARGET_SET\n' >&2
              return 1
            fi
          }

          mount_table_admission() {
            local resolved="$1"
            read_mount_table || return 1
            mount_target_admission "$resolved" "$mount_table_targets"
          }

          run_live_mount_reader_admission() {
            local findmnt_version
            local mountinfo_lines
            local live_probe='/s8-mount-admission-live-reader-probe'
            if ! findmnt_version="$(/usr/bin/findmnt --version 2>&1 | /usr/bin/tr '\r\n' ' ')" || [[ -z "$findmnt_version" ]]; then
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=FINDMNT_VERSION_UNAVAILABLE\n' >&2
              return 1
            fi
            printf 'FINDMNT_VERSION=%s\n' "$findmnt_version"
            if [[ ! -r /proc/self/mountinfo ]]; then
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=KERNEL_MOUNTINFO_UNREADABLE\n' >&2
              return 1
            fi
            mountinfo_lines="$(/usr/bin/wc -l < /proc/self/mountinfo)" || {
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=KERNEL_MOUNTINFO_READ_FAILED\n' >&2
              return 1
            }
            if [[ ! "$mountinfo_lines" =~ ^[1-9][0-9]*$ ]]; then
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=KERNEL_MOUNTINFO_EMPTY\n' >&2
              return 1
            fi
            printf 'PROC_SELF_MOUNTINFO=READABLE_NONEMPTY\n'
            read_mount_table || return 1
            printf 'UNFILTERED_KERNEL_TABLE_COMMAND=PASS\nCAPTURED_MOUNT_TARGET_SET=NONEMPTY\nLIVE_MOUNT_TABLE_READ=PASS\n'
            if ! printf '%s\n' "$mount_table_targets" | /usr/bin/grep -Fx -- / >/dev/null; then
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=ROOT_MOUNT_TARGET_MISSING\n' >&2
              return 1
            fi
            printf 'LIVE_ROOT_MOUNT_PRESENT=PASS\n'
            mount_target_admission "$live_probe" "$mount_table_targets" >/dev/null || {
              printf 'MOUNT_TABLE_LIVE_READER=FAIL\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=LIVE_PROBE_REJECTED\n' >&2
              return 1
            }
            printf 'MOUNT_TABLE_LIVE_READER=PASS\n'
          }

          run_mount_admission_regression() {
            local fixture_root='/run/s8-mount-admission-regression'
            local ordinary_mounts=$'/\n/proc\n/dev'
            local exact_mounts="${ordinary_mounts}"$'\n'"${fixture_root}"
            local descendant_mounts="${ordinary_mounts}"$'\n'"${fixture_root}/descendant"
            mount_target_admission "$fixture_root" "$ordinary_mounts" || fail_amendment "MOUNT_ADMISSION_REGRESSION_FRESH_REJECTED"
            printf 'SYNTHETIC_SAFE_CASE=PASS\n'
            if mount_target_admission "$fixture_root" "$exact_mounts" >/dev/null 2>&1; then
              fail_amendment "MOUNT_ADMISSION_REGRESSION_EXACT_ACCEPTED"
            fi
            printf 'SYNTHETIC_EXACT_MOUNT_REJECTION=PASS\n'
            if mount_target_admission "$fixture_root" "$descendant_mounts" >/dev/null 2>&1; then
              fail_amendment "MOUNT_ADMISSION_REGRESSION_DESCENDANT_ACCEPTED"
            fi
            printf 'SYNTHETIC_DESCENDANT_MOUNT_REJECTION=PASS\n'
            printf 'CASE_1=FRESH_NON_MOUNT_DIRECTORY_WITH_NO_DESCENDANT_MOUNTS=>ACCEPT\nCASE_2_EXACT=EXACT_MOUNT_TARGET_PRESENT=>REJECT\nCASE_2_DESCENDANT=DESCENDANT_MOUNT_TARGET_PRESENT=>REJECT\nMOUNT_ADMISSION_REGRESSION=PASS\n'
            run_live_mount_reader_admission || fail_hold "MOUNT_TABLE_LIVE_READER_FAILED"
          }

          carrier_path_is_safe() {
            local parent_resolved
            local carrier_resolved
            [[ "$carrier" == "$carrier_parent/$run_id.$run_attempt" ]] || return 1
            [[ -e "$carrier" && ! -L "$carrier" ]] || return 1
            parent_resolved="$(realpath -e -- "$carrier_parent")" || return 1
            carrier_resolved="$(realpath -e -- "$carrier")" || return 1
            [[ "$parent_resolved" == "$carrier_parent" ]] || return 1
            [[ "$carrier_resolved" == "$carrier" ]] || return 1
            [[ "$(dirname -- "$carrier_resolved")" == "$carrier_parent" ]] || return 1
            assert_root_component /opt || return 1
            assert_root_component "$carrier_parent" || return 1
            assert_root_component "$carrier" || return 1
            mount_table_admission "$carrier_resolved"
          }

          temp_path_is_safe() {
            local parent_resolved
            local temp_resolved
            [[ -n "$temp_root" && -n "${RUNNER_TEMP:-}" ]] || return 1
            parent_resolved="$(realpath -e -- "$RUNNER_TEMP")" || return 1
            temp_resolved="$(realpath -e -- "$temp_root")" || return 1
            [[ "$temp_resolved" == "$parent_resolved/s8-g3-$run_id.$run_attempt" ]] || return 1
            [[ "$temp_resolved" == "$temp_root" && ! -L "$temp_root" ]] || return 1
            mount_table_admission "$temp_resolved"
          }

          provision_path_is_safe() {
            local parent_resolved
            local provision_resolved
            [[ -n "$provision_root" && -n "${RUNNER_TEMP:-}" ]] || return 1
            parent_resolved="$(realpath -e -- "$RUNNER_TEMP")" || return 1
            provision_resolved="$(realpath -e -- "$provision_root")" || return 1
            [[ "$provision_resolved" == "$parent_resolved/s8-bwrap-$run_id.$run_attempt" ]] || return 1
            [[ "$provision_resolved" == "$provision_root" && ! -L "$provision_root" ]] || return 1
            mount_table_admission "$provision_resolved"
          }

          remove_carrier_exact() {
            carrier_path_is_safe || return 1
            /usr/bin/sudo -n /usr/bin/rm -rf -- "$carrier"
            [[ ! -e "$carrier" && ! -L "$carrier" ]]
          }

          remove_temp_exact() {
            temp_path_is_safe || return 1
            /usr/bin/rm -rf -- "$temp_root"
            [[ ! -e "$temp_root" && ! -L "$temp_root" ]]
          }

          remove_provision_exact() {
            provision_path_is_safe || return 1
            /usr/bin/rm -rf -- "$provision_root"
            [[ ! -e "$provision_root" && ! -L "$provision_root" ]]
          }

          cleanup() {
            local status=$?
            local cleanup_failed=0
            trap - EXIT
            if (( carrier_created == 1 )); then
              if remove_carrier_exact; then
                printf 'CLEANUP_CONFINEMENT_RESULT=PASS\nCLEANUP_RESULT=PASS\n'
                carrier_created=0
              else
                printf 'CLEANUP_CONFINEMENT_RESULT=FAIL\nCLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( temp_created == 1 )); then
              if remove_temp_exact; then
                temp_created=0
              else
                printf 'TEMP_CLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( provision_created == 1 )); then
              if remove_provision_exact; then
                printf 'PROVISIONING_CLEANUP_RESULT=PASS\n'
                provision_created=0
              else
                printf 'PROVISIONING_CLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if [[ -n "$candidate_marker_file" && -e "$candidate_marker_file" ]]; then
              candidate_started=1
            fi
            if (( cleanup_failed == 1 )); then
              status=1
              if (( failure_reported == 0 )); then
                printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
              fi
            elif (( status != 0 && failure_reported == 0 && candidate_started == 0 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            elif (( status != 0 && failure_reported == 0 && candidate_started == 1 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_FAILURE_UNCLASSIFIED\n' >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT
          run_mount_admission_regression

          [[ "$run_id" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ID_NOT_DECIMAL"
          [[ "$run_attempt" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ATTEMPT_NOT_DECIMAL"
          carrier="$carrier_parent/$run_id.$run_attempt"
          printf 'HOST_CARRIER_ROOT=%s\nHOST_CARRIER_OWNERSHIP=root:root\nSANDBOX_UID=65534\nSANDBOX_GID=65534\n' "$carrier"

          runner_label="${S8_RUNNER_LABEL:-}"
          [[ "$runner_label" == "ubuntu-24.04" ]] || fail_hold "RUNNER_LABEL_UNEXPECTED"
          runner_arch="${RUNNER_ARCH:-}"
          [[ "$runner_arch" == "X64" ]] || fail_hold "RUNNER_ARCH_UNEXPECTED"
          os_id="$(awk -F= '$1 == "ID" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          version_id="$(awk -F= '$1 == "VERSION_ID" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          version_codename="$(awk -F= '$1 == "VERSION_CODENAME" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          dpkg_arch="$(/usr/bin/dpkg --print-architecture)"
          [[ "$os_id" == "ubuntu" ]] || fail_hold "OS_ID_UNEXPECTED"
          [[ "$version_id" == "24.04" ]] || fail_hold "VERSION_ID_UNEXPECTED"
          [[ "$version_codename" == "noble" ]] || fail_hold "VERSION_CODENAME_UNEXPECTED"
          [[ "$dpkg_arch" == "amd64" ]] || fail_hold "DPKG_ARCH_UNEXPECTED"
          printf 'OS_ID=%s\nVERSION_ID=%s\nVERSION_CODENAME=%s\nDPKG_ARCH=%s\nRUNNER_LABEL=%s\nRUNNER_ARCH=%s\n' "$os_id" "$version_id" "$version_codename" "$dpkg_arch" "$runner_label" "$runner_arch"

          [[ "$EUID" -ne 0 ]] || fail_hold "HOST_ORCHESTRATOR_IS_ROOT"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[1-9][0-9]*$ ]] || fail_hold "RUNNER_UID_INVALID"
          [[ "$runner_gid" =~ ^[1-9][0-9]*$ ]] || fail_hold "RUNNER_GID_INVALID"
          command -v /usr/bin/sudo >/dev/null 2>&1 || fail_hold "SUDO_UNAVAILABLE"
          /usr/bin/sudo -n /usr/bin/true || fail_hold "SUDO_NONINTERACTIVE_UNAVAILABLE"

          runner_temp_resolved="$(realpath -e -- "${RUNNER_TEMP:-}")" || fail_hold "RUNNER_TEMP_REALPATH_FAILED"
          [[ -d "$runner_temp_resolved" && ! -L "$runner_temp_resolved" ]] || fail_hold "RUNNER_TEMP_INVALID"
          provision_root="$runner_temp_resolved/s8-bwrap-$run_id.$run_attempt"
          [[ ! -e "$provision_root" && ! -L "$provision_root" ]] || fail_hold "PROVISIONING_PATH_NOT_FRESH"
          /usr/bin/install -d -m 0700 -- "$provision_root" || fail_hold "PROVISIONING_ROOT_CREATE_FAILED"
          provision_created=1
          provision_path_is_safe || fail_hold "PROVISIONING_ROOT_ADMISSION_FAILED"
          printf 'BWRAP_PROVISIONING_ROOT=%s\n' "$provision_root"

          expected_bwrap_version='0.9.0-1ubuntu0.3'
          expected_bwrap_deb='bubblewrap_0.9.0-1ubuntu0.3_amd64.deb'
          archive_base_url='https://security.ubuntu.com/ubuntu'
          apt_root="$provision_root/apt"
          apt_lists="$apt_root/lists"
          apt_cache="$apt_root/cache"
          apt_archives="$apt_cache/archives"
          apt_sources="$apt_root/sources.list"
          archive_root="$provision_root/archive"
          verify_root="$provision_root/verified-package"
          /usr/bin/install -d -m 0700 -- "$apt_lists/partial" "$apt_archives/partial" "$archive_root" "$verify_root" || fail_hold "PROVISIONING_LAYOUT_CREATE_FAILED"
          inrelease="$archive_root/InRelease"
          inrelease_payload="$archive_root/InRelease.payload"
          inrelease_status="$archive_root/InRelease.gpg-status"
          inrelease_stderr="$archive_root/InRelease.gpg-stderr"
          packages_index="$archive_root/Packages.xz"
          packages_plain="$archive_root/Packages"
          bubblewrap_stanza="$archive_root/bubblewrap.stanza"
          bubblewrap_deb="$archive_root/$expected_bwrap_deb"
          package_plan="$archive_root/package-plan.txt"

          [[ -f /usr/share/keyrings/ubuntu-archive-keyring.gpg && ! -L /usr/share/keyrings/ubuntu-archive-keyring.gpg ]] || fail_hold "UBUNTU_ARCHIVE_KEYRING_INVALID"
          apt_source_line='deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main'
          printf '%s\n' "$apt_source_line" > "$apt_sources"
          [[ "$(wc -l < "$apt_sources")" == 1 ]] || fail_hold "APT_SOURCE_LINE_COUNT_INVALID"
          grep -Fx -- "$apt_source_line" "$apt_sources" >/dev/null || fail_hold "APT_SOURCE_LINE_INVALID"
          printf 'APT_SOURCE=%s\n' "$apt_source_line"

          existing_bwrap_status="$(/usr/bin/dpkg-query -W -f='${Status}' bubblewrap 2>/dev/null || true)"
          if [[ -n "$existing_bwrap_status" && "$existing_bwrap_status" != 'unknown ok not-installed' ]]; then
            fail_hold "PRE_EXISTING_BUBBLEWRAP_PACKAGE"
          fi
          if [[ -e /usr/bin/bwrap || -L /usr/bin/bwrap ]]; then
            fail_hold "PRE_EXISTING_BWRAP_PATH"
          fi

          fetch_exact_archive() {
            local destination="$1"
            local url="$2"
            /usr/bin/curl --config /dev/null --fail --silent --show-error --proto '=https' --tlsv1.2 --location --max-redirs 0 --retry 3 --output "$destination" "$url"
          }

          fetch_exact_archive "$inrelease" "$archive_base_url/dists/noble-security/InRelease" || fail_hold "UBUNTU_INRELEASE_DOWNLOAD_FAILED"
          [[ -f "$inrelease" && ! -L "$inrelease" ]] || fail_hold "UBUNTU_INRELEASE_PATH_INVALID"
          /usr/bin/gpgv --status-fd 3 --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg --output "$inrelease_payload" "$inrelease" 3>"$inrelease_status" 2>"$inrelease_stderr" || fail_hold "UBUNTU_INRELEASE_SIGNATURE_INVALID"
          mapfile -t valid_fingerprints < <(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $3 }' "$inrelease_status")
          [[ "${#valid_fingerprints[@]}" == 1 && "${valid_fingerprints[0]}" == 'F6ECB3762474EDA9D21B7022871920D1991BC93C' ]] || fail_hold "UBUNTU_ARCHIVE_SIGNING_KEY_FINGERPRINT_INVALID"
          printf 'UBUNTU_INRELEASE_SIGNATURE=PASS\nUBUNTU_ARCHIVE_KEY_FINGERPRINT=%s\n' "${valid_fingerprints[0]}"

          inrelease_field() {
            local field="$1"
            local value_count
            value_count="$(awk -F': ' -v key="$field" '$1 == key { count += 1 } END { print count + 0 }' "$inrelease_payload")"
            [[ "$value_count" == 1 ]] || return 1
            awk -F': ' -v key="$field" '$1 == key { print substr($0, index($0, ": ") + 2) }' "$inrelease_payload"
          }

          [[ "$(inrelease_field Origin)" == 'Ubuntu' ]] || fail_hold "UBUNTU_INRELEASE_ORIGIN_INVALID"
          [[ "$(inrelease_field Suite)" == 'noble-security' ]] || fail_hold "UBUNTU_INRELEASE_SUITE_INVALID"
          [[ "$(inrelease_field Codename)" == 'noble' ]] || fail_hold "UBUNTU_INRELEASE_CODENAME_INVALID"
          inrelease_components="$(inrelease_field Components)" || fail_hold "UBUNTU_INRELEASE_COMPONENTS_MISSING"
          grep -Fw -- main <<< "$inrelease_components" >/dev/null || fail_hold "UBUNTU_INRELEASE_MAIN_COMPONENT_MISSING"
          inrelease_architectures="$(inrelease_field Architectures)" || fail_hold "UBUNTU_INRELEASE_ARCHITECTURES_MISSING"
          grep -Fw -- amd64 <<< "$inrelease_architectures" >/dev/null || fail_hold "UBUNTU_INRELEASE_AMD64_MISSING"
          inrelease_date="$(inrelease_field Date)" || fail_hold "UBUNTU_INRELEASE_DATE_MISSING"
