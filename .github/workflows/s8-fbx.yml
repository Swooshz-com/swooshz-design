          work_identity_admission() {
            local expected_mode="$1"
            local acl_kind="$2"
            local before after resolved owner mode_raw full_mode_value mode_value acl_text
            [[ -n "$work" && "$work" == "$immutable_work_path" ]] || return 1
            before="$(stable_identity "$work")" || return 1
            [[ -d "$work" && ! -L "$work" ]] || return 1
            resolved="$(/usr/bin/realpath -e -- "$work")" || return 1
            [[ "$resolved" == "$carrier/work" ]] || return 1
            [[ "$(/usr/bin/dirname -- "$resolved")" == "$carrier" ]] || return 1
            owner="$(/usr/bin/stat -c '%u:%g' -- "$work")" || return 1
            [[ "$owner" == 0:0 ]] || return 1
            mode_raw="$(/usr/bin/stat -c '%a' -- "$work")" || return 1
            [[ "$mode_raw" =~ ^[0-7]{3,4}$ ]] || return 1
            full_mode_value=$((8#$mode_raw))
            mode_value=$((full_mode_value & 0777))
            [[ "$full_mode_value" == $((8#$expected_mode)) ]] || return 1
            if [[ "$acl_kind" == ordinary ]]; then
              ordinary_acl_is_exact "$work" "$(printf '0%03o' "$mode_value")" || return 1
            else
              acl_text="$(/usr/bin/sudo -n /usr/bin/getfacl --numeric --omit-header --absolute-names -- "$work")" || return 1
              work_acl_is_exact "$acl_text" || return 1
            fi
            after="$(stable_identity "$work")" || return 1
            [[ "$before" == "$after" ]] || return 1
            printf '%s\n' "$after"
          }

          admit_work_for_use() {
            local current device_inode
            current="$(work_identity_admission 0770 exact)" || return 1
            device_inode="$(printf '%s\n' "$current" | /usr/bin/awk -F: '{ print $1 ":" $2 }')"
            [[ "$device_inode" == "$work_device_inode" ]] || return 1
          }

          admit_before_bwrap() {
            local context="$1"
            admit_root_and_carrier || return 1
            mount_table_admission "$carrier" || return 1
            admit_work_for_use || return 1
            printf 'BWRAP_ADMISSION_CONTEXT=%s\nROOT_ADMISSION=PASS\nCARRIER_IDENTITY_STABLE=YES\nMOUNT_ADMISSION=PASS\nWORK_IDENTITY_STABLE=YES\n' "$context"
          }

          admit_embedded_carrier_state() {
