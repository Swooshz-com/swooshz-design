            mode_raw="$(/usr/bin/stat -c '%a' -- "$work")" || return 1
            [[ "$mode_raw" =~ ^[0-7]{3,4}$ ]] || return 1
            full_mode_value=$((8#$mode_raw))
            mode_value=$((full_mode_value & 0777))
            [[ "$full_mode_value" == $((8#$expected_mode)) ]] || return 1
            if [[ "$acl_kind" == ordinary ]]; then
              ordinary_acl_is_exact "$work" "$(printf '0%03o' "$mode_value")" || return 1
