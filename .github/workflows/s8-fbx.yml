                  elif mask is not None:
                      effective = _permission_text(_permission_bits(raw_permissions) & mask_bits)
                  else:
                      effective = raw_permissions
                  annotation = entry_value["annotation"]
                  if annotation is not None and annotation != effective:
                      raise ValueError("ACL_EFFECTIVE_ANNOTATION_MISMATCH")
                  entry_value["effective"] = effective
              return entries


          def seed_evidence_signature(snapshot: dict[str, object]) -> tuple[object, ...]:
              acl_signature = []
