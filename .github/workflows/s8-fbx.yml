              def observed_print(*args, **kwargs):
                  line = " ".join(str(arg) for arg in args)
                  if line.startswith("BWRAP_DESTINATION_ORDER_ADMISSION="):
                      events.append("BWRAP_DESTINATION_ORDER_ADMISSION")
                  elif line.startswith("CANDIDATE_EXECUTION_START="):
                      events.append("CANDIDATE_EXECUTION_START")
                  return original_print(*args, **kwargs)

              def observed_write_text(path, *args, **kwargs):
                  if path == marker_path:
                      events.append("MARKER_WRITE")
                  return original_write_text(path, *args, **kwargs)

              admission_status = 0
              calls.clear()
              captured_stdout = io.StringIO()
              captured_stderr = io.StringIO()
              builtins.print = observed_print
              Path.write_text = observed_write_text
              try:
                  with contextlib.redirect_stdout(captured_stdout), contextlib.redirect_stderr(captured_stderr):
                      first_result = module_globals["run_sandbox"](*run_args, **run_kwargs)
                      first_marker_bytes = marker_path.read_bytes()
                      first_marker_text = marker_path.read_text(encoding="ascii")
                      first_events = list(events)
                      events.clear()
                      calls.clear()
                      second_result = module_globals["run_sandbox"](*run_args, **run_kwargs)
                      second_marker_bytes = marker_path.read_bytes()
                      second_events = list(events)
              finally:
                  Path.write_text = original_write_text
