            [[ "$value_count" == 1 ]] || return 1
            awk -F': ' -v key="$field" '$1 == key { print substr($0, index($0, ": ") + 2) }' "$inrelease_payload"
          }

          ubuntu_inrelease_freshness() {
            /usr/bin/python3 - "$@" <<'PY'
          import calendar
          import datetime
          import re
          import sys

          LOCAL_MAX_AGE = 172800
          MAX_FUTURE_SKEW = 10
          MAX_SIGNED_EPOCH = 9223372036854775807
          TIMESTAMP_RE = re.compile(
              r"^(?P<weekday>Mon|Tue|Wed|Thu|Fri|Sat|Sun),[ \t]+"
              r"(?P<day>[0-9]{1,2})[ \t]+"
              r"(?P<month>Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[ \t]+"
              r"(?P<year>[0-9]{4})[ \t]+"
              r"(?P<hour>[0-9]{1,2}):(?P<minute>[0-9]{2}):(?P<second>[0-9]{2})[ \t]+UTC$"
          )
          MONTHS = {
              "Jan": 1, "Feb": 2, "Mar": 3, "Apr": 4, "May": 5, "Jun": 6,
              "Jul": 7, "Aug": 8, "Sep": 9, "Oct": 10, "Nov": 11, "Dec": 12,
          }


          class Reject(Exception):
              pass


          def reject(code):
              raise Reject(code)


          def parse_archive_timestamp(raw):
              value = raw.strip(" \t")
              match = TIMESTAMP_RE.fullmatch(value)
              if match is None:
                  reject("TIMESTAMP_SYNTAX")
              parts = match.groupdict()
              try:
                  timestamp = datetime.datetime(
                      int(parts["year"]),
                      MONTHS[parts["month"]],
                      int(parts["day"]),
                      int(parts["hour"]),
                      int(parts["minute"]),
                      int(parts["second"]),
                      tzinfo=datetime.timezone.utc,
                  )
              except (KeyError, OverflowError, ValueError):
                  reject("TIMESTAMP_CALENDAR")
              if timestamp.strftime("%a") != parts["weekday"]:
                  reject("TIMESTAMP_WEEKDAY")
              try:
                  epoch = calendar.timegm(timestamp.utctimetuple())
              except (OverflowError, ValueError):
                  reject("TIMESTAMP_EPOCH")
              if not -MAX_SIGNED_EPOCH <= epoch <= MAX_SIGNED_EPOCH:
                  reject("TIMESTAMP_EPOCH_OVERFLOW")
              return epoch


          def parse_epoch(raw, label):
              if re.fullmatch(r"[0-9]+", raw or "") is None:
                  reject(f"{label}_NOT_DECIMAL")
              try:
                  value = int(raw, 10)
              except (OverflowError, ValueError):
                  reject(f"{label}_OVERFLOW")
              if value > MAX_SIGNED_EPOCH:
                  reject(f"{label}_OVERFLOW")
              return value


          def parse_lines(lines):
              date_values = []
              valid_until_values = []
              for line in lines:
                  if line.startswith("Date:"):
                      date_values.append(line[len("Date:"):].strip(" \t"))
                  elif line.startswith("Valid-Until:"):
                      valid_until_values.append(line[len("Valid-Until:"):].strip(" \t"))
              if len(date_values) != 1:
                  reject("DATE_CARDINALITY")
              if not date_values[0]:
                  reject("DATE_EMPTY")
              if len(valid_until_values) > 1:
                  reject("VALID_UNTIL_CARDINALITY")
              if valid_until_values and not valid_until_values[0]:
                  reject("VALID_UNTIL_EMPTY")
              signed_date = parse_archive_timestamp(date_values[0])
              valid_until = None
              if valid_until_values:
                  valid_until = parse_archive_timestamp(valid_until_values[0])
              return {
                  "date_count": len(date_values),
                  "valid_until_count": len(valid_until_values),
                  "signed_date": signed_date,
                  "valid_until": valid_until,
              }


          def parse_payload(path):
              try:
                  with open(path, "r", encoding="utf-8", errors="strict", newline="") as handle:
                      return parse_lines(handle.read().splitlines())
              except (OSError, UnicodeError):
                  reject("PAYLOAD_READ")


          def evaluate(parsed, before, after):
              if after < before:
                  reject("BACKWARD_CLOCK")
              now = after
              signed_date = parsed["signed_date"]
              local_expiry = signed_date + LOCAL_MAX_AGE
              if signed_date > now + MAX_FUTURE_SKEW:
                  reject("DATE_IN_FUTURE")
              if now >= local_expiry:
                  reject("DATE_TOO_OLD")
              valid_until = parsed["valid_until"]
              if valid_until is not None:
                  if valid_until <= signed_date:
                      reject("VALID_UNTIL_NOT_AFTER_DATE")
                  if now >= valid_until:
                      reject("VALID_UNTIL_EXPIRED")
                  effective_expiry = min(local_expiry, valid_until)
              else:
                  effective_expiry = local_expiry
              if now >= effective_expiry:
                  reject("EFFECTIVE_EXPIRY_REACHED")
              return {
                  "now": now,
                  "effective_expiry": effective_expiry,
              }


          def archive_timestamp(epoch):
              value = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc)
              return value.strftime("%a, %d %b %Y %H:%M:%S UTC")


          def synthetic_payload(date_value=None, valid_until_value=None, extra_lines=()):
              lines = []
              if date_value is not None:
                  lines.append(f"Date: {date_value}")
              if valid_until_value is not None:
                  lines.append(f"Valid-Until: {valid_until_value}")
              lines.extend(extra_lines)
              return "\n".join(lines) + "\n"


          def expect_pass(name, payload, before, after, expected_effective=None, label="PASS"):
              result = evaluate(
                  parse_lines(payload.splitlines()),
                  parse_epoch(str(before), "BEFORE"),
                  parse_epoch(str(after), "AFTER"),
              )
              if expected_effective is not None and result["effective_expiry"] != expected_effective:
                  reject(f"REGRESSION_{name}_EFFECTIVE_EXPIRY")
              print(f"UBUNTU_INRELEASE_FRESHNESS_REGRESSION_{name}={label}")


          def expect_reject(name, payload, before, after):
              try:
                  evaluate(
                      parse_lines(payload.splitlines()),
                      parse_epoch(str(before), "BEFORE"),
                      parse_epoch(str(after), "AFTER"),
                  )
              except Reject:
                  print(f"UBUNTU_INRELEASE_FRESHNESS_REGRESSION_{name}=REJECT")
                  return
              reject(f"REGRESSION_{name}_ACCEPTED")


          def run_regressions():
