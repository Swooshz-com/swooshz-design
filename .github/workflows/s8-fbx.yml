              def verify_acl_scope(path: Path, scope: str, expected: dict[str, str]) -> None:
                  command = [
                      "/usr/bin/getfacl", "--numeric", "--absolute-names", "--all-effective",
                      "--access" if scope == "access" else "--default", "--", str(path),
                  ]
                  try:
                      result = subprocess.run(
                          command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          timeout=30,
                          check=False,
                      )
                  except (OSError, subprocess.TimeoutExpired):
                      module_globals["fail"]("FIXTURE_ACL_TOOL_UNAVAILABLE", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
                  if result.returncode != 0:
                      module_globals["fail"]("FIXTURE_ACL_TOOL_FAILED", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
                  try:
                      parsed = module_globals["parse_numeric_acl_evidence"](
                          result.stdout.decode("ascii", "strict"), path, os.lstat(path), scope
                      )
                  except (UnicodeDecodeError, ValueError):
                      module_globals["prove_seed_candidate_defect"]("FIXTURE_ACL_PARSE_INVALID", "FIXTURE")
                  actual = {key: entry["raw"] for key, entry in parsed.items()}
                  if actual != expected:
                      module_globals["prove_seed_candidate_defect"]("FIXTURE_ACL_SCOPE_NOT_CLEARED", "FIXTURE")

