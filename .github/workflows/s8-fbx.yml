            current_root="$(admit_root_owned_directory / / / '')" || return 1
            [[ "$current_root" == "$root_baseline_identity" ]] || return 1
            current_carrier="$(admit_root_owned_directory "$carrier" "$carrier" / 0755)" || return 1
            [[ "$current_carrier" == "$carrier_baseline_identity" ]] || return 1
            mount_table_admission "$carrier" || return 1
            current_work="$(work_identity_admission 0770 exact)" || return 1
            current_device_inode="$(printf '%s\n' "$current_work" | /usr/bin/awk -F: '{ print $1 ":" $2 }')"
