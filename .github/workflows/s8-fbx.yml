              def mapped_stream(*lines: bytes) -> bytes:
                  return b"\n".join(lines) + b"\n"

              def invoke_mapped_case(
                  label: str,
                  stdout_bytes: bytes = b"",
                  *,
                  stderr_bytes: bytes = b"",
                  returncode: int = 0,
                  launch_exception: BaseException | None = None,
                  expected_pass: bool = False,
                  expected_code: str | None = None,
                  expected_class: str | None = None,
                  expected_marker_created: bool | None = None,
                  expected_evidence: str | None = None,
              ):
                  mapped_marker = module_globals["candidate_defect_marker_path"]
                  if mapped_marker.exists():
                      mapped_marker.unlink()
                  original_mapped_run = module_globals["subprocess"].run
                  mapped_calls = []
                  captured_mapped_stdout = io.StringIO()
                  captured_mapped_stderr = io.StringIO()

                  def fake_mapped_run(command, **kwargs):
                      mapped_calls.append((command, kwargs))
                      if launch_exception is not None:
                          raise launch_exception
                      return SimpleNamespace(
                          returncode=returncode,
                          stdout=stdout_bytes,
                          stderr=stderr_bytes,
                      )

                  mapped_records = None
                  mapped_error = None
                  module_globals["subprocess"].run = fake_mapped_run
                  try:
                      with contextlib.redirect_stdout(captured_mapped_stdout):
                          with contextlib.redirect_stderr(captured_mapped_stderr):
                              mapped_records = module_globals["run_mapped_seed_probe"](
                                  sandbox,
                                  runner,
                                  work,
                                  runtime_root,
                                  writer_root,
                                  run060_expected_snapshots,
                              )
                  except SystemExit as error:
                      mapped_error = error
                  finally:
                      module_globals["subprocess"].run = original_mapped_run

                  mapped_diagnostic = captured_mapped_stderr.getvalue()
                  mapped_marker_created = mapped_marker.exists()
                  if mapped_marker_created:
                      mapped_marker.unlink()
                  if len(mapped_calls) != 1:
                      raise SystemExit(f"MAPPED_TEST_SUBPROCESS_CALL_COUNT_INVALID_{label}")
                  if expected_pass:
                      if mapped_error is not None or mapped_marker_created:
                          raise SystemExit(
                              f"MAPPED_TEST_EXPECTED_PASS_REJECTED_{label}: "
                              f"{mapped_diagnostic}"
                          )
                      if mapped_records is None or set(mapped_records) != {
                          "input.json", "expected.json"
                      }:
                          raise SystemExit(f"MAPPED_TEST_RESULT_SET_INVALID_{label}")
                      if (
                          captured_mapped_stdout.getvalue().count(
                              "MAPPED_PROBE_SUBPROCESS_STATUS="
                          ) != 1
                      ):
                          raise SystemExit(f"MAPPED_TEST_TRANSPORT_EVIDENCE_MISSING_{label}")
                      if (
                          expected_evidence is not None
                          and expected_evidence not in captured_mapped_stdout.getvalue()
                      ):
                          raise SystemExit(f"MAPPED_TEST_RAW_EVIDENCE_NOT_PRESERVED_{label}")
                      return mapped_records
                  if mapped_error is None:
                      raise SystemExit(f"MAPPED_TEST_EXPECTED_REJECTION_ACCEPTED_{label}")
                  if expected_class is None or f"FAILURE_CLASS={expected_class}" not in mapped_diagnostic:
                      raise SystemExit(
                          f"MAPPED_TEST_FAILURE_CLASS_INVALID_{label}: "
                          f"{mapped_diagnostic}"
                      )
                  if expected_code is None or f"S8_RUNTIME_SENSITIVITY_FAIL:{expected_code}" not in mapped_diagnostic:
                      raise SystemExit(
                          f"MAPPED_TEST_FAILURE_CODE_INVALID_{label}: "
                          f"{mapped_diagnostic}"
                      )
                  if expected_marker_created is None:
                      expected_marker_created = expected_class.startswith("CANDIDATE_DEFECT__")
                  if mapped_marker_created != expected_marker_created:
                      raise SystemExit(f"MAPPED_TEST_DEFECT_MARKER_CLASS_INVALID_{label}")
                  return None

