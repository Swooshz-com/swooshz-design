name: S8 FBX end-to-end contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  s8-static:
    name: S8 static and TypeScript floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret preflight
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- .; then
            echo "credential-like material detected in tracked files" >&2
            exit 1
          fi
      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false
      - name: Full repository tests
        run: pnpm test
      - name: Writer contract regression
        run: python3 scripts/s8/blender_writer_contract_regression.py
      - name: Python syntax
        run: python3 -m py_compile blender/s8-fbx-writer/writer.py scripts/s8/*.py
      - name: Diff hygiene
        run: git diff --check
      - name: Application build
        run: pnpm run build

  s8-native:
    name: S8 native validator and process runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Build and run native process boundary
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-process-runner -B "$RUNNER_TEMP/s8-runner" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-runner" --config Release --parallel
          registered="$(ctest --test-dir "$RUNNER_TEMP/s8-runner" -N | awk 'index($0, "s8-runner.") { count += 1 } END { print count + 0 }')"
          printf 'REGISTERED_NATIVE_CASES=%s\n' "$registered"
          test "$registered" -eq 20
          ctest --test-dir "$RUNNER_TEMP/s8-runner" -R '^s8-runner\.' --output-on-failure
      - name: Build and run native validator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-fbx-validator -B "$RUNNER_TEMP/s8-validator" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-validator" --config Release --parallel
          ctest --test-dir "$RUNNER_TEMP/s8-validator" --output-on-failure
          "$RUNNER_TEMP/s8-validator/s8-fbx-validator" --self-test

  # This job is the accepted Option-B environment amendment. It intentionally
  # keeps the native runner and candidate qualification inside the hosted
  # Bubblewrap boundary; no product or native source is changed here.
  s8-pinned-blender:
    name: S8 pinned Blender hosted sandbox amendment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Hosted sandbox environment amendment
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C

          candidate_started=0
          failure_reported=0
          carrier_created=0
          temp_created=0
          carrier_parent="/opt/s8-ci-carrier"
          run_id="${GITHUB_RUN_ID:-}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-}"
          carrier=""
          temp_root=""
          candidate_marker_file=""
          tmpfs_bytes=1073741824

          fail_hold() {
            failure_reported=1
            printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            printf 'HOSTED_SANDBOX_HOLD_REASON=%s\n' "$1" >&2
            exit 1
          }

          fail_amendment() {
            failure_reported=1
            printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
            printf 'AMENDMENT_FAILURE_REASON=%s\n' "$1" >&2
            exit 1
          }

          assert_root_component() {
            local path="$1"
            local mode
            [[ -e "$path" && ! -L "$path" ]] || return 1
            [[ "$(stat -c '%u:%g' -- "$path")" == "0:0" ]] || return 1
            mode="$(stat -c '%a' -- "$path")"
            (( (8#$mode & 022) == 0 )) || return 1
          }

          carrier_path_is_safe() {
            local parent_resolved
            local carrier_resolved
            local nested_mounts
            [[ "$carrier" == "$carrier_parent/$run_id.$run_attempt" ]] || return 1
            [[ -e "$carrier" && ! -L "$carrier" ]] || return 1
            parent_resolved="$(realpath -e -- "$carrier_parent")" || return 1
            carrier_resolved="$(realpath -e -- "$carrier")" || return 1
            [[ "$parent_resolved" == "$carrier_parent" ]] || return 1
            [[ "$carrier_resolved" == "$carrier" ]] || return 1
            [[ "$(dirname -- "$carrier_resolved")" == "$carrier_parent" ]] || return 1
            assert_root_component /opt || return 1
            assert_root_component "$carrier_parent" || return 1
            assert_root_component "$carrier" || return 1
            if /usr/bin/findmnt -rn --mountpoint "$carrier_resolved" >/dev/null 2>&1; then
              return 1
            fi
            nested_mounts="$(/usr/bin/findmnt -R -rn -o TARGET -- "$carrier_resolved" 2>/dev/null)" || return 1
            if printf '%s\n' "$nested_mounts" | awk -v p="$carrier_resolved" 'NF && ($0 == p || index($0, p "/") == 1) { bad = 1 } END { exit bad }'; then
              :
            else
              return 1
            fi
          }

          temp_path_is_safe() {
            local parent_resolved
            local temp_resolved
            local nested_mounts
            [[ -n "$temp_root" && -n "${RUNNER_TEMP:-}" ]] || return 1
            parent_resolved="$(realpath -e -- "$RUNNER_TEMP")" || return 1
            temp_resolved="$(realpath -e -- "$temp_root")" || return 1
            [[ "$temp_resolved" == "$parent_resolved/s8-g3-$run_id.$run_attempt" ]] || return 1
            [[ "$temp_resolved" == "$temp_root" && ! -L "$temp_root" ]] || return 1
            if /usr/bin/findmnt -rn --mountpoint "$temp_resolved" >/dev/null 2>&1; then
              return 1
            fi
            nested_mounts="$(/usr/bin/findmnt -R -rn -o TARGET -- "$temp_resolved" 2>/dev/null)" || return 1
            if printf '%s\n' "$nested_mounts" | awk -v p="$temp_resolved" 'NF && ($0 == p || index($0, p "/") == 1) { bad = 1 } END { exit bad }'; then
              :
            else
              return 1
            fi
            return 0
          }

          remove_carrier_exact() {
            carrier_path_is_safe || return 1
            /usr/bin/sudo -n /usr/bin/rm -rf -- "$carrier"
            [[ ! -e "$carrier" && ! -L "$carrier" ]]
          }

          remove_temp_exact() {
            temp_path_is_safe || return 1
            /usr/bin/rm -rf -- "$temp_root"
            [[ ! -e "$temp_root" && ! -L "$temp_root" ]]
          }

          cleanup() {
            local status=$?
            local cleanup_failed=0
            trap - EXIT
            if (( carrier_created == 1 )); then
              if remove_carrier_exact; then
                printf 'CLEANUP_CONFINEMENT_RESULT=PASS\nCLEANUP_RESULT=PASS\n'
                carrier_created=0
              else
                printf 'CLEANUP_CONFINEMENT_RESULT=FAIL\nCLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( temp_created == 1 )); then
              if remove_temp_exact; then
                temp_created=0
              else
                printf 'TEMP_CLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if [[ -n "$candidate_marker_file" && -e "$candidate_marker_file" ]]; then
              candidate_started=1
            fi
            if (( cleanup_failed == 1 )); then
              status=1
              if (( failure_reported == 0 )); then
                printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
              fi
            elif (( status != 0 && failure_reported == 0 && candidate_started == 0 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            elif (( status != 0 && failure_reported == 0 && candidate_started == 1 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_FAILURE_UNCLASSIFIED\n' >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT

          [[ "$run_id" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ID_NOT_DECIMAL"
          [[ "$run_attempt" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ATTEMPT_NOT_DECIMAL"
          carrier="$carrier_parent/$run_id.$run_attempt"

          [[ "$EUID" -ne 0 ]] || fail_hold "HOST_ORCHESTRATOR_IS_ROOT"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[1-9][0-9]*$ ]] || fail_hold "RUNNER_UID_INVALID"
          [[ "$runner_gid" =~ ^[1-9][0-9]*$ ]] || fail_hold "RUNNER_GID_INVALID"
          command -v /usr/bin/sudo >/dev/null 2>&1 || fail_hold "SUDO_UNAVAILABLE"
          /usr/bin/sudo -n /usr/bin/true || fail_hold "SUDO_NONINTERACTIVE_UNAVAILABLE"

          [[ -x /usr/bin/bwrap && ! -L /usr/bin/bwrap ]] || fail_hold "BWRAP_PATH_INVALID"
          bwrap_realpath="$(realpath -e -- /usr/bin/bwrap)" || fail_hold "BWRAP_REALPATH_FAILED"
          [[ "$bwrap_realpath" == "/usr/bin/bwrap" ]] || fail_hold "BWRAP_REALPATH_UNEXPECTED"
          bwrap_sha256="$(sha256sum -- /usr/bin/bwrap | awk '{print $1}')" || fail_hold "BWRAP_HASH_FAILED"
          bwrap_version="$(/usr/bin/sudo -n /usr/bin/bwrap --version)" || fail_hold "BWRAP_VERSION_FAILED"
          bwrap_package="$(/usr/bin/dpkg-query -W -f='${Package}=${Version}' bubblewrap 2>/dev/null)" || fail_hold "BWRAP_PACKAGE_VERSION_UNAVAILABLE"
          bwrap_help="$(/usr/bin/sudo -n /usr/bin/bwrap --help)" || fail_hold "BWRAP_HELP_FAILED"
          for required_option in --unshare-user --unshare-net --unshare-pid --unshare-ipc --unshare-uts --disable-userns --assert-userns-disabled --uid --gid --cap-drop --die-with-parent --new-session --clearenv --ro-bind --bind --proc --dev --tmpfs --size --chdir; do
            grep -F -- "$required_option" <<< "$bwrap_help" >/dev/null || fail_hold "BWRAP_OPTION_UNAVAILABLE_${required_option#--}"
          done
          printf 'BWRAP_PATH=/usr/bin/bwrap\nBWRAP_SHA256=%s\nBWRAP_VERSION=%s\nBWRAP_PACKAGE_VERSION=%s\n' "$bwrap_sha256" "$bwrap_version" "$bwrap_package"

          for system_path in /usr /lib /etc; do
            [[ -e "$system_path" ]] || fail_hold "SYSTEM_BIND_SOURCE_MISSING_${system_path#/}"
            [[ -d "$(realpath -e -- "$system_path")" ]] || fail_hold "SYSTEM_BIND_SOURCE_NOT_DIRECTORY_${system_path#/}"
          done
          if [[ -e /lib64 || -L /lib64 ]]; then
            [[ -d "$(realpath -e -- /lib64)" ]] || fail_hold "LIB64_BIND_SOURCE_INVALID"
            printf 'LIB64_BIND=present\n'
          else
            printf 'LIB64_BIND=absent\n'
          fi

          host_user_ns="$(readlink /proc/self/ns/user)" || fail_hold "HOST_USER_NAMESPACE_READ_FAILED"
          host_pid_ns="$(readlink /proc/self/ns/pid)" || fail_hold "HOST_PID_NAMESPACE_READ_FAILED"
          host_net_ns="$(readlink /proc/self/ns/net)" || fail_hold "HOST_NETWORK_NAMESPACE_READ_FAILED"
          host_ipc_ns="$(readlink /proc/self/ns/ipc)" || fail_hold "HOST_IPC_NAMESPACE_READ_FAILED"
          host_uts_ns="$(readlink /proc/self/ns/uts)" || fail_hold "HOST_UTS_NAMESPACE_READ_FAILED"
          runner_image_identity="$(awk -F= '/^(NAME|VERSION_ID|ID)=/ { gsub(/"/, "", $2); printf "%s=%s;", $1, $2 }' /etc/os-release)ImageOS=${ImageOS:-unknown};ImageVersion=${ImageVersion:-unknown};Kernel=$(uname -r)"
          printf 'RUNNER_IMAGE_IDENTITY=%s\n' "$runner_image_identity"

          if [[ -e "$carrier" || -L "$carrier" ]]; then
            fail_hold "CARRIER_ALREADY_EXISTS"
          fi
          if [[ -L "$carrier_parent" ]]; then
            fail_hold "CARRIER_PARENT_IS_SYMLINK"
          fi
          if [[ -e "$carrier_parent" ]]; then
            assert_root_component "$carrier_parent" || fail_hold "CARRIER_PARENT_ADMISSION_FAILED"
          else
            /usr/bin/sudo -n /usr/bin/install -d -o root -g root -m 0755 -- "$carrier_parent" || fail_hold "CARRIER_PARENT_CREATE_FAILED"
          fi
          assert_root_component /opt || fail_hold "OPT_ADMISSION_FAILED"
          assert_root_component "$carrier_parent" || fail_hold "CARRIER_PARENT_OWNER_MODE_FAILED"
          printf 'CARRIER_PARENT_ADMISSION=PASS\n'

          create_fresh_carrier() {
            [[ ! -e "$carrier" && ! -L "$carrier" ]] || return 1
            /usr/bin/sudo -n /usr/bin/install -d -o root -g root -m 0755 -- "$carrier" || return 1
            carrier_created=1
            assert_root_component "$carrier" || return 1
          }

          apply_work_acl() {
            local work_path="$1"
            /usr/bin/sudo -n /usr/bin/install -d -o root -g root -m 0700 -- "$work_path" || return 1
            /usr/bin/sudo -n /usr/bin/setfacl --remove-all -- "$work_path" || return 1
            /usr/bin/sudo -n /usr/bin/setfacl --modify "u::rwx,u:${runner_uid}:rwx,g::---,m::rwx,o::---" -- "$work_path" || return 1
            /usr/bin/sudo -n /usr/bin/setfacl --default --modify "u::rwx,u:${runner_uid}:rwx,g::---,m::rwx,o::---" -- "$work_path" || return 1
            work_acl="$(/usr/bin/sudo -n /usr/bin/getfacl -cp -- "$work_path")" || return 1
            grep -Fx 'user::rwx' <<< "$work_acl" >/dev/null || return 1
            grep -Fx "user:${runner_uid}:rwx" <<< "$work_acl" >/dev/null || return 1
            grep -Fx 'group::---' <<< "$work_acl" >/dev/null || return 1
            grep -Fx 'other::---' <<< "$work_acl" >/dev/null || return 1
            grep -Fx 'default:user::rwx' <<< "$work_acl" >/dev/null || return 1
            grep -Fx "default:user:${runner_uid}:rwx" <<< "$work_acl" >/dev/null || return 1
            grep -Fx 'default:group::---' <<< "$work_acl" >/dev/null || return 1
            grep -Fx 'default:other::---' <<< "$work_acl" >/dev/null || return 1
            [[ "$(stat -c '%u:%g' -- "$work_path")" == "0:0" ]] || return 1
            printf 'WORK_ACL_RESULT=PASS\nWORK_HOST_OWNER_MODE_RESULT=PASS\n'
          }

          build_common_bwrap_args() {
            common_bwrap_args=(
              --unshare-user
              --unshare-net
              --unshare-pid
              --unshare-ipc
              --unshare-uts
              --disable-userns
              --assert-userns-disabled
              --uid 65534
              --gid 65534
              --cap-drop ALL
              --die-with-parent
              --new-session
              --clearenv
            )
            for system_path in /usr /lib /etc; do
              system_source="$(realpath -e -- "$system_path")"
              common_bwrap_args+=(--ro-bind "$system_source" "$system_path")
            done
            if [[ -e /lib64 || -L /lib64 ]]; then
              lib64_source="$(realpath -e -- /lib64)"
              common_bwrap_args+=(--ro-bind "$lib64_source" /lib64)
            fi
            common_bwrap_args+=(
              --proc /proc
              --dev /dev
              --size "$tmpfs_bytes"
              --tmpfs /tmp
              --chdir /work
              --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              --setenv LANG C.UTF-8
              --setenv LC_ALL C.UTF-8
              --setenv HOME /tmp
            )
          }

          read -r -d '' capability_script <<'SH' || true
          set -Eeuo pipefail
          status_file=/proc/self/status
          printf 'SANDBOX_UID=%s\nSANDBOX_GID=%s\n' "$(id -u)" "$(id -g)"
          test "$(id -u)" = 65534
          test "$(id -g)" = 65534
          printf 'UID_MAP='
          tr '\n' ';' < /proc/self/uid_map
          printf 'GID_MAP='
          tr '\n' ';' < /proc/self/gid_map
          test "$(awk 'NF { printf "%s %s %s", $1, $2, $3 }' /proc/self/uid_map)" = '65534 0 1'
          test "$(awk 'NF { printf "%s %s %s", $1, $2, $3 }' /proc/self/gid_map)" = '65534 0 1'
          test "$(readlink /proc/self/ns/user)" != "$EXPECTED_HOST_USER_NS"
          test "$(readlink /proc/self/ns/pid)" != "$EXPECTED_HOST_PID_NS"
          test "$(readlink /proc/self/ns/net)" != "$EXPECTED_HOST_NET_NS"
          test "$(readlink /proc/self/ns/ipc)" != "$EXPECTED_HOST_IPC_NS"
          test "$(readlink /proc/self/ns/uts)" != "$EXPECTED_HOST_UTS_NS"
          printf 'USER_NAMESPACE_RESULT=PASS\nPID_NAMESPACE_RESULT=PASS\nNETWORK_NAMESPACE_RESULT=PASS\nIPC_NAMESPACE_RESULT=PASS\nUTS_NAMESPACE_RESULT=PASS\n'
          for capability_name in CapInh CapPrm CapEff CapBnd CapAmb; do
            capability_value="$(awk -v key="${capability_name}:" '$1 == key { print $2 }' "$status_file")"
            [[ "$capability_value" =~ ^0+$ ]] || exit 41
          done
          printf 'CAPABILITY_SET_RESULT=PASS\n'
          test "$(awk '$1 == "NoNewPrivs:" { print $2 }' "$status_file")" = 1
          printf 'NO_NEW_PRIVS_RESULT=PASS\n'
          for proc_field in Name Pid PPid Uid Gid CapInh CapPrm CapEff CapBnd CapAmb NoNewPrivs Seccomp; do
            grep -q "^${proc_field}:" "$status_file"
          done
          test -r /proc/1/status
          printf 'PROC_RESULT=PASS\n'
          test "$(stat -f -c '%T' /tmp)" = tmpfs
          tmpfs_size="$(df -B1 --output=size /tmp | awk 'NR == 2 { print $1 }')"
          test "$tmpfs_size" -le 1073741824
          printf 'TMPFS_RESULT=PASS\n'
          test "$(findmnt -T /dev -n -o FSTYPE)" = tmpfs
          test -c /dev/null
          printf 'DEV_RESULT=PASS\n'
          if /usr/bin/unshare -Ur /usr/bin/true >/dev/null 2>&1; then
            exit 42
          fi
          printf 'NESTED_USERNS_RESULT=PASS\n'
          test -x /usr/bin/unshare
          if { /usr/sbin/ip -4 route show; /usr/sbin/ip -6 route show; } | awk '/^unreachable |^prohibit |^blackhole |^throw / { next } NF && $0 !~ /(^| )dev lo( |$)/ && ($0 ~ /(^| )dev / || $0 ~ /^default /) { bad = 1 } END { exit bad }'; then
            :
          else
            exit 43
          fi
          printf 'NETWORK_ROUTE_RESULT=PASS\n'
          test "$(stat -c '%u:%g' /work)" = 65534:65534
          printf 'WORK_SANDBOX_OWNER_RESULT=PASS\n'
          printf 'probe-data\n' > /work/.s8-work-probe
          test "$(cat /work/.s8-work-probe)" = probe-data
          mv /work/.s8-work-probe /work/.s8-work-probe-renamed
          rm -f /work/.s8-work-probe-renamed
          printf 'WORK_WRITE_RESULT=PASS\n'
          if [[ "${S8_ADMISSION_MODE}" == initial ]]; then
            test "$(cat /probe/input.txt)" = s8-benign-probe
            if printf bad >> /probe/input.txt; then exit 44; fi
            if mv /probe/input.txt /probe/input-renamed; then exit 45; fi
            if rm -f /probe/input.txt; then exit 46; fi
            test "$(cat /probe/input.txt)" = s8-benign-probe
            printf 'PROBE_READ_ONLY_RESULT=PASS\n'
          else
            test -r /runtime/blender-root/blender
            test -x /runtime/blender-root/blender
            test -r /runtime/writer/writer.py
            test -x /runtime/process-runner
            test -x /runtime/validator
            test -r /runtime/support/blender_validate.py
            test -r /runtime/support/blender_reopen_validate.py
            printf 'REAL_PATH_PREFLIGHT_RESULT=PASS\n'
            if printf bad >> /runtime/writer/writer.py; then exit 47; fi
            if mv /runtime/writer/writer.py /runtime/writer/writer-renamed.py; then exit 48; fi
            if rm -f /runtime/writer/writer.py; then exit 49; fi
            printf 'RUNTIME_CODE_IMMUTABLE_RESULT=PASS\n'
          fi
          /usr/bin/true
          SH

          run_capability_probe() {
            local mode="$1"
            local -a args
            args=( "${common_bwrap_args[@]}" )
            if [[ "$mode" == initial ]]; then
              args+=(--dir /probe --ro-bind "$carrier/probe/input.txt" /probe/input.txt)
            else
              args+=(
                --ro-bind "$carrier/runtime/blender-5.2.2-linux-x64" /runtime/blender-root
                --ro-bind "$carrier/native/s8-process-runner" /runtime/process-runner
                --ro-bind "$carrier/native/s8-fbx-validator" /runtime/validator
                --ro-bind "$carrier/writer" /runtime/writer
                --ro-bind "$carrier/support" /runtime/support
              )
            fi
            args+=(--bind "$carrier/work" /work)
            args+=(
              --setenv EXPECTED_HOST_USER_NS "$host_user_ns"
              --setenv EXPECTED_HOST_PID_NS "$host_pid_ns"
              --setenv EXPECTED_HOST_NET_NS "$host_net_ns"
              --setenv EXPECTED_HOST_IPC_NS "$host_ipc_ns"
              --setenv EXPECTED_HOST_UTS_NS "$host_uts_ns"
              --setenv S8_ADMISSION_MODE "$mode"
              --
              /usr/bin/sh -ceu "$capability_script"
            )
            /usr/bin/sudo -n /usr/bin/bwrap "${args[@]}"
          }

          create_fresh_carrier || fail_hold "PROBE_CARRIER_CREATE_FAILED"
          assert_root_component "$carrier" || fail_hold "PROBE_CARRIER_OWNER_MODE_FAILED"
          /usr/bin/sudo -n /usr/bin/install -d -o root -g root -m 0555 -- "$carrier/probe" || fail_hold "PROBE_DIRECTORY_CREATE_FAILED"
          /usr/bin/sudo -n /usr/bin/tee "$carrier/probe/input.txt" >/dev/null <<< 's8-benign-probe' || fail_hold "PROBE_INPUT_CREATE_FAILED"
          /usr/bin/sudo -n /usr/bin/chown root:root -- "$carrier/probe/input.txt" || fail_hold "PROBE_INPUT_OWNER_FAILED"
          /usr/bin/sudo -n /usr/bin/chmod 0444 -- "$carrier/probe/input.txt" || fail_hold "PROBE_INPUT_MODE_FAILED"
          apply_work_acl "$carrier/work" || fail_hold "WORK_ACL_PROBE_SETUP_FAILED"
          build_common_bwrap_args
          if ! run_capability_probe initial; then
            fail_hold "CAPABILITY_PROBE_FAILED"
          fi
          printf 'CAPABILITY_PROBE=PASS\n'
          remove_carrier_exact || fail_hold "PROBE_CARRIER_CLEANUP_FAILED"
          carrier_created=0

          temp_parent_resolved="$(realpath -e -- "$RUNNER_TEMP")" || fail_hold "RUNNER_TEMP_REALPATH_FAILED"
          [[ -d "$temp_parent_resolved" && ! -L "$temp_parent_resolved" ]] || fail_hold "RUNNER_TEMP_INVALID"
          temp_root="$temp_parent_resolved/s8-g3-$run_id.$run_attempt"
          [[ ! -e "$temp_root" && ! -L "$temp_root" ]] || fail_hold "TEMP_PATH_NOT_FRESH"
          /usr/bin/install -d -m 0700 -- "$temp_root" || fail_hold "TEMP_CREATE_FAILED"
          temp_created=1
          archive="$temp_root/blender-5.2.2-linux-x64.tar.xz"
          source_layout="$temp_root/source-layout"
          source_manifest="$temp_root/source.manifest"
          staged_manifest="$temp_root/staged.manifest"
          post_run_manifest="$temp_root/post-run.manifest"
          /usr/bin/install -d -m 0700 -- "$source_layout/runtime" "$source_layout/native" "$source_layout/writer" "$source_layout/support" || fail_hold "SOURCE_LAYOUT_CREATE_FAILED"

          /usr/bin/curl --fail --location --retry 3 --output "$archive" \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz || fail_hold "BLENDER_ARCHIVE_DOWNLOAD_FAILED"
          [[ -f "$archive" && ! -L "$archive" ]] || fail_hold "BLENDER_ARCHIVE_PATH_INVALID"
          printf '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  %s\n' "$archive" | /usr/bin/sha256sum --check --status || fail_hold "BLENDER_ARCHIVE_SHA256_MISMATCH"
          printf 'ARCHIVE_SHA_RESULT=PASS\n'
          /usr/bin/tar -tJf "$archive" | awk '/^\/|(^|\/)\.\.(\/|$)/ { bad = 1 } END { exit bad }' || fail_hold "BLENDER_ARCHIVE_PATH_TRAVERSAL"
          /usr/bin/install -d -m 0700 -- "$temp_root/extracted" || fail_hold "BLENDER_EXTRACTION_DIRECTORY_FAILED"
          /usr/bin/tar -xJf "$archive" --directory "$temp_root/extracted" --no-same-owner --no-same-permissions || fail_hold "BLENDER_ARCHIVE_EXTRACTION_FAILED"
          blender_source="$temp_root/extracted/blender-5.2.2-linux-x64"
          [[ -d "$blender_source" && ! -L "$blender_source" && -x "$blender_source/blender" ]] || fail_hold "BLENDER_SOURCE_INVALID"

          /usr/bin/cmake -S native/s8-process-runner -B "$temp_root/s8-runner" -DCMAKE_BUILD_TYPE=Release
          /usr/bin/cmake --build "$temp_root/s8-runner" --config Release --parallel
          /usr/bin/cmake -S native/s8-fbx-validator -B "$temp_root/s8-validator" -DCMAKE_BUILD_TYPE=Release
          /usr/bin/cmake --build "$temp_root/s8-validator" --config Release --parallel
          [[ -x "$temp_root/s8-runner/s8-process-runner" && -x "$temp_root/s8-validator/s8-fbx-validator" ]] || fail_hold "NATIVE_BUILD_OUTPUT_INVALID"

          /usr/bin/cp -a --no-dereference -- "$blender_source" "$source_layout/runtime/"
          /usr/bin/install -m 0755 -- "$temp_root/s8-runner/s8-process-runner" "$source_layout/native/s8-process-runner"
          /usr/bin/install -m 0755 -- "$temp_root/s8-validator/s8-fbx-validator" "$source_layout/native/s8-fbx-validator"
          /usr/bin/cp -a --no-dereference -- blender/s8-fbx-writer/. "$source_layout/writer/"
          /usr/bin/install -m 0644 -- scripts/s8/blender_validate.py "$source_layout/support/blender_validate.py"
          /usr/bin/install -m 0644 -- scripts/s8/blender_reopen_validate.py "$source_layout/support/blender_reopen_validate.py"

          while IFS= read -r -d '' symlink_path; do
            symlink_target="$(readlink -- "$symlink_path")"
            case "$symlink_target" in
              /*|..|../*|*/../*) fail_hold "SOURCE_SYMLINK_PATH_TRAVERSAL" ;;
            esac
          done < <(/usr/bin/find -P "$source_layout" -type l -print0)
          /usr/bin/find -P "$source_layout" -type d -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$source_layout" -type f -perm /111 -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$source_layout" -type f ! -perm /111 -exec /usr/bin/chmod 0444 {} +

          manifest_surfaces() {
            local base="$1"
            shift
            {
              local surface
              for surface in "$@"; do
                while IFS= read -r -d '' manifest_path; do
                  relative_path="${manifest_path#"$base"/}"
                  manifest_mode="$(stat -c '%a' -- "$manifest_path")"
                  manifest_size="$(stat -c '%s' -- "$manifest_path")"
                  manifest_sha="$(sha256sum -- "$manifest_path" | awk '{print $1}')"
                  printf 'F\t%s\t%s\t%s\t%s\n' "$relative_path" "$manifest_mode" "$manifest_size" "$manifest_sha"
                done < <(/usr/bin/find -P "$base/$surface" -type f -print0)
                while IFS= read -r -d '' manifest_path; do
                  relative_path="${manifest_path#"$base"/}"
                  printf 'L\t%s\t%s\n' "$relative_path" "$(readlink -- "$manifest_path")"
                done < <(/usr/bin/find -P "$base/$surface" -type l -print0)
              done
            } | LC_ALL=C /usr/bin/sort
          }

          manifest_surfaces "$source_layout" runtime native writer support > "$source_manifest" || fail_hold "SOURCE_MANIFEST_FAILED"
          [[ -s "$source_manifest" ]] || fail_hold "SOURCE_MANIFEST_EMPTY"
          source_manifest_sha="$(sha256sum -- "$source_manifest" | awk '{print $1}')"
          blender_pre_stage_sha="$(sha256sum -- "$blender_source/blender" | awk '{print $1}')"
          runner_pre_stage_sha="$(sha256sum -- "$temp_root/s8-runner/s8-process-runner" | awk '{print $1}')"
          validator_pre_stage_sha="$(sha256sum -- "$temp_root/s8-validator/s8-fbx-validator" | awk '{print $1}')"
          printf 'SOURCE_MANIFEST_SHA=%s\nBLENDER_PRE_STAGE_SHA=%s\nRUNNER_PRE_STAGE_SHA=%s\nVALIDATOR_PRE_STAGE_SHA=%s\n' "$source_manifest_sha" "$blender_pre_stage_sha" "$runner_pre_stage_sha" "$validator_pre_stage_sha"

          create_fresh_carrier || fail_hold "STAGED_CARRIER_CREATE_FAILED"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/runtime" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/native" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/writer" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/support" "$carrier/"
          /usr/bin/sudo -n /usr/bin/chown -R --no-dereference root:root -- "$carrier" || fail_hold "ROOT_STAGE_OWNERSHIP_FAILED"
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type d -exec /usr/bin/chmod 0555 {} +
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f -perm /111 -exec /usr/bin/chmod 0555 {} +
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f ! -perm /111 -exec /usr/bin/chmod 0444 {} +
          /usr/bin/sudo -n /usr/bin/chmod 0555 -- "$carrier"
          apply_work_acl "$carrier/work" || fail_hold "WORK_ACL_STAGED_SETUP_FAILED"

          for direct_surface in runtime native writer support work; do
            [[ -e "$carrier/$direct_surface" && ! -L "$carrier/$direct_surface" ]] || fail_hold "STAGED_SURFACE_INVALID_$direct_surface"
          done
          actual_surfaces="$(/usr/bin/find -P "$carrier" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C /usr/bin/sort)"
          expected_surfaces=$'native\nruntime\nsupport\nwork\nwriter'
          [[ "$actual_surfaces" == "$expected_surfaces" ]] || fail_hold "STAGED_SURFACE_SET_MISMATCH"
          assert_root_component "$carrier" || fail_hold "STAGED_CARRIER_OWNER_MODE_FAILED"
          if /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type d -perm /022 -print -quit | grep -q .; then
            fail_hold "RUNTIME_CODE_DIRECTORY_WRITABLE"
          fi
          if /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f -perm /022 -print -quit | grep -q .; then
            fail_hold "RUNTIME_CODE_FILE_WRITABLE"
          fi

          manifest_surfaces "$carrier" runtime native writer support > "$staged_manifest" || fail_hold "STAGED_MANIFEST_FAILED"
          staged_manifest_sha="$(sha256sum -- "$staged_manifest" | awk '{print $1}')"
          cmp --silent "$source_manifest" "$staged_manifest" || fail_hold "SOURCE_STAGED_MANIFEST_MISMATCH"
          blender_staged_sha="$(sha256sum -- "$carrier/runtime/blender-5.2.2-linux-x64/blender" | awk '{print $1}')"
          runner_staged_sha="$(sha256sum -- "$carrier/native/s8-process-runner" | awk '{print $1}')"
          validator_staged_sha="$(sha256sum -- "$carrier/native/s8-fbx-validator" | awk '{print $1}')"
          [[ "$blender_pre_stage_sha" == "$blender_staged_sha" ]] || fail_hold "BLENDER_STAGE_HASH_MISMATCH"
          [[ "$runner_pre_stage_sha" == "$runner_staged_sha" ]] || fail_hold "RUNNER_STAGE_HASH_MISMATCH"
          [[ "$validator_pre_stage_sha" == "$validator_staged_sha" ]] || fail_hold "VALIDATOR_STAGE_HASH_MISMATCH"
          printf 'STAGED_MANIFEST_SHA=%s\nBLENDER_STAGED_SHA=%s\nRUNNER_STAGED_SHA=%s\nVALIDATOR_STAGED_SHA=%s\nMANIFEST_EQUALITY_RESULT=PASS\n' "$staged_manifest_sha" "$blender_staged_sha" "$runner_staged_sha" "$validator_staged_sha"

          build_common_bwrap_args
          if ! run_capability_probe staged; then
            fail_hold "ACTUAL_STAGED_PATH_ADMISSION_FAILED"
          fi
          printf 'ACTUAL_STAGED_PATH_ADMISSION=PASS\n'

          launcher="$temp_root/s8-bwrap-launcher"
          {
            printf '%s\n' '#!/usr/bin/bash'
            printf '%s\n' 'set -Eeuo pipefail'
            printf 'carrier_root=%q\n' "$carrier"
            printf 'tmpfs_bytes=%q\n' "$tmpfs_bytes"
            cat <<'SH'
          args=("$@")
          separator=-1
          for ((index = 0; index < ${#args[@]}; index++)); do
            if [[ "${args[$index]}" == "--" ]]; then
              separator=$index
              break
            fi
          done
          (( separator > 0 )) || { echo "sandbox command separator missing" >&2; exit 70; }

          final_args=(
            --unshare-user
            --unshare-net
            --unshare-pid
            --unshare-ipc
            --unshare-uts
            --disable-userns
            --assert-userns-disabled
            --uid 65534
            --gid 65534
            --cap-drop ALL
            --die-with-parent
            --new-session
            --clearenv
          )
          for system_path in /usr /lib /etc; do
            system_source="$(realpath -e -- "$system_path")"
            final_args+=(--ro-bind "$system_source" "$system_path")
          done
          if [[ -e /lib64 || -L /lib64 ]]; then
            final_args+=(--ro-bind "$(realpath -e -- /lib64)" /lib64)
          fi

          runtime_seen=0
          runner_seen=0
          validator_seen=0
          writer_seen=0
          support_seen=0
          work_seen=0
          for ((index = 0; index < separator;)); do
            option="${args[$index]}"
            case "$option" in
              --ro-bind|--bind)
                kind="$option"
                source="${args[$((index + 1))]:-}"
                destination="${args[$((index + 2))]:-}"
                [[ -n "$source" && -n "$destination" ]] || { echo "incomplete bind" >&2; exit 71; }
                if [[ "$kind" == "--ro-bind" && "$source" == "/carrier/runtime/blender-5.2.2-linux-x64" && "$destination" == "/runtime/blender-root" ]]; then
                  final_args+=(--ro-bind "$carrier_root/runtime/blender-5.2.2-linux-x64" /runtime/blender-root)
                  runtime_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/native/s8-process-runner" && "$destination" == "/runtime/process-runner" ]]; then
                  final_args+=(--ro-bind "$carrier_root/native/s8-process-runner" /runtime/process-runner)
                  runner_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/native/s8-fbx-validator" && "$destination" == "/runtime/validator" ]]; then
                  final_args+=(--ro-bind "$carrier_root/native/s8-fbx-validator" /runtime/validator)
                  validator_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/writer" && "$destination" == "/runtime/writer" ]]; then
                  final_args+=(--ro-bind "$carrier_root/writer" /runtime/writer)
                  writer_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/support/blender_validate.py" && "$destination" == "/runtime/support/blender_validate.py" ]]; then
                  final_args+=(--ro-bind "$carrier_root/support/blender_validate.py" /runtime/support/blender_validate.py)
                  support_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/support/blender_reopen_validate.py" && "$destination" == "/runtime/support/blender_reopen_validate.py" ]]; then
                  final_args+=(--ro-bind "$carrier_root/support/blender_reopen_validate.py" /runtime/support/blender_reopen_validate.py)
                  support_seen=1
                elif [[ "$kind" == "--bind" && "$source" == "/carrier/work" && "$destination" == "/work" ]]; then
                  final_args+=(--bind "$carrier_root/work" /work)
                  work_seen=1
                else
                  echo "unexpected bind" >&2
                  exit 72
                fi
                index=$((index + 3))
                ;;
              --proc|--dev|--tmpfs|--chdir)
                expected="${args[$((index + 1))]:-}"
                case "$option:$expected" in
                  --proc:/proc|--dev:/dev|--tmpfs:/tmp|--chdir:/work) ;;
                  *) echo "unexpected sandbox mount option" >&2; exit 73 ;;
                esac
                index=$((index + 2))
                ;;
              --unshare-user|--unshare-net|--unshare-pid|--unshare-ipc|--unshare-uts|--die-with-parent|--new-session)
                index=$((index + 1))
                ;;
              *)
                echo "unsupported sandbox option" >&2
                exit 74
                ;;
            esac
          done

          (( runtime_seen == 1 && runner_seen == 1 && writer_seen == 1 && work_seen == 1 )) || { echo "required runtime bind missing" >&2; exit 75; }
          (( separator + 1 < ${#args[@]} )) || { echo "sandbox payload missing" >&2; exit 76; }
          [[ "${args[$((separator + 1))]}" == "/runtime/process-runner" ]] || { echo "native runner is not the first sandbox process" >&2; exit 77; }
          final_args+=(
            --size "$tmpfs_bytes"
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --chdir /work
            --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --setenv LANG C.UTF-8
            --setenv LC_ALL C.UTF-8
            --setenv HOME /tmp
            --
            "${args[@]:$((separator + 1))}"
          )
          exec /usr/bin/sudo -n /usr/bin/bwrap "${final_args[@]}"
          SH
          } > "$launcher"
          /usr/bin/chmod 0700 -- "$launcher"
          /usr/bin/bash -n "$launcher" || fail_amendment "SANDBOX_LAUNCHER_SYNTAX"
          candidate_marker_file="$temp_root/candidate-started"
          qualified_helper="$temp_root/s8-runtime-sensitivity-hosted.py"
          /usr/bin/python3 - "$GITHUB_WORKSPACE/scripts/s8/s8_runtime_sensitivity.py" "$qualified_helper" "$candidate_marker_file" <<'PY'
          from pathlib import Path
          import json
          import sys

          source_path = Path(sys.argv[1])
          target_path = Path(sys.argv[2])
          marker_path = Path(sys.argv[3])
          source = source_path.read_text(encoding="utf-8")
          marker_anchor = "    writer_output = run_sandbox(\n"
          if source.count(marker_anchor) != 1:
              raise SystemExit("candidate marker anchor is not unique")
          marker_line = (
              "    marker_path = pathlib.Path(" + json.dumps(str(marker_path)) + ")\n"
              "    marker_path.write_text('1\\n', encoding='ascii')\n"
              "    print('CANDIDATE_EXECUTION_START=S8_PINNED_BLENDER_PRIVATE_EXPORTER', flush=True)\n"
          )
          source = source.replace(marker_anchor, marker_line + marker_anchor, 1)
          broad_bind_anchor = (
              "        " + chr(34) + "--ro-bind" + chr(34) + ", str(carrier_root), "
              + chr(34) + "/carrier" + chr(34) + ",\n"
          )
          if source.count(broad_bind_anchor) != 1:
              raise SystemExit("broad carrier bind anchor is not unique")
          source = source.replace(broad_bind_anchor, "", 1)
          readback_anchor = (
              '    if not isinstance(readback_value, dict) or readback_value.get("schemaVersion") != "s8-ufbx-readback-v1":\n'
              '        fail("NATIVE_READBACK_SCHEMA_INVALID", "CANDIDATE_DEFECT__NATIVE_VALIDATOR")\n'
          )
          if source.count(readback_anchor) != 1:
              raise SystemExit("readback anchor is not unique")
          readback_line = '    (work / "validator-readback.json").write_text(json.dumps(readback, sort_keys=True, separators=(",", ":")), encoding="ascii")\n'
          source = source.replace(readback_anchor, readback_anchor + readback_line, 1)
          target_path.write_text(source, encoding="utf-8")
          PY

          set +e
          /usr/bin/python3 "$qualified_helper" \
            --blender "$carrier/runtime/blender-5.2.2-linux-x64/blender" \
            --writer "$carrier/writer/writer.py" \
            --runner "$carrier/native/s8-process-runner" \
            --sandbox "$launcher" \
            --validator "$carrier/native/s8-fbx-validator" \
            --import-script "$carrier/support/blender_validate.py" \
            --reopen-script "$carrier/support/blender_reopen_validate.py" \
            --output-dir "$carrier/work"
          qualification_status=$?
          set -e
          if [[ -e "$candidate_marker_file" ]]; then
            candidate_started=1
          fi
          if (( qualification_status != 0 && candidate_started == 1 )); then
            failure_reported=1
          fi
          (( qualification_status == 0 )) || exit "$qualification_status"
          printf 'NATIVE_RUNNER_ADMISSION_RESULT=PASS\nPINNED_BLENDER_RESULT=PASS\nPRIVATE_EXPORTER_RESULT=PASS\nNATIVE_VALIDATOR_RESULT=PASS\nBLENDER_SEMANTIC_QUALIFICATION=PASS\n'

          if ! /usr/bin/python3 - "$carrier/work/input.json" "$carrier/work/validator-readback.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="ascii"))
          readback = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="ascii"))
          expected_object = payload["objects"][0]
          if readback.get("schemaVersion") != "s8-ufbx-readback-v1":
              raise SystemExit("semantic readback schema mismatch")
          source = readback.get("source")
          if not isinstance(source, dict) or source.get("revisionId") != payload["source"]["revisionId"] or source.get("revisionHash") != payload["source"]["revisionHash"] or source.get("s6ValidationHash") != payload["source"]["s6ValidationHash"] or source.get("s6HandoffDigest") != payload["source"]["s6HandoffDigest"]:
              raise SystemExit("semantic source provenance mismatch")
          nodes = readback.get("nodes")
          if not isinstance(nodes, list) or len(nodes) != 1:
              raise SystemExit("semantic node cardinality mismatch")
          node = nodes[0]
          if node.get("name") != expected_object["name"] or node.get("sourceObjectId") != expected_object["sourceObjectId"] or node.get("identityKey") != expected_object["identityKey"]:
              raise SystemExit("semantic object identity mismatch")
          mesh = node.get("mesh")
          if not isinstance(mesh, dict) or len(mesh.get("vertices", [])) != 3 or mesh.get("triangles") != [[0, 1, 2]] or len(mesh.get("cornerNormals", [])) != 3:
              raise SystemExit("semantic geometry mismatch")
          print("SEMANTIC_READBACK_RESULT=PASS")
          PY
          then
            failure_reported=1
            printf 'CANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_DEFECT__SEMANTIC_READBACK\n' >&2
            exit 1
          fi

          manifest_surfaces "$carrier" runtime native writer support > "$post_run_manifest" || fail_amendment "POST_RUN_MANIFEST_FAILED"
          post_run_manifest_sha="$(sha256sum -- "$post_run_manifest" | awk '{print $1}')"
          cmp --silent "$staged_manifest" "$post_run_manifest" || fail_amendment "POST_RUN_MANIFEST_MISMATCH"
          blender_post_run_sha="$(sha256sum -- "$carrier/runtime/blender-5.2.2-linux-x64/blender" | awk '{print $1}')"
          runner_post_run_sha="$(sha256sum -- "$carrier/native/s8-process-runner" | awk '{print $1}')"
          validator_post_run_sha="$(sha256sum -- "$carrier/native/s8-fbx-validator" | awk '{print $1}')"
          [[ "$blender_staged_sha" == "$blender_post_run_sha" ]] || fail_amendment "BLENDER_POST_RUN_HASH_MISMATCH"
          [[ "$runner_staged_sha" == "$runner_post_run_sha" ]] || fail_amendment "RUNNER_POST_RUN_HASH_MISMATCH"
          [[ "$validator_staged_sha" == "$validator_post_run_sha" ]] || fail_amendment "VALIDATOR_POST_RUN_HASH_MISMATCH"
          printf 'POST_RUN_MANIFEST_SHA=%s\nBLENDER_POST_RUN_SHA=%s\nRUNNER_POST_RUN_SHA=%s\nVALIDATOR_POST_RUN_SHA=%s\nPOST_RUN_IDENTITY_RESULT=PASS\n' "$post_run_manifest_sha" "$blender_post_run_sha" "$runner_post_run_sha" "$validator_post_run_sha"
          printf 'S8_PINNED_BLENDER_CHECK=PASS\nEXACT_HEAD_HOSTED_CI_RESULT=PASS\nAMENDMENT_RESULT=PASS\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nG3_RESULT=HOSTED_CI_PASS__REMAINING_G3_EVIDENCE_PENDING\nG4_AUTHORISED=NO\nRETURN_TO_WEB=YES\n'
