                  raise ValueError("ACL_HEADER_OWNER_INVALID")
              if re.fullmatch(r"(?:0|[1-9][0-9]*)", headers["group"]) is None:
                  raise ValueError("ACL_HEADER_GROUP_INVALID")
              if int(headers["owner"]) != observed.st_uid or int(headers["group"]) != observed.st_gid:
                  raise ValueError("ACL_HEADER_IDENTITY_MISMATCH")
              mask_key = f"{prefix}mask::"
              mask = entries.get(mask_key)
              has_named_entries = any(
                  key.startswith(f"{prefix}user:") and key != f"{prefix}user::"
                  or key.startswith(f"{prefix}group:") and key != f"{prefix}group::"
                  for key in entries
              )
              if has_named_entries and mask is None:
                  raise ValueError("ACL_MASK_MISSING")
              mask_bits = _permission_bits(mask["raw"]) if mask is not None and mask["raw"] is not None else 7
              for key, entry_value in entries.items():
                  raw_permissions = entry_value["raw"]
                  if raw_permissions is None:
                      raise ValueError("ACL_RAW_PERMISSIONS_MISSING")
                  unprefixed = key[len(prefix):]
                  parts = unprefixed.split(":")
                  if len(parts) == 2 and parts[0] in {"user", "group"}:
