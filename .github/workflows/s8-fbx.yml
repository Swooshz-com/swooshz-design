                  elif len(parts) == 3:
                      kind, qualifier, _ = parts
                  else:
                      raise ValueError("ACL_ENTRY_INTERNAL_INVALID")
                  if kind == "other" or kind == "user" and qualifier == "" or kind == "mask":
