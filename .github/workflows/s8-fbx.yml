                  if result["stderr"].count("SANDBOX_DIAGNOSTIC_END") != 1:
                      raise SystemExit(f"{label}: diagnostic block terminator count invalid")
                  start = result["stderr"].index("SANDBOX_DIAGNOSTIC_BEGIN")
                  end = result["stderr"].index("SANDBOX_DIAGNOSTIC_END") + len("SANDBOX_DIAGNOSTIC_END")
                  return result["stderr"][start:end]

