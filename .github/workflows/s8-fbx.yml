            fi
            if (( qualification_status != 0 && candidate_started == 1 )); then
              failure_reported=1
            fi
            if (( qualification_status == 0 )); then
              qualification_pass=1
            fi
            [[ "$qualification_status" == 42 ]]
            [[ "$qualification_pass" == 0 ]]
            if [[ "$create_marker" == 0 ]]; then
              [[ "$candidate_started" == 0 && "$failure_reported" == 0 ]]
            else
              [[ "$candidate_started" == 1 && "$failure_reported" == 1 ]]
            fi
            printf 'QUALIFICATION_CAPTURE_%s=PASS\n' "$label"
          }

          run_qualification_case BEFORE_MARKER 0
          run_qualification_case AFTER_MARKER 1
          printf 'QUALIFICATION_CAPTURE_REGRESSIONS=PASS\n'
          printf 'GUARDED_CALLER_REGRESSIONS=PASS\n'
          SH
            } > "$caller_script"
            /usr/bin/chmod 0700 -- "$caller_script"
            if ! /usr/bin/python3 - "$caller_script" <<'PY'
          from pathlib import Path
          import re, sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          required_functions = (
              "run_tracked_command_actual",
              "tracked_pid_is_registered",
              "remove_tracked_pid_exact",
              "wait_for_tracked_pid",
              "signal_exit_status",
          )
          for name in required_functions:
              if not re.search(rf"^{re.escape(name)}\s*\(\)\s*\{{", source, re.MULTILINE):
                  raise SystemExit(f"missing generated function: {name}")
          state_initialisers = (
              "tracked_children=()",
              "all_launched_children_reaped=1",
              "stop_new_launches=0",
              "critical_section=0",
              'pending_signal=""',
              'received_signal=""',
          )
          state_start = source.index("set -Eeuo pipefail")
          qualification_start = source.index("run_qualification_case()")
          state_section = source[state_start:qualification_start]
          for assignment in state_initialisers:
              if assignment not in state_section:
                  raise SystemExit(f"missing generated state initializer: {assignment}")
          if "run_tracked_command_actual" not in source[qualification_start:]:
              raise SystemExit("generated qualification path does not invoke run_tracked_command_actual")
          print("GUARDED_CALLER_FUNCTION_DEPENDENCY_CLOSURE=PASS")
          print("GUARDED_CALLER_STATE_DEPENDENCY_CLOSURE=PASS")
          PY
            then
              /usr/bin/rm -rf -- "$regression_root"
              return 1
            fi
            set +e
            /usr/bin/bash "$caller_script" "$regression_root"
            regression_status=$?
            set -e
            if [[ "$regression_status" != 0 ]]; then
              /usr/bin/rm -rf -- "$regression_root"
              return 1
            fi

            negative_script="$regression_root/negative-proof-controls.sh"
            {
              declare -f run_tracked_command
              declare -f run_bwrap_parser_proof
              /usr/bin/cat <<'SH'
          set -Eeuo pipefail
          regression_root="$1"
          negative_case="$2"
          candidate_marker_file="$regression_root/$negative_case.marker"
          tmpfs_bytes=1073741824
          /usr/bin/rm -f -- "$candidate_marker_file"

          fail_hold() {
            printf 'NEGATIVE_CONTROL_HOLD=%s\n' "$1" >&2
            exit 1
          }

          admit_before_bwrap() {
            return 0
          }

          run_tracked_command() {
            case "$negative_case" in
              WRONG_BAD_GRAMMAR_STATUS)
                printf 'wrong status diagnostic fixture\n'
                return 2
                ;;
              MISSING_BAD_GRAMMAR_DIAGNOSTIC)
                printf 'different diagnostic fixture\n'
                return 1
                ;;
              FAILED_GOOD_GRAMMAR)
                printf 'Usage: fixture\n'
                return 1
                ;;
              *)
                return 99
                ;;
            esac
          }

          stdout_path="$regression_root/$negative_case.stdout"
          stderr_path="$regression_root/$negative_case.stderr"
          if [[ "$negative_case" == FAILED_GOOD_GRAMMAR ]]; then
            run_bwrap_parser_proof bwrap_good_grammar 0 "$stdout_path" "$stderr_path"
          else
            run_bwrap_parser_proof bwrap_bad_grammar 1 "$stdout_path" "$stderr_path"
          fi
          printf 'CANDIDATE_EXECUTION_START=SHOULD_NOT_REACH\n' > "$candidate_marker_file"
          SH
            } > "$negative_script"
            /usr/bin/chmod 0700 -- "$negative_script"
            for negative_case in WRONG_BAD_GRAMMAR_STATUS MISSING_BAD_GRAMMAR_DIAGNOSTIC FAILED_GOOD_GRAMMAR; do
              set +e
              /usr/bin/bash "$negative_script" "$regression_root" "$negative_case" > "$regression_root/$negative_case.log" 2>&1
              negative_status=$?
              set -e
              [[ "$negative_status" != 0 ]] || {
                /usr/bin/rm -rf -- "$regression_root"
                return 1
              }
              [[ ! -e "$regression_root/$negative_case.marker" && ! -L "$regression_root/$negative_case.marker" ]] || {
                /usr/bin/rm -rf -- "$regression_root"
                return 1
              }
              if /usr/bin/grep -F 'CANDIDATE_EXECUTION_START=SHOULD_NOT_REACH' "$regression_root/$negative_case.log" >/dev/null 2>&1; then
                /usr/bin/rm -rf -- "$regression_root"
                return 1
              fi
              printf 'NEGATIVE_PROOF_CONTROL_%s=PASS\n' "$negative_case"
            done
            /usr/bin/rm -rf -- "$regression_root"
            printf 'NEGATIVE_CONTROL_REGRESSIONS=PASS\n'
