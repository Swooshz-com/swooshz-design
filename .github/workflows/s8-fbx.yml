              critical_section=0
              return 1
            }
            tracked_children+=("$child_pid")
            all_launched_children_reaped=0
            critical_section=0
            if [[ -n "${pending_signal:-}" ]]; then
              deferred_signal="$pending_signal"
              pending_signal=""
              received_signal="$deferred_signal"
              stop_new_launches=1
              /usr/bin/kill -s "$deferred_signal" "$child_pid" 2>/dev/null || true
            fi
            if wait_for_tracked_pid "$child_pid" child_status; then
              remove_tracked_pid_exact "$child_pid" || return 1
              if [[ -n "${received_signal:-}" && "$child_status" == 0 ]]; then
                return "$(signal_exit_status "$received_signal")"
              fi
              return "$child_status"
            fi
            return 1
          }

