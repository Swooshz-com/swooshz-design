          import re
          import sys

          EXPECTED_PACKAGE = "bubblewrap"
          EXPECTED_VERSION = "0.9.0-1ubuntu0.3"
          EXPECTED_ARCHITECTURE = "amd64"
          EXPECTED_FILENAME = "pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb"
          REQUIRED_FIELD_NAMES = frozenset({
              "package",
              "version",
              "architecture",
              "filename",
              "size",
              "sha256",
          })
          REQUIRED_OUTPUT_FIELDS = (
              ("filename", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "FILENAME_INVALID"),
              ("size", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "SIZE_INVALID"),
              ("sha256", "REQUIRED_FIELD_MISSING", "REQUIRED_FIELD_EMPTY", "SHA256_INVALID"),
          )

          class Reject(Exception):
              def __init__(self, code):
                  self.code = code
                  super().__init__(code)

          class RegressionFailure(Exception):
              pass

          def reject(code):
              raise Reject(code)

          def parse_deb822_records(raw_bytes):
              if not isinstance(raw_bytes, bytes):
                  reject("INTERNAL_PARSER_FAILURE")
              if b"\x00" in raw_bytes:
                  reject("MALFORMED_FIELD_LINE")
              normalized = raw_bytes.replace(b"\r\n", b"\n")
              if b"\r" in normalized:
                  reject("MALFORMED_FIELD_LINE")

              records = []
              fields = {}
              current_field = None

              def flush_record():
                  nonlocal current_field, fields
                  if fields:
                      records.append(fields)
                  fields = {}
                  current_field = None

              for line in normalized.split(b"\n"):
                  if line == b"":
                      flush_record()
                      continue
                  if line.startswith((b" ", b"\t")):
                      if current_field is None:
                          reject("ORPHAN_CONTINUATION")
                      if current_field in REQUIRED_FIELD_NAMES:
                          reject("REQUIRED_FIELD_CONTINUATION")
                      fields[current_field] += b"\n" + line[1:]
                      continue
                  colon_index = line.find(b":")
                  if colon_index <= 0:
                      reject("MALFORMED_FIELD_LINE")
                  field_name = line[:colon_index]
                  if not all(
                      0x21 <= character <= 0x7E and character != 0x3A
                      for character in field_name
                  ):
                      reject("MALFORMED_FIELD_LINE")
                  normalized_name = field_name.lower().decode("ascii")
                  if normalized_name in fields:
                      reject("DUPLICATE_FIELD")
                  fields[normalized_name] = line[colon_index + 1:]
                  current_field = normalized_name
              flush_record()
              return records

          def _trim_ascii_space(value):
              return value.strip(b" \t")

          def _identity_value(record, field_name):
              raw_value = record.get(field_name)
              if raw_value is None:
                  return None
              try:
                  return _trim_ascii_space(raw_value).decode("ascii")
              except UnicodeDecodeError:
                  return None

          def select_bubblewrap_metadata(records):
              matches = []
              for record in records:
                  if (
                      _identity_value(record, "package") == EXPECTED_PACKAGE
                      and _identity_value(record, "version") == EXPECTED_VERSION
                      and _identity_value(record, "architecture") == EXPECTED_ARCHITECTURE
                  ):
                      matches.append(record)
              if len(matches) != 1:
                  reject("MATCH_COUNT_INVALID")

              record = matches[0]
              values = {}
              for field_name, missing_code, empty_code, invalid_code in REQUIRED_OUTPUT_FIELDS:
                  if field_name not in record:
                      reject(missing_code)
                  raw_value = _trim_ascii_space(record[field_name])
                  if raw_value == b"":
                      reject(empty_code)
                  try:
                      value = raw_value.decode("ascii")
                  except UnicodeDecodeError:
                      reject(invalid_code)
                  values[field_name] = value

              if values["filename"] != EXPECTED_FILENAME:
                  reject("FILENAME_INVALID")
              if re.fullmatch(r"[0-9]+", values["size"]) is None:
                  reject("SIZE_INVALID")
              if re.fullmatch(r"[0-9A-Fa-f]{64}", values["sha256"]) is None:
                  reject("SHA256_INVALID")
              return values

          def format_success(metadata):
              return (
                  f"FILENAME={metadata['filename']}\n"
                  f"SIZE={metadata['size']}\n"
                  f"SHA256={metadata['sha256']}\n"
              )

          def _paragraph(fields, final_lf=True):
              lines = []
              for field_name, value in fields:
                  lines.append(f"{field_name}: {value}")
              result = "\n".join(lines)
              if final_lf:
                  result += "\n"
              return result.encode("ascii")

          def _base_fields():
              return [
                  ("Package", EXPECTED_PACKAGE),
                  ("Version", EXPECTED_VERSION),
                  ("Architecture", EXPECTED_ARCHITECTURE),
                  ("Filename", EXPECTED_FILENAME),
                  ("Size", "123"),
                  ("SHA256", "a" * 64),
              ]

          def _exact(overrides=None, omit=(), order=None, final_lf=True, extra_fields=()):
              overrides = overrides or {}
              fields = [
                  (field_name, overrides.get(field_name, value))
                  for field_name, value in _base_fields()
                  if field_name not in omit
              ]
              if order is not None:
                  by_name = {field_name: (field_name, value) for field_name, value in fields}
                  fields = [by_name[field_name] for field_name in order]
              fields.extend(extra_fields)
              return _paragraph(fields, final_lf=final_lf)

          def _duplicate(field_name, duplicate_name=None):
              duplicate_name = duplicate_name or field_name
              fields = _base_fields()
              for index, (name, value) in enumerate(fields):
                  if name == field_name:
                      fields.insert(index + 1, (duplicate_name, value))
                      break
              return _paragraph(fields)

          def _required_continuation(field_name):
              lines = []
              for name, value in _base_fields():
                  lines.append(f"{name}: {value}")
                  if name == field_name:
                      lines.append(" continuation text")
              return ("\n".join(lines) + "\n").encode("ascii")

          def _join_paragraphs(*paragraphs, final_lf=True):
              raw = b"\n\n".join(paragraph.rstrip(b"\n") for paragraph in paragraphs)
              if final_lf:
