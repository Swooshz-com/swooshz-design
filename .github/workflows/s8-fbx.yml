            set -e
            /usr/bin/rm -rf -- "$regression_root"
            [[ "$status" == 0 ]]
          }

          wait_reap_positive_controls() {
            local regression_root source_file status
            regression_root="$(/usr/bin/mktemp -d)" || return 1
            source_file="$regression_root/source.txt"
            {
              declare -f wait_for_tracked_pid
              declare -f run_tracked_command
              declare -f reap_tracked_children
            } > "$source_file"
            /usr/bin/python3 - "$source_file" <<'PY'
          from pathlib import Path
          import re, sys
          source=Path(sys.argv[1]).read_text(encoding="utf-8")
          def valid(t):
              required=[
                  'unset -v wait_witness',
                  'wait -p wait_witness "$pid"',
                  'wait_status=$?',
                  '[[ ${wait_witness+x} == x && "$wait_witness" == "$pid" ]]',
                  'tracked_children+=("$child_pid")',
                  'remove_tracked_pid_exact "$child_pid"',
                  'remove_tracked_pid_exact "$pid"',
              ]
              if any(x not in t for x in required): return False
              if any(x in t for x in ['! wait -p','wait "$pid"','tracked_children=("$child_pid")','[[ "$wait_status" == 127 ]]','[[ "$wait_status" == 143 ]]']): return False
              if not re.search(r'if wait -p wait_witness "\$pid"; then\s+wait_status=0;\s+else\s+wait_status=\$\?;',t): return False
              if re.search(r'reap_tracked_children \(\).*?tracked_children=\(\)',t,re.S): return False
              run=t[t.index('run_tracked_command ()'):t.index('reap_tracked_children ()')]
              pos=-1
              for token in ['critical_section=1','"$@" &','child_pid=$!','tracked_children+=("$child_pid")','all_launched_children_reaped=0','critical_section=0']:
                  pos=run.find(token,pos+1)
                  if pos<0:return False
              return True
          if not valid(source): raise SystemExit("correct source rejected")
          variants={
              "PLAIN_WAIT":source.replace('wait -p wait_witness "$pid"','wait "$pid"',1),
              "WITNESS_NOT_RESET":source.replace('unset -v wait_witness','wait_witness=stale',1),
              "MISMATCHED_WITNESS":source.replace('"$wait_witness" == "$pid"','"$wait_witness" != "$pid"',1),
              "STATUS_OVERWRITTEN":re.sub(r'else\n(\s*)wait_status=\$\?',r'else\n\1:\n\1wait_status=$?',source,count=1),
              "BANG_WAIT":source.replace('if wait -p wait_witness "$pid"; then','if ! wait -p wait_witness "$pid"; then',1),
              "RAW_WAIT":re.sub(r'if wait -p wait_witness "\$pid"; then\s+wait_status=0;\s+else\s+wait_status=\$\?;\s+fi;', 'wait -p wait_witness "$pid"; wait_status=$?;', source, count=1),
              "EXIT127_UNKNOWN":source.replace('out_status="$wait_status";','out_status="$wait_status"; [[ "$wait_status" == 127 ]] && return 1;',1),
              "EXIT143_INTERRUPTED":source.replace('out_status="$wait_status";','out_status="$wait_status"; [[ "$wait_status" == 143 ]] && continue;',1),
              "BLANKET_CLEAR":source.replace('if (( ${#tracked_children[@]} == 0 && unresolved == 0 )); then','tracked_children=(); if (( ${#tracked_children[@]} == 0 && unresolved == 0 )); then',1),
          }
          for label,mutated in variants.items():
              if mutated==source: raise SystemExit("mutation did not apply:"+label)
              if valid(mutated): raise SystemExit("defective variant accepted:"+label)
              print("WAIT_POSITIVE_CONTROL_"+label+"=PASS")
          print("REGISTRATION_CRITICAL_SECTION=PASS")
          print("WAIT_REAP_POSITIVE_CONTROLS=PASS")
          PY
            status=$?
            /usr/bin/rm -rf -- "$regression_root"
            [[ "$status" == 0 ]]
          }

          wait_reap_regression || fail_amendment "WAIT_REAP_REGRESSION_FAILED"
          wait_reap_positive_controls || fail_amendment "WAIT_REAP_POSITIVE_CONTROLS_FAILED"

          delete_carrier_exact() {
            carrier_path_is_safe || return 1
            local delete_status
            set +e
            /usr/bin/sudo -n /usr/bin/rm -rf -- "$carrier"
            delete_status=$?
            set -e
            printf 'CARRIER_DELETE_STATUS=%s\n' "$delete_status"
            (( delete_status == 0 )) || return 1
            require_enoent_only "$carrier" || return 1
            admit_root_snapshot || return 1
            carrier_lifecycle=DELETED
            printf 'CARRIER_POST_CLEANUP_ABSENT=YES\nROOT_IDENTITY_STABLE=YES\n'
            return 0
          }

          remove_temp_exact() {
            [[ "$all_launched_children_reaped" == 1 && ${#tracked_children[@]} == 0 ]] || return 1
            temp_path_is_safe || return 1
            restore_temp_owner_permissions || return 1
            local remove_status
            set +e
            /usr/bin/rm -rf -- "$temp_root"
            remove_status=$?
            set -e
            (( remove_status == 0 )) || return 1
            [[ ! -e "$temp_root" && ! -L "$temp_root" ]]
          }

          restore_temp_owner_permissions() {
            /usr/bin/find -P "$temp_root" -xdev -type d -exec /usr/bin/chmod u+wx -- {} +
          }

          temp_cleanup_regression() {
            local regression_root regression_script status
            regression_root="$(/usr/bin/mktemp -d)" || return 1
            regression_script="$regression_root/temp-cleanup-regression.sh"
            {
              declare -f restore_temp_owner_permissions
              declare -f remove_temp_exact
              /usr/bin/cat <<'SH'
          set -Eeuo pipefail
          regression_root="$(/usr/bin/mktemp -d)"
          cleanup_regression() {
            /usr/bin/find -P "$regression_root" -xdev -type d -exec /usr/bin/chmod u+wx -- {} + 2>/dev/null || true
            /usr/bin/rm -rf -- "$regression_root" 2>/dev/null || true
          }
          trap cleanup_regression EXIT
          fixture_root="$regression_root/fixture"
          old_temp_root="$fixture_root/old-temp-root"
          corrected_temp_root="$fixture_root/temp-root"
          sibling_root="$regression_root/sibling"
          outside_root="$regression_root/outside"
          /usr/bin/install -d -m 0700 -- "$old_temp_root/dir" "$corrected_temp_root/dir" "$sibling_root" "$outside_root/target"
          printf 'old-file\n' > "$old_temp_root/dir/file"
          printf 'old-executable\n' > "$old_temp_root/executable"
          printf 'corrected-file\n' > "$corrected_temp_root/dir/file"
          printf 'corrected-executable\n' > "$corrected_temp_root/executable"
          printf 'sibling-sentinel\n' > "$sibling_root/sentinel"
          printf 'outside-sentinel\n' > "$outside_root/target/payload"
          /usr/bin/ln -s -- "$outside_root/target" "$corrected_temp_root/outside-link"
          /usr/bin/chmod 0555 -- "$old_temp_root" "$old_temp_root/dir" "$old_temp_root/executable" "$corrected_temp_root" "$corrected_temp_root/dir" "$corrected_temp_root/executable" "$outside_root/target"
          /usr/bin/chmod 0444 -- "$old_temp_root/dir/file" "$corrected_temp_root/dir/file"
          sibling_before="$(/usr/bin/sha256sum -- "$sibling_root/sentinel" | /usr/bin/awk '{print $1}')"
          outside_mode_before="$(/usr/bin/stat -c '%a' -- "$outside_root/target")"
          outside_before="$(/usr/bin/sha256sum -- "$outside_root/target/payload" | /usr/bin/awk '{print $1}')"

          old_status=0
          /usr/bin/rm -rf -- "$old_temp_root" >/dev/null 2>"$regression_root/old-rm.stderr" || old_status=$?
          [[ "$old_status" != 0 || -e "$old_temp_root" || -L "$old_temp_root" ]] || exit 1
          printf 'OLD_SHAPE_PLAIN_RM_FAILS_OR_IS_INSUFFICIENT=YES\n'
          if [[ -e "$old_temp_root" || -L "$old_temp_root" ]]; then
            /usr/bin/find -P "$old_temp_root" -xdev -type d -exec /usr/bin/chmod u+wx -- {} +
            /usr/bin/rm -rf -- "$old_temp_root"
          fi

          temp_root="$corrected_temp_root"
          temp_path_is_safe() {
            [[ "$temp_root" == "$corrected_temp_root" && -d "$temp_root" && ! -L "$temp_root" ]]
          }
          tracked_children=(424242)
          all_launched_children_reaped=0
          blocked_mode="$(/usr/bin/stat -c '%a' -- "$temp_root")"
          if remove_temp_exact; then exit 1; fi
          [[ -d "$temp_root" && "$(/usr/bin/stat -c '%a' -- "$temp_root")" == "$blocked_mode" ]]
          printf 'TEMP_CLEANUP_REAP_GATE=PASS\n'

          tracked_children=()
          all_launched_children_reaped=1
          temp_path_is_safe
          restore_temp_owner_permissions
          [[ "$(/usr/bin/stat -c '%a' -- "$temp_root")" == 755 ]]
          [[ "$(/usr/bin/stat -c '%a' -- "$temp_root/dir")" == 755 ]]
          [[ "$(/usr/bin/stat -c '%a' -- "$temp_root/dir/file")" == 444 ]]
          [[ "$(/usr/bin/stat -c '%a' -- "$outside_root/target")" == "$outside_mode_before" ]]
          printf 'BOUNDED_OWNER_PERMISSION_RESTORE=PASS\n'
          remove_temp_exact
          [[ ! -e "$temp_root" && ! -L "$temp_root" ]]
          printf 'TEMP_ROOT_REMOVAL=PASS\nTEMP_ROOT_ABSENT=YES\n'
          [[ "$(/usr/bin/sha256sum -- "$sibling_root/sentinel" | /usr/bin/awk '{print $1}')" == "$sibling_before" ]]
          printf 'SIBLING_UNCHANGED=YES\n'
          [[ -d "$outside_root/target" && "$(/usr/bin/stat -c '%a' -- "$outside_root/target")" == "$outside_mode_before" ]]
          [[ "$(/usr/bin/sha256sum -- "$outside_root/target/payload" | /usr/bin/awk '{print $1}')" == "$outside_before" ]]
          printf 'SYMLINK_NOT_FOLLOWED=YES\nTEMP_CLEANUP_SYMLINK_NONFOLLOW=PASS\nTEMP_CLEANUP_SIBLING_CONFINEMENT=PASS\nTEMP_CLEANUP_CONFINEMENT=PASS\nTEMP_CLEANUP_PERMISSION_RESTORE=PASS\nTEMP_CLEANUP_HARDENED_TREE_REGRESSION=PASS\nTEMP_CLEANUP_REGRESSION=PASS\n'
          SH
            } > "$regression_script"
            /usr/bin/chmod 0700 -- "$regression_script"
            set +e
            /usr/bin/bash "$regression_script"
            status=$?
            set -e
            /usr/bin/rm -rf -- "$regression_root"
            [[ "$status" == 0 ]]
          }

          remove_provision_exact() {
            provision_path_is_safe || return 1
            /usr/bin/rm -rf -- "$provision_root"
            [[ ! -e "$provision_root" && ! -L "$provision_root" ]]
          }

          cleanup() {
            local status=$?
            local cleanup_failed=0
            local signal_status
            local candidate_defect_proven=0
            local candidate_defect_reason=""
            if (( cleanup_running == 1 )); then
              exit "$status"
            fi
            cleanup_running=1
            trap - EXIT
            trap - HUP INT TERM
            if [[ -n "$candidate_defect_marker_file" && ( -e "$candidate_defect_marker_file" || -L "$candidate_defect_marker_file" ) ]]; then
              if [[ -f "$candidate_defect_marker_file" && ! -L "$candidate_defect_marker_file" ]]; then
                IFS= read -r candidate_defect_reason < "$candidate_defect_marker_file" || candidate_defect_reason=""
              fi
              if [[ ! "$candidate_defect_reason" =~ ^[A-Z0-9_]{1,96}$ ]]; then
                candidate_defect_reason=SEED_CANDIDATE_DEFECT_MARKER_INVALID
              fi
              candidate_defect_proven=1
            fi
            if ! reap_tracked_children; then
              printf 'CHILDREN_REAPED=NO\n' >&2
              cleanup_failed=1
            else
              printf 'CHILDREN_REAPED=YES\n'
            fi
            if (( broker_deployment_attempted == 1 )); then
              if (( all_launched_children_reaped == 1 )) && /usr/bin/python3 "$GITHUB_WORKSPACE/native/s8-sandbox-broker/tests/broker_contract.py" --hosted-cleanup "$temp_root"; then
                broker_deployment_attempted=0
              else
                printf 'BROKER_DEPLOYMENT_CLEANUP=FAIL\nPRODUCTION_DEPLOYMENT_ABSENT=NO\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( carrier_created_by_attempt == 1 )); then
              if (( carrier_identity_recorded == 1 && carrier_identity_poisoned == 0 && identity_poisoned == 0 && all_launched_children_reaped == 1 )); then
                if delete_carrier_exact; then
                  printf 'CLEANUP_CONFINEMENT_RESULT=PASS\nCLEANUP_RESULT=PASS\n'
                  carrier_created_by_attempt=0
                else
                  printf 'CLEANUP_CONFINEMENT_RESULT=FAIL\nCLEANUP_RESULT=FAIL\nDO_NOT_DELETE=HOLD\n' >&2
                  cleanup_failed=1
                fi
              else
                printf 'DO_NOT_DELETE=HOLD\nCLEANUP_CONFINEMENT_RESULT=FAIL\nCLEANUP_RESULT=FAIL\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( provision_created == 1 )); then
              if (( all_launched_children_reaped == 1 )); then
                if remove_provision_exact; then
                  printf 'PROVISIONING_CLEANUP_RESULT=PASS\n'
                  provision_created=0
                else
                  printf 'PROVISIONING_CLEANUP_RESULT=FAIL\n' >&2
                  cleanup_failed=1
                fi
              else
                printf 'PROVISIONING_CLEANUP_RESULT=DEFERRED_UNRESOLVED_CHILD\n' >&2
                cleanup_failed=1
              fi
            fi
            if (( temp_created == 1 )); then
              if (( all_launched_children_reaped == 1 && broker_deployment_attempted == 0 )); then
                if remove_temp_exact; then
                  temp_created=0
                else
                  printf 'TEMP_CLEANUP_RESULT=FAIL\n' >&2
                  cleanup_failed=1
                fi
              else
                if (( broker_deployment_attempted == 1 )); then
                  printf 'TEMP_CLEANUP_RESULT=DEFERRED_BROKER_DEPLOYMENT_RESIDUE\n' >&2
                else
                  printf 'TEMP_CLEANUP_RESULT=DEFERRED_UNRESOLVED_CHILD\n' >&2
                fi
                cleanup_failed=1
              fi
            fi
            if [[ -n "$candidate_marker_file" && -e "$candidate_marker_file" ]]; then
              candidate_started=1
            fi
            if [[ -n "$received_signal" && "$status" == 0 ]]; then
              signal_status="$(signal_exit_status "$received_signal")"
              status="$signal_status"
            fi
            if (( cleanup_failed == 1 )); then
              status=1
              if (( failure_reported == 0 )); then
                if (( candidate_defect_proven == 1 )); then
                  printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_DEFECT__SEED_ACL_BOUNDARY\nCANDIDATE_DEFECT=%s\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' "$candidate_defect_reason" >&2
                else
                  printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
                fi
              fi
            elif (( status != 0 && candidate_defect_proven == 1 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_DEFECT__SEED_ACL_BOUNDARY\nCANDIDATE_DEFECT=%s\nRETURN_TO_WEB=YES\n' "$candidate_defect_reason" >&2
            elif (( status != 0 && failure_reported == 0 && candidate_started == 0 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            elif (( status != 0 && failure_reported == 0 && candidate_started == 1 )); then
              printf 'CANDIDATE_FAILURE_PROVEN=YES\nFAILURE_CLASS=CANDIDATE_FAILURE_UNCLASSIFIED\n' >&2
            fi
            if (( cleanup_failed == 0 )); then
              printf 'CLEANUP=PASS\n'
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'handle_signal HUP' HUP
          trap 'handle_signal INT' INT
          trap 'handle_signal TERM' TERM
          temp_cleanup_regression || fail_amendment "TEMP_CLEANUP_REGRESSION_FAILED"
          run_top_level_carrier_regression || fail_hold "TOP_LEVEL_CARRIER_REGRESSION_FAILED"
          run_mount_admission_regression

          [[ -n "$run_id" && "$run_id" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ID_NOT_ASCII_DECIMAL"
          [[ -n "$run_attempt" && "$run_attempt" =~ ^[0-9]+$ ]] || fail_hold "GITHUB_RUN_ATTEMPT_NOT_ASCII_DECIMAL"
          carrier="/s8-ci-carrier-${run_id}.${run_attempt}"
          printf 'CARRIER_TEMPLATE=/s8-ci-carrier-RUN.ATTEMPT\nCARRIER=%s\nHOST_CARRIER_OWNERSHIP=root:root\nSANDBOX_UID=65534\nSANDBOX_GID=65534\n' "$carrier"

          runner_label="${S8_RUNNER_LABEL:-}"
          [[ "$runner_label" == "ubuntu-24.04" ]] || fail_hold "RUNNER_LABEL_UNEXPECTED"
          runner_arch="${RUNNER_ARCH:-}"
          [[ "$runner_arch" == "X64" ]] || fail_hold "RUNNER_ARCH_UNEXPECTED"
          os_id="$(awk -F= '$1 == "ID" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          version_id="$(awk -F= '$1 == "VERSION_ID" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          version_codename="$(awk -F= '$1 == "VERSION_CODENAME" { gsub(/\"/, "", $2); print $2 }' /etc/os-release)"
          dpkg_arch="$(/usr/bin/dpkg --print-architecture)"
          [[ "$os_id" == "ubuntu" ]] || fail_hold "OS_ID_UNEXPECTED"
          [[ "$version_id" == "24.04" ]] || fail_hold "VERSION_ID_UNEXPECTED"
          [[ "$version_codename" == "noble" ]] || fail_hold "VERSION_CODENAME_UNEXPECTED"
          [[ "$dpkg_arch" == "amd64" ]] || fail_hold "DPKG_ARCH_UNEXPECTED"
          printf 'OS_ID=%s\nVERSION_ID=%s\nVERSION_CODENAME=%s\nDPKG_ARCH=%s\nRUNNER_LABEL=%s\nRUNNER_ARCH=%s\n' "$os_id" "$version_id" "$version_codename" "$dpkg_arch" "$runner_label" "$runner_arch"

          [[ "$EUID" -ne 0 ]] || fail_hold "HOST_ORCHESTRATOR_IS_ROOT"
