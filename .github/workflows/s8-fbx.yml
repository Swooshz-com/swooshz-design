          run_guarded_caller_regressions || fail_amendment "GUARDED_CALLER_REGRESSION_FAILED"
          admit_root_and_carrier || fail_hold "PROBE_CARRIER_OWNER_MODE_FAILED"
          mount_table_admission "$carrier" || fail_hold "MOUNT_ADMISSION_BEFORE_PROBE_FAILED"
