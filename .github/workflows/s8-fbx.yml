name: S8 FBX end-to-end contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  s8-actionlint:
    name: S8 pinned actionlint ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            asset: actionlint_1.7.12_linux_amd64.tar.gz
            sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          - platform: windows/amd64
            runner: windows-2025
            asset: actionlint_1.7.12_windows_amd64.zip
            sha256: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Download verify and run pinned actionlint on Linux
        if: matrix.platform == 'linux/amd64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_ASSET: ${{ matrix.asset }}
          ACTIONLINT_SHA256: ${{ matrix.sha256 }}
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          status_before="$(git status --porcelain=v1 --untracked-files=all)"
          actionlint_root="$RUNNER_TEMP/s8-actionlint-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT-linux"
          [[ ! -e "$actionlint_root" && ! -L "$actionlint_root" ]]
          /usr/bin/install -d -m 0700 -- "$actionlint_root"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern "$ACTIONLINT_ASSET" --dir "$actionlint_root" --clobber
          archive="$actionlint_root/$ACTIONLINT_ASSET"
          [[ -f "$archive" && ! -L "$archive" ]]
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          extract_root="$actionlint_root/extracted"
          /usr/bin/install -d -m 0700 -- "$extract_root"
          tar -tzf "$archive" | awk '/^\// || /(^|\/)\.\.(\/|$)/ { bad = 1 } END { exit bad }'
          tar -xzf "$archive" --directory "$extract_root" --no-same-owner --no-same-permissions
          mapfile -t actionlint_bins < <(find -P "$extract_root" -type f -name actionlint -print)
          [[ "${#actionlint_bins[@]}" == 1 && "${actionlint_bins[0]}" == "$extract_root/actionlint" ]]
          actionlint_bin="${actionlint_bins[0]}"
          /usr/bin/chmod 0555 -- "$actionlint_bin"
          actionlint_version="$($actionlint_bin -version 2>&1)"
          grep -F '1.7.12' <<< "$actionlint_version" >/dev/null
          "$actionlint_bin" .github/workflows/s8-fbx.yml
          status_after="$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$status_before" == "$status_after" ]]
          printf 'ACTIONLINT_PLATFORM=linux/amd64\nACTIONLINT_VERSION=1.7.12\nACTIONLINT=PASS\nREPOSITORY_STATUS_PRESERVED=YES\n'
      - name: Download verify and run pinned actionlint on Windows
        if: matrix.platform == 'windows/amd64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_ASSET: ${{ matrix.asset }}
          ACTIONLINT_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'ACTIONLINT_PLATFORM_NOT_ADMITTED' }
          $statusBefore = (@(git status --porcelain=v1 --untracked-files=all) -join "`n")
          $actionlintRoot = Join-Path $env:RUNNER_TEMP ("s8-actionlint-{0}.{1}-windows" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $actionlintRoot) { throw 'ACTIONLINT_TEMP_NOT_FRESH' }
          New-Item -ItemType Directory -Path $actionlintRoot -Force | Out-Null
          & gh release download v1.7.12 --repo rhysd/actionlint --pattern $env:ACTIONLINT_ASSET --dir $actionlintRoot --clobber
          if ($LASTEXITCODE -ne 0) { throw 'ACTIONLINT_RELEASE_DOWNLOAD_FAILED' }
          $archive = Join-Path $actionlintRoot $env:ACTIONLINT_ASSET
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ACTIONLINT_SHA256.ToLowerInvariant()) { throw 'ACTIONLINT_ARCHIVE_SHA256_MISMATCH' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in $zip.Entries) {
              $entryName = $entry.FullName.Replace('\', '/')
              if ([System.IO.Path]::IsPathRooted($entryName) -or $entryName -match '(^|/)\.\.(\/|$)') { throw 'ACTIONLINT_ARCHIVE_PATH_TRAVERSAL' }
            }
          } finally {
            $zip.Dispose()
          }
          $extractRoot = Join-Path $actionlintRoot 'extracted'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $extractRoot)
          $candidates = @(Get-ChildItem -LiteralPath $extractRoot -Recurse -File -Filter actionlint.exe)
          if ($candidates.Count -ne 1 -or $candidates[0].FullName -ne (Join-Path $extractRoot 'actionlint.exe')) { throw 'ACTIONLINT_BINARY_PATH_INVALID' }
          if (($candidates[0].Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'ACTIONLINT_BINARY_LINK_INVALID' }
          $actionlintBin = $candidates[0].FullName
          $version = (& $actionlintBin -version 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.7\.12') { throw 'ACTIONLINT_VERSION_INVALID' }
          & $actionlintBin (Join-Path (Get-Location) '.github/workflows/s8-fbx.yml')
          if ($LASTEXITCODE -ne 0) { throw 'ACTIONLINT_FAILED' }
          $statusAfter = (@(git status --porcelain=v1 --untracked-files=all) -join "`n")
          if ($statusBefore -cne $statusAfter) { throw 'REPOSITORY_STATUS_CHANGED' }
          Write-Output 'ACTIONLINT_PLATFORM=windows/amd64'
          Write-Output 'ACTIONLINT_VERSION=1.7.12'
          Write-Output 'ACTIONLINT=PASS'
          Write-Output 'REPOSITORY_STATUS_PRESERVED=YES'

  s8-static:
    name: S8 static and TypeScript floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret preflight
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- .; then
            echo "credential-like material detected in tracked files" >&2
            exit 1
          fi
      - name: Static boundary proof
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/s8-fbx.yml
          if grep -nE '(^|[[:space:]])(sysctl|apparmor_parser|aa-enforce|aa-disable)([[:space:]]|$)' "$workflow"; then
            echo 'global policy mutation detected' >&2
            exit 1
          fi
          trigger_deferral='--no-'triggers
          trigger_unpack='dpkg[[:space:]]+--'unpack
          trigger_config='dpkg[[:space:]]+--'configure'[[:space:]]+--no'
          if grep -nE -- "$trigger_deferral|$trigger_unpack|$trigger_config" "$workflow"; then
            echo 'trigger deferral or suppression detected' >&2
            exit 1
          fi
          if grep -nE '(^|[[:space:]])(cp|install|mv|ln)[[:space:]].*(/usr/bin/bwrap|bwrap-staged)' "$workflow"; then
            echo 'staged alternate bwrap path detected' >&2
            exit 1
          fi
          if grep -nE '(^|[;&|])[[:space:]]*(exec[[:space:]]+)?/usr/bin/bwrap([[:space:]]|$)' "$workflow"; then
            echo 'non-root bwrap execution accepted' >&2
            exit 1
          fi
          if grep -nE '&[[:space:]]+6000([^0-9]|$)' "$workflow"; then
            echo 'decimal privilege mask used in live workflow arithmetic' >&2
            exit 1
          fi
          legacy_trigger_reader="$(printf 'man_db_%s_lines' trigger)"
          if grep -nF -- "$legacy_trigger_reader" "$workflow"; then
            echo 'legacy semantic man-db trigger reader detected' >&2
            exit 1
          fi
          octal_privilege_mask='& 0'6000
          grep -F "$octal_privilege_mask" "$workflow" >/dev/null
          grep -F 'TRIGGER_SHA256' "$workflow" >/dev/null
          grep -F 'O_NOFOLLOW' "$workflow" >/dev/null
          test "$(grep -Fc '/usr/bin/sudo -n /usr/bin/bwrap' "$workflow")" -ge 2
          printf 'STATIC_BOUNDARY_PROOF=PASS\nDECIMAL_PRIVILEGE_MASK_6000=ABSENT\nOCTAL_PRIVILEGE_MASK_06000=PRESENT\nGLOBAL_APPARMOR_CHANGES=ABSENT\nSYSCTL_CHANGES=ABSENT\nTRIGGER_DEFERRAL_SUPPRESSION=ABSENT\nLEGACY_TRIGGER_SEMANTIC_READER=ABSENT\nTRIGGER_RAW_BYTE_CHECKER=PRESENT\nTRIGGER_SAFE_OPEN_FLAGS=PRESENT\nSTAGED_ALTERNATE_BWRAP_PATH=ABSENT\nSETUID_EXECUTION_ACCEPTANCE=ABSENT\n'
      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false
      - name: Full repository tests
        run: pnpm test
      - name: Writer contract regression
        run: python3 scripts/s8/blender_writer_contract_regression.py
      - name: Python syntax
        run: python3 -m py_compile blender/s8-fbx-writer/writer.py scripts/s8/*.py
      - name: Diff hygiene
        run: git diff --check
      - name: Application build
        run: pnpm run build

  s8-native:
    name: S8 native validator and process runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Build and run native process boundary
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-process-runner -B "$RUNNER_TEMP/s8-runner" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-runner" --config Release --parallel
          registered="$(ctest --test-dir "$RUNNER_TEMP/s8-runner" -N | awk 'index($0, "s8-runner.") { count += 1 } END { print count + 0 }')"
          printf 'REGISTERED_NATIVE_CASES=%s\n' "$registered"
          test "$registered" -eq 20
          ctest --test-dir "$RUNNER_TEMP/s8-runner" -R '^s8-runner\.' --output-on-failure
      - name: Build and run native validator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/s8-fbx-validator -B "$RUNNER_TEMP/s8-validator" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s8-validator" --config Release --parallel
          ctest --test-dir "$RUNNER_TEMP/s8-validator" --output-on-failure
          "$RUNNER_TEMP/s8-validator/s8-fbx-validator" --self-test

  # This job is the accepted Option-B environment amendment. It intentionally
  # keeps the native runner and candidate qualification inside the hosted
  # Bubblewrap boundary; no product or native source is changed here.
  s8-pinned-blender:
    name: S8 pinned Blender hosted sandbox amendment
    runs-on: ubuntu-24.04
    env:
      S8_RUNNER_LABEL: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Hosted sandbox environment amendment
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C

          candidate_started=0
          failure_reported=0
          carrier_created_by_attempt=0
          carrier_identity_recorded=0
          carrier_identity_poisoned=0
          identity_poisoned=0
          carrier_lifecycle=UNCREATED
          all_launched_children_reaped=1
          cleanup_running=0
          critical_section=0
          pending_signal=""
          received_signal=""
          stop_new_launches=0
          tracked_children=()
          temp_created=0
          provision_created=0
          carrier_parent="/"
          run_id="${GITHUB_RUN_ID-}"
          run_attempt="${GITHUB_RUN_ATTEMPT-}"
          carrier=""
          root_baseline_identity=""
          carrier_baseline_identity=""
          work=""
          immutable_work_path=""
          work_identity=""
          work_device_inode=""
          temp_root=""
          provision_root=""
          candidate_marker_file=""
          tmpfs_bytes=1073741824
          iproute2_admission_baseline=""

          fail_hold() {
            failure_reported=1
            printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            printf 'HOSTED_SANDBOX_HOLD_REASON=%s\n' "$1" >&2
            exit 1
          }

          fail_amendment() {
            failure_reported=1
            printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
            printf 'AMENDMENT_FAILURE_REASON=%s\n' "$1" >&2
            exit 1
          }

          stable_identity() {
            local path="$1"
            local raw device inode mode_hex uid gid permission_bits full_mode type_bits mode_bits
            raw="$(/usr/bin/stat -c '%d:%i:%f:%u:%g:%a' -- "$path")" || return 1
            IFS=: read -r device inode mode_hex uid gid permission_bits <<< "$raw"
            [[ "$mode_hex" =~ ^[0-9A-Fa-f]+$ ]] || return 1
            [[ "$permission_bits" =~ ^[0-7]+$ ]] || return 1
            [[ "$device" =~ ^[0-9]+$ && "$inode" =~ ^[0-9]+$ && "$uid" =~ ^[0-9]+$ && "$gid" =~ ^[0-9]+$ ]] || return 1
            full_mode=$((16#$mode_hex))
            type_bits=$((full_mode & 0xF000))
            mode_bits=$((8#$permission_bits & 0777))
            printf '%s:%s:%04x:%s:%s:%04o\n' \
              "$device" \
              "$inode" \
              "$type_bits" \
              "$uid" \
              "$gid" \
              "$mode_bits"
          }

          acl_perm_for_mode() {
            local bits="$1"
            local result=''
            (( bits & 4 )) && result+='r' || result+='-'
            (( bits & 2 )) && result+='w' || result+='-'
            (( bits & 1 )) && result+='x' || result+='-'
            printf '%s\n' "$result"
          }

          ordinary_acl_is_exact() {
            local path="$1"
            local mode_text="$2"
            local acl_text line mode_value owner_expected group_expected other_expected
            local user_perm='' group_perm='' other_perm=''
            local -a acl_lines=()
            acl_text="$(/usr/bin/getfacl --numeric --omit-header --absolute-names -- "$path")" || return 1
            mapfile -t acl_lines < <(printf '%s\n' "$acl_text")
            (( ${#acl_lines[@]} == 3 )) || return 1
            for line in "${acl_lines[@]}"; do
              [[ -n "$line" ]] || return 1
              if [[ "$line" =~ ^user::([r-][w-][x-])$ ]]; then
                [[ -z "$user_perm" ]] || return 1
                user_perm="${BASH_REMATCH[1]}"
              elif [[ "$line" =~ ^group::([r-][w-][x-])$ ]]; then
                [[ -z "$group_perm" ]] || return 1
                group_perm="${BASH_REMATCH[1]}"
              elif [[ "$line" =~ ^other::([r-][w-][x-])$ ]]; then
                [[ -z "$other_perm" ]] || return 1
                other_perm="${BASH_REMATCH[1]}"
              else
                return 1
              fi
            done
            [[ -n "$user_perm" && -n "$group_perm" && -n "$other_perm" ]] || return 1
            [[ "$mode_text" =~ ^0[0-7]{3}$ ]] || return 1
            mode_value=$((8#$mode_text & 0777))
            owner_expected="$(acl_perm_for_mode $(( (mode_value >> 6) & 7 )))"
            group_expected="$(acl_perm_for_mode $(( (mode_value >> 3) & 7 )))"
            other_expected="$(acl_perm_for_mode $(( mode_value & 7 )))"
            [[ "$user_perm" == "$owner_expected" && "$group_perm" == "$group_expected" && "$other_perm" == "$other_expected" ]]
          }

          work_acl_is_exact() {
            local acl_text="$1"
            local line expected
            local -a acl_lines=()
            local -a expected_lines=(
              'user::rwx'
              "user:${runner_uid}:rwx"
              'group::---'
              'mask::rwx'
              'other::---'
              'default:user::rwx'
              "default:user:${runner_uid}:rwx"
              'default:group::---'
              'default:mask::rwx'
              'default:other::---'
            )
            declare -A seen=()
            mapfile -t acl_lines < <(printf '%s\n' "$acl_text")
            (( ${#acl_lines[@]} == ${#expected_lines[@]} )) || return 1
            for line in "${acl_lines[@]}"; do
              [[ "$line" =~ ^(default:)?(user|group|mask|other):[^[:space:]]+$ ]] || return 1
              [[ -z "${seen[$line]+present}" ]] || return 1
              seen["$line"]=1
            done
            for expected in "${expected_lines[@]}"; do
              [[ -n "${seen[$expected]+present}" ]] || return 1
            done
          }

          lstat_state() {
            /usr/bin/python3 - "$1" <<'PY'
          import os
          import sys

          try:
              os.lstat(sys.argv[1])
          except FileNotFoundError:
              print("ENOENT")
              raise SystemExit(0)
          except OSError:
              print("LSTAT_ERROR")
              raise SystemExit(2)
          else:
              print("EXISTING_OBJECT")
              raise SystemExit(1)
          PY
          }

          require_enoent_only() {
            local state
            if state="$(lstat_state "$1")"; then
              [[ "$state" == ENOENT ]]
            else
              return 1
            fi
          }

          verify_mountinfo() {
            local byte_count
            [[ -r /proc/self/mountinfo ]] || return 1
            byte_count="$(/usr/bin/wc -c < /proc/self/mountinfo)" || return 1
            [[ "$byte_count" =~ ^[1-9][0-9]*$ ]]
          }

          raw_mount_target_filter() {
            local resolved="$1"
            local output_file="$2"
            /usr/bin/awk -v p="$resolved" \
              'BEGIN { found = 0 } $0 == p || index($0, p "/") == 1 { found = 1 } END { exit found ? 1 : 0 }' \
              "$output_file"
          }

          mount_target_admission() {
            local resolved="$1"
            local output_file="$2"
            /usr/bin/python3 - "$output_file" "$resolved" <<'PY'
          from pathlib import Path
          import posixpath
          import sys


          class Reject(Exception):
              pass


          def reject(reason):
              print(f"MOUNT_TARGET_REJECT={reason}", file=sys.stderr)
              raise Reject(reason)


          def decode_record(raw_record):
              decoded = bytearray()
              index = 0
              while index < len(raw_record):
                  value = raw_record[index]
                  if value == 0:
                      reject("NUL")
                  if value == 92:
                      if index + 1 >= len(raw_record):
                          reject("TRAILING_ESCAPE")
                      escaped = raw_record[index + 1]
                      if escaped == 92:
                          decoded.append(92)
                          index += 2
                          continue
                      if escaped < 48 or escaped > 55 or index + 3 >= len(raw_record):
                          reject("MALFORMED_ESCAPE")
                      digits = raw_record[index + 1:index + 4]
                      if any(digit < 48 or digit > 55 for digit in digits):
                          reject("MALFORMED_ESCAPE")
                      decoded.append(int(digits.decode("ascii"), 8))
                      index += 4
                      continue
                  if value in (9, 13, 32):
                      reject("UNESCAPED_WHITESPACE")
                  decoded.append(value)
                  index += 1
              try:
                  value = decoded.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  reject("INVALID_UTF8")
              if not value.startswith("/"):
                  reject("NON_ABSOLUTE")
              if value != "/" and (
                  value.endswith("/")
                  or "//" in value
                  or "/./" in value
                  or value.endswith("/.")
                  or "/../" in value
                  or value.endswith("/..")
                  or posixpath.normpath(value) != value
              ):
                  reject("AMBIGUOUS_PATH")
              return value


          try:
              raw = Path(sys.argv[1]).read_bytes()
              target = sys.argv[2]
              if not raw or b"\x00" in raw or not raw.endswith(b"\n"):
                  reject("MALFORMED_OUTPUT")
              records = raw[:-1].split(b"\n")
              if not records or any(record == b"" for record in records):
                  reject("MALFORMED_RECORD")
              decoded_targets = []
              for record in records:
                  decoded_targets.append(decode_record(record))
              if "/" not in decoded_targets:
                  reject("ROOT_MOUNT_TARGET_MISSING")
              if target in decoded_targets or any(item.startswith(target + "/") for item in decoded_targets):
                  reject("EXACT_OR_DESCENDANT_MOUNT_PRESENT")
              print("MOUNT_TABLE_ADMISSION=NO_EXACT_OR_DESCENDANT_MOUNT")
          except (OSError, Reject):
              raise SystemExit(1)
          PY
          }

          mount_table_output_file=""
          mount_table_error_file=""

          read_mount_table() {
            local output_file error_file status
            output_file="$(/usr/bin/mktemp)" || return 1
            error_file="$(/usr/bin/mktemp)" || {
              /usr/bin/rm -f -- "$output_file"
              return 1
            }
            set +e
            /usr/bin/findmnt -k -r -n -o TARGET >"$output_file" 2>"$error_file"
            status=$?
            set -e
            if (( status != 0 )); then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_COMMAND_STATUS=%s\n' "$status" >&2
              /usr/bin/rm -f -- "$output_file" "$error_file"
              return 1
            fi
            if [[ ! -s "$output_file" ]]; then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=EMPTY_TARGET_SET\n' >&2
              /usr/bin/rm -f -- "$output_file" "$error_file"
              return 1
            fi
            mount_table_output_file="$output_file"
            mount_table_error_file="$error_file"
            return 0
          }

          mount_table_admission() {
            local resolved="$1"
            local result=0
            verify_mountinfo || result=1
            if (( result == 0 )); then
              read_mount_table || result=1
            fi
            if (( result == 0 )); then
              raw_mount_target_filter "$resolved" "$mount_table_output_file" || result=1
            fi
            if (( result == 0 )); then
              mount_target_admission "$resolved" "$mount_table_output_file" || result=1
            fi
            if [[ -n "$mount_table_output_file" || -n "$mount_table_error_file" ]]; then
              /usr/bin/rm -f -- "$mount_table_output_file" "$mount_table_error_file"
              mount_table_output_file=""
              mount_table_error_file=""
