  # This job proves the hosted process boundary and route-B /opt namespace, then
  # exercises the unchanged broker through the fixed application paths.
  s8-pinned-blender:
    name: S8 pinned Blender hosted sandbox amendment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      S8_RUNNER_LABEL: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Node 22 for hosted toolchain
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Classify Node setup failure
        if: ${{ failure() && steps.setup_node.outcome == 'failure' }}
        shell: bash
        run: printf 'FAILURE_CLASS=HOSTED_TOOLCHAIN_HOLD\nTOOLCHAIN_STAGE=SETUP_NODE\n' >&2
      - name: Admit pinned TypeScript toolchain
        shell: bash
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
        run: |
          set -Eeuo pipefail
          hold() { printf 'FAILURE_CLASS=HOSTED_TOOLCHAIN_HOLD\nTOOLCHAIN_STAGE=%s\n' "$1" >&2; exit 1; }
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 22 ]] || hold NODE
          command -v corepack >/dev/null 2>&1 || hold COREPACK
          version="$(corepack pnpm@12.6.0 --version)" || hold PNPM_ACTIVATION
          [[ "$version" == 12.6.0 ]] || hold PNPM_VERSION
          [[ -f pnpm-lock.yaml ]] || hold LOCKFILE
          corepack pnpm@12.6.0 install --frozen-lockfile --ignore-scripts --prod=false || hold FROZEN_INSTALL
          [[ -x node_modules/.bin/tsx ]] || hold TSX
          smoke="$RUNNER_TEMP/s8-tsx-smoke.ts"
          trap 'rm -f -- "$smoke"' EXIT
          printf 'const answer: number = 42;\nif (answer !== 42) throw new Error("TSX_SMOKE_FAILED");\n' > "$smoke"
          corepack pnpm@12.6.0 exec tsx "$smoke" || hold TSX
          printf 'NODE_TOOLCHAIN_ADMISSION=PASS\nPNPM_VERSION=12.6.0\nFROZEN_LOCKFILE_INSTALL=PASS\nTSX_RESOLUTION=PASS\nTSX_SMOKE=PASS\n'
      - name: Hosted sandbox environment amendment
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          if [[ "${S8_MOUNT_NAMESPACE_ACTIVE:-0}" != "1" ]]; then
            /usr/bin/python3 "$GITHUB_WORKSPACE/native/s8-sandbox-broker/tests/hosted_deployment_namespace.py" --hosted-namespace-run "$0"
            exit $?
          fi

          candidate_started=0
          failure_reported=0
          carrier_created_by_attempt=0
          carrier_identity_recorded=0
          carrier_identity_poisoned=0
          identity_poisoned=0
          carrier_lifecycle=UNCREATED
          all_launched_children_reaped=1
          cleanup_running=0
          critical_section=0
          pending_signal=""
          received_signal=""
          stop_new_launches=0
          tracked_children=()
          temp_created=0
          provision_created=0
          broker_deployment_attempted=0
          carrier_parent="/"
          run_id="${GITHUB_RUN_ID-}"
          run_attempt="${GITHUB_RUN_ATTEMPT-}"
          carrier=""
          root_baseline_identity=""
          carrier_baseline_identity=""
          work=""
          immutable_work_path=""
          work_identity=""
          work_device_inode=""
          temp_root=""
          provision_root=""
          candidate_marker_file=""
          candidate_defect_marker_file=""
          tmpfs_bytes=1073741824
          iproute2_admission_baseline=""

          fail_hold() {
            failure_reported=1
            printf 'CANDIDATE_FAILURE_PROVEN=NO\nFAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD\n' >&2
            printf 'HOSTED_SANDBOX_HOLD_REASON=%s\n' "$1" >&2
            exit 1
          }

          fail_amendment() {
            failure_reported=1
            printf 'AMENDMENT_RESULT=NOT_GREEN\nCANDIDATE_FAILURE_PROVEN=NO\nNON_CONVERGENCE_DECISION_REQUIRED=NO\nRETURN_TO_WEB=YES\n' >&2
            printf 'AMENDMENT_FAILURE_REASON=%s\n' "$1" >&2
            exit 1
          }

          stable_identity() {
            local path="$1"
            local raw device inode mode_hex uid gid permission_bits full_mode type_bits mode_bits
            raw="$(/usr/bin/stat -c '%d:%i:%f:%u:%g:%a' -- "$path")" || return 1
            IFS=: read -r device inode mode_hex uid gid permission_bits <<< "$raw"
            [[ "$mode_hex" =~ ^[0-9A-Fa-f]+$ ]] || return 1
            [[ "$permission_bits" =~ ^[0-7]+$ ]] || return 1
            [[ "$device" =~ ^[0-9]+$ && "$inode" =~ ^[0-9]+$ && "$uid" =~ ^[0-9]+$ && "$gid" =~ ^[0-9]+$ ]] || return 1
            full_mode=$((16#$mode_hex))
            type_bits=$((full_mode & 0xF000))
            mode_bits=$((8#$permission_bits & 0777))
            printf '%s:%s:%04x:%s:%s:%04o\n' \
              "$device" \
              "$inode" \
              "$type_bits" \
              "$uid" \
              "$gid" \
              "$mode_bits"
          }

          acl_perm_for_mode() {
            local bits="$1"
            local result=''
            (( bits & 4 )) && result+='r' || result+='-'
            (( bits & 2 )) && result+='w' || result+='-'
            (( bits & 1 )) && result+='x' || result+='-'
            printf '%s\n' "$result"
          }

          ordinary_acl_is_exact() {
            local path="$1"
            local mode_text="$2"
            local acl_text line mode_value owner_expected group_expected other_expected
            local user_perm='' group_perm='' other_perm=''
            local -a acl_lines=()
            acl_text="$(/usr/bin/getfacl --numeric --omit-header --absolute-names -- "$path")" || return 1
            mapfile -t acl_lines < <(printf '%s\n' "$acl_text")
            (( ${#acl_lines[@]} == 3 )) || return 1
            for line in "${acl_lines[@]}"; do
              [[ -n "$line" ]] || return 1
              if [[ "$line" =~ ^user::([r-][w-][x-])$ ]]; then
                [[ -z "$user_perm" ]] || return 1
                user_perm="${BASH_REMATCH[1]}"
              elif [[ "$line" =~ ^group::([r-][w-][x-])$ ]]; then
                [[ -z "$group_perm" ]] || return 1
                group_perm="${BASH_REMATCH[1]}"
              elif [[ "$line" =~ ^other::([r-][w-][x-])$ ]]; then
                [[ -z "$other_perm" ]] || return 1
                other_perm="${BASH_REMATCH[1]}"
              else
                return 1
              fi
            done
            [[ -n "$user_perm" && -n "$group_perm" && -n "$other_perm" ]] || return 1
            [[ "$mode_text" =~ ^0[0-7]{3}$ ]] || return 1
            mode_value=$((8#$mode_text & 0777))
            owner_expected="$(acl_perm_for_mode $(( (mode_value >> 6) & 7 )))"
            group_expected="$(acl_perm_for_mode $(( (mode_value >> 3) & 7 )))"
            other_expected="$(acl_perm_for_mode $(( mode_value & 7 )))"
            [[ "$user_perm" == "$owner_expected" && "$group_perm" == "$group_expected" && "$other_perm" == "$other_expected" ]]
          }

          work_acl_is_exact() {
            local acl_text="$1"
            local line expected
            local -a acl_lines=()
            local -a expected_lines=(
              'user::rwx'
              "user:${runner_uid}:rwx"
              'group::---'
              'mask::rwx'
              'other::---'
              'default:user::rwx'
              "default:user:${runner_uid}:rwx"
              'default:group::---'
              'default:mask::rwx'
              'default:other::---'
            )
            declare -A seen=()
            mapfile -t acl_lines < <(printf '%s\n' "$acl_text")
            (( ${#acl_lines[@]} == ${#expected_lines[@]} )) || return 1
            for line in "${acl_lines[@]}"; do
              [[ "$line" =~ ^(default:)?(user|group|mask|other):[^[:space:]]+$ ]] || return 1
              [[ -z "${seen[$line]+present}" ]] || return 1
              seen["$line"]=1
            done
            for expected in "${expected_lines[@]}"; do
              [[ -n "${seen[$expected]+present}" ]] || return 1
            done
          }

          lstat_state() {
            /usr/bin/python3 - "$1" <<'PY'
          import os
          import sys

          try:
              os.lstat(sys.argv[1])
          except FileNotFoundError:
              print("ENOENT")
              raise SystemExit(0)
          except OSError:
              print("LSTAT_ERROR")
              raise SystemExit(2)
          else:
              print("EXISTING_OBJECT")
              raise SystemExit(1)
          PY
          }

          require_enoent_only() {
            local state
            if state="$(lstat_state "$1")"; then
              [[ "$state" == ENOENT ]]
            else
              return 1
            fi
          }

          verify_mountinfo() {
            local byte_count
            [[ -r /proc/self/mountinfo ]] || return 1
            byte_count="$(/usr/bin/wc -c < /proc/self/mountinfo)" || return 1
            [[ "$byte_count" =~ ^[1-9][0-9]*$ ]]
          }

          raw_mount_target_filter() {
            local resolved="$1"
            local output_file="$2"
            /usr/bin/awk -v p="$resolved" \
              'BEGIN { found = 0 } $0 == p || index($0, p "/") == 1 { found = 1 } END { exit found ? 1 : 0 }' \
              "$output_file"
          }

          mount_target_admission() {
            local resolved="$1"
            local output_file="$2"
            /usr/bin/python3 - "$output_file" "$resolved" <<'PY'
          from pathlib import Path
          import posixpath
          import sys


          class Reject(Exception):
              pass


          def reject(reason):
              print(f"MOUNT_TARGET_REJECT={reason}", file=sys.stderr)
              raise Reject(reason)


          def decode_record(raw_record):
              decoded = bytearray()
              index = 0
              while index < len(raw_record):
                  value = raw_record[index]
                  if value == 0:
                      reject("NUL")
                  if value == 92:
                      if index + 1 >= len(raw_record):
                          reject("TRAILING_ESCAPE")
                      escaped = raw_record[index + 1]
                      if escaped == 92:
                          decoded.append(92)
                          index += 2
                          continue
                      if escaped < 48 or escaped > 55 or index + 3 >= len(raw_record):
                          reject("MALFORMED_ESCAPE")
                      digits = raw_record[index + 1:index + 4]
                      if any(digit < 48 or digit > 55 for digit in digits):
                          reject("MALFORMED_ESCAPE")
                      decoded.append(int(digits.decode("ascii"), 8))
                      index += 4
                      continue
                  if value in (9, 13, 32):
                      reject("UNESCAPED_WHITESPACE")
                  decoded.append(value)
                  index += 1
              try:
                  value = decoded.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  reject("INVALID_UTF8")
              if not value.startswith("/"):
                  reject("NON_ABSOLUTE")
              if value != "/" and (
                  value.endswith("/")
                  or "//" in value
                  or "/./" in value
                  or value.endswith("/.")
                  or "/../" in value
                  or value.endswith("/..")
                  or posixpath.normpath(value) != value
              ):
                  reject("AMBIGUOUS_PATH")
              return value


          try:
              raw = Path(sys.argv[1]).read_bytes()
              target = sys.argv[2]
              if not raw or b"\x00" in raw or not raw.endswith(b"\n"):
                  reject("MALFORMED_OUTPUT")
              records = raw[:-1].split(b"\n")
              if not records or any(record == b"" for record in records):
                  reject("MALFORMED_RECORD")
              decoded_targets = []
              for record in records:
                  decoded_targets.append(decode_record(record))
              if "/" not in decoded_targets:
                  reject("ROOT_MOUNT_TARGET_MISSING")
              if target in decoded_targets or any(item.startswith(target + "/") for item in decoded_targets):
                  reject("EXACT_OR_DESCENDANT_MOUNT_PRESENT")
              print("MOUNT_TABLE_ADMISSION=NO_EXACT_OR_DESCENDANT_MOUNT")
          except (OSError, Reject):
              raise SystemExit(1)
          PY
          }

          mount_table_output_file=""
          mount_table_error_file=""

          read_mount_table() {
            local output_file error_file status
            output_file="$(/usr/bin/mktemp)" || return 1
            error_file="$(/usr/bin/mktemp)" || {
              /usr/bin/rm -f -- "$output_file"
              return 1
            }
            set +e
            /usr/bin/findmnt -k -r -n -o TARGET >"$output_file" 2>"$error_file"
            status=$?
            set -e
            if (( status != 0 )); then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_COMMAND_STATUS=%s\n' "$status" >&2
              /usr/bin/rm -f -- "$output_file" "$error_file"
              return 1
            fi
            if [[ ! -s "$output_file" ]]; then
              printf 'MOUNT_TABLE_ADMISSION=MOUNT_TABLE_READ_FAILED\nMOUNT_TABLE_LIVE_READER_DIAGNOSTIC_CLASS=EMPTY_TARGET_SET\n' >&2
              /usr/bin/rm -f -- "$output_file" "$error_file"
              return 1
            fi
            mount_table_output_file="$output_file"
            mount_table_error_file="$error_file"
            return 0
          }

          mount_table_admission() {
            local resolved="$1"
            local result=0
            verify_mountinfo || result=1
            if (( result == 0 )); then
              read_mount_table || result=1
            fi
            if (( result == 0 )); then
              raw_mount_target_filter "$resolved" "$mount_table_output_file" || result=1
            fi
            if (( result == 0 )); then
              mount_target_admission "$resolved" "$mount_table_output_file" || result=1
            fi
            if [[ -n "$mount_table_output_file" || -n "$mount_table_error_file" ]]; then
              /usr/bin/rm -f -- "$mount_table_output_file" "$mount_table_error_file"
              mount_table_output_file=""
              mount_table_error_file=""
            fi
            return "$result"
          }

