          tracked_pid_is_registered() {
            local wanted="$1"
            local pid
            [[ "$wanted" =~ ^[1-9][0-9]*$ ]] || return 1
            for pid in "${tracked_children[@]}"; do
              [[ "$pid" == "$wanted" ]] && return 0
            done
            return 1
          }

          remove_tracked_pid_exact() {
            local wanted="$1"
            local pid removed=0
            local -a remaining=()
            tracked_pid_is_registered "$wanted" || return 1
            for pid in "${tracked_children[@]}"; do
              if (( removed == 0 )) && [[ "$pid" == "$wanted" ]]; then
                removed=1
              else
                remaining+=("$pid")
              fi
            done
            (( removed == 1 )) || return 1
            tracked_children=("${remaining[@]}")
            if (( ${#tracked_children[@]} == 0 )); then
              all_launched_children_reaped=1
            else
              all_launched_children_reaped=0
            fi
          }

          wait_for_tracked_pid() {
            local pid="$1"
            local status_name="$2"
            local -n out_status="$status_name"
            local wait_witness wait_status interruption_count=0
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] || { out_status=127; return 1; }
            tracked_pid_is_registered "$pid" || { out_status=127; return 1; }
            while :; do
              unset -v wait_witness
              if wait -p wait_witness "$pid"; then
                wait_status=0
              else
                wait_status=$?
              fi
              out_status="$wait_status"
              if [[ ${wait_witness+x} == x && "$wait_witness" == "$pid" ]]; then
                return 0
              fi
              case "$wait_status" in
                129|130|143)
                  interruption_count=$((interruption_count + 1))
                  (( interruption_count <= 32 )) || return 1
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
          }

          run_tracked_command() {
