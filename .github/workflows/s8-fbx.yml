              checkpoint: str | None = None,
          ) -> dict[str, object]:
              if context not in {"fixture", "production"}:
                  prove_seed_candidate_defect("SEED_ACL_CONTEXT_INVALID", "EVIDENCE")
              if phase not in {"initial", "configured", "pre_admission", "post_admission", "post_probe", "pre_consumer"}:
                  prove_seed_candidate_defect("SEED_ACL_PHASE_INVALID", "EVIDENCE")
              if object_name not in {"work", "input.json", "expected.json", "unlisted.json"}:
                  prove_seed_candidate_defect("SEED_ACL_OBJECT_INVALID", "EVIDENCE")
              path = pathlib.Path(path)
              if not path.is_absolute():
                  prove_seed_candidate_defect("SEED_ACL_PATH_NOT_ABSOLUTE", "EVIDENCE")
              try:
                  observed = os.lstat(path)
              except OSError:
                  prove_seed_candidate_defect("SEED_ACL_LSTAT_FAILED", "EVIDENCE")
              if stat.S_ISLNK(observed.st_mode):
                  prove_seed_candidate_defect("SEED_ACL_OBJECT_IS_SYMLINK", "EVIDENCE")
              is_directory = stat.S_ISDIR(observed.st_mode)
              is_regular = stat.S_ISREG(observed.st_mode)
              if object_name == "work" and not is_directory:
                  prove_seed_candidate_defect("SEED_WORK_NOT_REAL_DIRECTORY", "EVIDENCE")
              if object_name != "work" and not is_regular:
                  prove_seed_candidate_defect("SEED_FILE_NOT_REGULAR", "EVIDENCE")
              if observed.st_mode & 0o7000:
                  prove_seed_candidate_defect("SEED_ACL_SPECIAL_MODE_BITS_PRESENT", "EVIDENCE")
              mode = f"{stat.S_IMODE(observed.st_mode):04o}"
              if expected_uid is not None and observed.st_uid != expected_uid:
                  prove_seed_candidate_defect("SEED_ACL_OWNER_UID_MISMATCH", "EVIDENCE")
              if expected_gid is not None and observed.st_gid != expected_gid:
                  prove_seed_candidate_defect("SEED_ACL_OWNER_GID_MISMATCH", "EVIDENCE")
              if expected_mode is not None and mode != expected_mode:
                  prove_seed_candidate_defect("SEED_ACL_MODE_MISMATCH", "EVIDENCE")
              digest_before = None
              if is_regular:
                  def digest_regular_file() -> str:
                      descriptor = -1
                      try:
                          descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
                          opened = os.fstat(descriptor)
                          if (opened.st_dev, opened.st_ino) != (observed.st_dev, observed.st_ino):
                              prove_seed_candidate_defect("SEED_ACL_CONTENT_IDENTITY_MISMATCH", "EVIDENCE")
                          hasher = hashlib.sha256()
                          while True:
                              chunk = os.read(descriptor, 65536)
                              if not chunk:
                                  break
                              hasher.update(chunk)
                          return hasher.hexdigest()
                      except OSError:
                          prove_seed_candidate_defect("SEED_ACL_CONTENT_READ_FAILED", "EVIDENCE")
                      finally:
                          if descriptor >= 0:
                              os.close(descriptor)
                  digest_before = digest_regular_file()
              metadata = {
                  "uid": observed.st_uid,
                  "gid": observed.st_gid,
                  "mode": mode,
                  "device": observed.st_dev,
                  "inode": observed.st_ino,
                  "digest": digest_before,
              }
              scopes = ["access"] + (["default"] if include_default else [])
              parsed: dict[str, dict[str, dict[str, str | None]]] = {}
              for scope in scopes:
                  command = [
                      "/usr/bin/getfacl",
                      "--numeric",
                      "--absolute-names",
                      "--all-effective",
                      "--access" if scope == "access" else "--default",
                      "--",
                      str(path),
                  ]
                  status = 0
                  timed_out = False
                  stdout_bytes = b""
                  stderr_bytes = b""
                  try:
                      result = subprocess.run(
                          command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          timeout=30,
                          check=False,
                      )
                      status = int(result.returncode)
                      stdout_bytes = result.stdout
                      stderr_bytes = result.stderr
                  except subprocess.TimeoutExpired as error:
                      status = 124
                      timed_out = True
                      stdout_bytes = error.stdout or b""
                      stderr_bytes = error.stderr or b""
                  except OSError as error:
                      status = 127
                      stderr_bytes = str(error).encode("utf-8", "replace")
                  stdout_text = stdout_bytes[:8192].decode("ascii", "replace")
                  stderr_text = stderr_bytes[:8192].decode("ascii", "replace")
                  fields = (
                      f"context={context} phase={phase} object={object_name} "
                      f"uid={metadata['uid']} gid={metadata['gid']} mode={metadata['mode']} "
                      f"device={metadata['device']} inode={metadata['inode']} "
                      f"getfacl_status={status} acl_scope={scope} "
                      f"checkpoint={checkpoint or '-'} subject={subject or '-'} path={path}"
                  )
                  print(f"ACL_SNAPSHOT {fields} timeout={'yes' if timed_out else 'no'}")
                  print(f"GETFACL_STDOUT_BEGIN acl_scope={scope}")
                  if stdout_text:
                      print(stdout_text, end="" if stdout_text.endswith("\n") else "\n")
                  print(f"GETFACL_STDOUT_END acl_scope={scope}")
                  print(f"GETFACL_STDERR_BEGIN acl_scope={scope}")
                  if stderr_text:
                      print(stderr_text, end="" if stderr_text.endswith("\n") else "\n")
                  print(f"GETFACL_STDERR_END acl_scope={scope}")
                  if len(stdout_bytes) > 8192 or len(stderr_bytes) > 8192:
                      prove_seed_candidate_defect("SEED_ACL_EVIDENCE_OUTPUT_OVERSIZED", "EVIDENCE")
                  if timed_out or status == 127 or status != 0:
                      fail("SEED_ACL_GETFACL_UNAVAILABLE", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
                  try:
                      decoded = stdout_bytes.decode("ascii", "strict")
                      parsed_scope = parse_numeric_acl_evidence(decoded, path, observed, scope)
                  except (UnicodeDecodeError, ValueError):
                      prove_seed_candidate_defect("SEED_ACL_EVIDENCE_PARSE_INVALID", "EVIDENCE")
                  expected = expected_access if scope == "access" else expected_default
                  if expected is not None:
                      actual_raw = {key: value["raw"] for key, value in parsed_scope.items()}
                      if actual_raw != expected:
                          prove_seed_candidate_defect("SEED_ACL_EVIDENCE_ENTRIES_MISMATCH", "EVIDENCE")
                  if scope == "default" and expected_default is None:
                      prove_seed_candidate_defect("SEED_DEFAULT_ACL_EXPECTATION_MISSING", "EVIDENCE")
                  parsed[scope] = parsed_scope
              if not include_default:
                  parsed["default"] = {}
              try:
                  after = os.lstat(path)
              except OSError:
                  prove_seed_candidate_defect("SEED_ACL_POST_LSTAT_FAILED", "EVIDENCE")
              digest_after = None
              if is_regular:
                  digest_after = digest_regular_file()
              if (
                  after.st_dev != observed.st_dev
                  or after.st_ino != observed.st_ino
                  or after.st_uid != observed.st_uid
                  or after.st_gid != observed.st_gid
                  or stat.S_IMODE(after.st_mode) != stat.S_IMODE(observed.st_mode)
                  or digest_after != digest_before
              ):
                  prove_seed_candidate_defect("SEED_ACL_SNAPSHOT_IDENTITY_CHANGED", "EVIDENCE")
              metadata["digest"] = digest_after
              return {
                  "context": context,
                  "phase": phase,
                  "object": object_name,
                  "path": str(path),
                  "uid": metadata["uid"],
                  "gid": metadata["gid"],
                  "mode": metadata["mode"],
                  "device": metadata["device"],
                  "inode": metadata["inode"],
                  "digest": metadata["digest"],
                  "access": parsed["access"],
                  "default": parsed["default"],
              }


          def assert_runner_acl_semantics(
              snapshot: dict[str, object],
              runner_uid: int,
              category: str = "FIXTURE",
          ) -> None:
              runner_entry = snapshot["access"].get(f"user:{runner_uid}")
              if runner_entry is None or runner_entry["raw"] != "rwx" or runner_entry["effective"] != "rw-":
                  prove_seed_candidate_defect("SEED_RUNNER_RAW_EFFECTIVE_ACL_MISMATCH", category)


          def assert_seed_admission_delta(
              before: dict[str, object],
              after: dict[str, object],
              label: str,
              category: str = "EVIDENCE",
          ) -> None:
              before_entries = before["access"]
              after_entries = after["access"]
              if set(after_entries) - set(before_entries) != {"user:0"} or set(before_entries) - set(after_entries):
                  prove_seed_candidate_defect(f"{label}_UID0_ADMISSION_DELTA_INVALID", category)
              if "user:0" in before_entries:
                  prove_seed_candidate_defect(f"{label}_UID0_PREEXISTED", category)
              if after_entries["user:0"]["raw"] != "r--" or after_entries["user:0"]["effective"] != "r--":
                  prove_seed_candidate_defect(f"{label}_UID0_PERMISSION_INVALID", category)
              for key, before_entry in before_entries.items():
                  after_entry = after_entries.get(key)
                  if after_entry is None or after_entry["raw"] != before_entry["raw"] or after_entry["effective"] != before_entry["effective"]:
                      prove_seed_candidate_defect(f"{label}_EXISTING_ACL_ENTRY_CHANGED", category)
              if before["default"] != after["default"]:
                  prove_seed_candidate_defect(f"{label}_DEFAULT_ACL_CHANGED", category)
              for field in ("uid", "gid", "mode", "device", "inode", "digest"):
                  if before[field] != after[field]:
                      prove_seed_candidate_defect(f"{label}_SEED_METADATA_CHANGED", category)


          def validate_seed_acl(
              work: pathlib.Path,
              seed: pathlib.Path,
              expected_name: str,
              require_uid_zero: bool,
              expected_identity: tuple[int, int] | None = None,
          ) -> tuple[int, int]:
              if expected_name not in {"input.json", "expected.json"}:
                  fail("SEED_EXPECTED_NAME_INVALID")
              if work.name != "work" or work.is_symlink() or not work.is_dir():
                  fail("SEED_PARENT_INVALID")
              expected_path = work / expected_name
              if seed != expected_path or seed.parent != work:
                  fail("SEED_PATH_INVALID")
              if seed.is_symlink():
                  fail("SEED_SYMLINK_REJECTED")
              try:
                  seed_stat = seed.lstat()
              except OSError:
                  fail("SEED_STAT_FAILED")
              if not stat.S_ISREG(seed_stat.st_mode):
                  fail("SEED_NOT_REGULAR")
              if seed_stat.st_uid != os.getuid():
                  fail("SEED_OWNER_INVALID")
              identity = (seed_stat.st_dev, seed_stat.st_ino)
              if expected_identity is not None and identity != expected_identity:
                  fail("SEED_IDENTITY_CHANGED")
              acl_entries = read_numeric_acl(seed)
              def entry_parts(line: str) -> tuple[str, str | None]:
                  raw_part, has_comment, comment_part = line.partition("#")
                  raw_entry = raw_part.strip()
                  effective = None
                  if has_comment:
                      annotation = re.fullmatch(r"effective:\s*([r-][w-][x-])", comment_part.strip())
                      if annotation is None:
                          fail("SEED_ACL_FORMAT_INVALID", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
                      effective = annotation.group(1)
                  return raw_entry, effective

              group_entries = [entry_parts(entry) for entry in acl_entries if entry_parts(entry)[0].startswith("group::")]
              other_entries = [entry_parts(entry) for entry in acl_entries if entry_parts(entry)[0].startswith("other::")]
              if len(group_entries) != 1 or group_entries[0][0] != "group::---":
                  fail("SEED_GROUP_ACCESS_INVALID")
              if len(other_entries) != 1 or other_entries[0][0] != "other::---":
                  fail("SEED_OTHER_ACCESS_INVALID")
              if require_uid_zero:
                  uid_zero_entries = [entry_parts(entry) for entry in acl_entries if entry_parts(entry)[0].startswith("user:0:")]
                  if len(uid_zero_entries) != 1:
                      fail("SEED_UID0_READ_ACL_MISSING")
                  raw_parts = uid_zero_entries[0][0].split(":")
                  raw_permission = raw_parts[-1] if len(raw_parts) == 3 else ""
                  effective_perm = uid_zero_entries[0][1] or raw_permission
                  if len(raw_parts) != 3 or raw_parts[:2] != ["user", "0"] or raw_permission != "r--":
                      fail("SEED_UID0_RAW_ACL_INVALID")
                  if effective_perm != "r--" or "w" in effective_perm or "x" in effective_perm:
                      fail("SEED_UID0_EFFECTIVE_ACL_INVALID")
              return identity


          def admit_seed(work: pathlib.Path, seed: pathlib.Path, expected_name: str) -> tuple[int, int]:
              identity = validate_seed_acl(work, seed, expected_name, require_uid_zero=False)
              try:
                  result = subprocess.run(
                      ["/usr/bin/setfacl", "--no-mask", "-m", "u:0:r--", "--", str(seed)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=30,
                      check=False,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail("SEED_ACL_MUTATION_FAILED", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
              if result.returncode != 0:
                  fail("SEED_ACL_MUTATION_FAILED", "HOSTED_SANDBOX_ENVIRONMENT_HOLD")
              return validate_seed_acl(work, seed, expected_name, require_uid_zero=True, expected_identity=identity)


          def seed_admission_call(label: str, operation):
              captured = io.StringIO()
              try:
                  with contextlib.redirect_stderr(captured):
                      return operation()
              except SystemExit:
                  diagnostic = captured.getvalue()
                  sys.stderr.write(diagnostic)
                  if "FAILURE_CLASS=HOSTED_SANDBOX_ENVIRONMENT_HOLD" in diagnostic:
                      raise
                  prove_seed_candidate_defect(f"{label}_SEED_ADMISSION_CALL_FAILED", "EVIDENCE")
              except Exception:
                  prove_seed_candidate_defect(f"{label}_SEED_ADMISSION_CALL_EXCEPTION", "EVIDENCE")


          def run_mapped_seed_probe(
              sandbox: pathlib.Path,
              runner: pathlib.Path,
              work: pathlib.Path,
              runtime_root: pathlib.Path,
              writer_root: pathlib.Path,
              expected_snapshots: dict[str, dict[str, object]],
          ) -> dict[str, dict[str, object]]:
              carrier_root = work.parent
              runtime_mount = carrier_mount(runtime_root, carrier_root, "RUNTIME")
              writer_mount = carrier_mount(writer_root, carrier_root, "WRITER")
              runner_mount = carrier_mount(runner, carrier_root, "RUNNER")
              work_mount = carrier_mount(work, carrier_root, "WORK")
              child_program = r"""import errno
          import hashlib
          import json
          import os
          import pathlib
          import stat

          status = {}
          for line in pathlib.Path("/proc/self/status").read_text(encoding="ascii").splitlines():
              key, separator, value = line.partition(":")
              if separator:
                  status[key] = value.strip()
          def canonical_map(path):
              return [" ".join(line.split()) for line in pathlib.Path(path).read_text(encoding="ascii").splitlines() if line.strip()]
          def digest_file(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  observed = os.fstat(descriptor)
                  hasher = hashlib.sha256()
                  while True:
                      chunk = os.read(descriptor, 65536)
                      if not chunk:
                          break
                      hasher.update(chunk)
                  return observed, hasher.hexdigest()
              finally:
                  os.close(descriptor)
          uid_map = canonical_map("/proc/self/uid_map")
          gid_map = canonical_map("/proc/self/gid_map")
          capability_names = ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb")
          capabilities = {name: status.get(name, "") for name in capability_names}
          for name in ("input.json", "expected.json"):
              path = pathlib.Path("/work") / name
              before_stat = None
              before_digest = None
              read_error = None
              try:
                  before_stat, before_digest = digest_file(path)
                  read_success = stat.S_ISREG(before_stat.st_mode)
              except OSError as error:
                  read_success = False
                  read_error = errno.errorcode.get(error.errno, f"ERRNO_{error.errno}")
              write_open_errno = "OPEN_SUCCEEDED"
              try:
                  write_fd = os.open(path, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              except OSError as error:
                  write_open_errno = errno.errorcode.get(error.errno, f"ERRNO_{error.errno}")
              else:
                  os.close(write_fd)
              after_stat = None
              after_digest = None
              after_error = None
              try:
                  after_stat, after_digest = digest_file(path)
              except OSError as error:
                  after_error = errno.errorcode.get(error.errno, f"ERRNO_{error.errno}")
              unchanged = (
                  before_stat is not None
                  and after_stat is not None
                  and before_digest == after_digest
                  and (before_stat.st_dev, before_stat.st_ino) == (after_stat.st_dev, after_stat.st_ino)
              )
              result = {
                  "schemaVersion": "s8-mapped-seed-acl-probe-v1",
                  "seed": name,
                  "uid": os.getuid(),
                  "euid": os.geteuid(),
                  "gid": os.getgid(),
                  "egid": os.getegid(),
                  "uidMap": uid_map,
                  "gidMap": gid_map,
                  "capabilities": capabilities,
                  "noNewPrivs": int(status.get("NoNewPrivs", "-1")),
                  "readSuccess": bool(read_success),
                  "readError": read_error,
                  "digest": before_digest,
                  "device": before_stat.st_dev if before_stat is not None else None,
                  "inode": before_stat.st_ino if before_stat is not None else None,
                  "writeOpenErrno": write_open_errno,
                  "afterReadError": after_error,
                  "unchanged": bool(unchanged),
              }
              print("S8_SEED_MAPPED_PROBE:" + json.dumps(result, sort_keys=True, separators=(",", ":")), flush=True)
          """
              command = [
                  str(sandbox),
                  "--unshare-user", "--unshare-net", "--die-with-parent", "--new-session",
                  "--ro-bind", runtime_mount, "/runtime/blender-root",
                  "--ro-bind", writer_mount, "/runtime/writer",
                  "--ro-bind", runner_mount, "/runtime/process-runner",
                  "--bind", work_mount, "/work", "--chdir", "/work",
                  "--proc", "/proc", "--dev", "/dev", "--tmpfs", "/tmp",
                  "--", "/runtime/process-runner",
                  "--address-space-bytes", str(4 * 1024 * 1024 * 1024),
                  "--file-bytes", str(128 * 1024 * 1024),
                  "--timeout-ms", str(RUNNER_TIMEOUT_MS),
                  "--stdout-bytes", str(RUNNER_STDOUT_BYTES),
                  "--stderr-bytes", str(RUNNER_STDERR_BYTES),
                  "--max-children", "0", "--", "/usr/bin/python3", "-c", child_program,
              ]
              def print_transport_evidence(status: int, timed_out: bool, stdout: bytes, stderr: bytes) -> None:
                  print(
                      f"MAPPED_PROBE_SUBPROCESS_STATUS={status} timeout={'yes' if timed_out else 'no'} "
                      f"stdout_bytes={len(stdout)} stderr_bytes={len(stderr)}"
                  )
                  print("MAPPED_PROBE_STDOUT_BEGIN")
                  stdout_text = stdout[:8192].decode("utf-8", "replace")
                  if stdout_text:
                      print(stdout_text, end="" if stdout_text.endswith("\n") else "\n")
                  print("MAPPED_PROBE_STDOUT_END")
                  print("MAPPED_PROBE_STDERR_BEGIN")
                  stderr_text = stderr[:8192].decode("utf-8", "replace")
                  if stderr_text:
                      print(stderr_text, end="" if stderr_text.endswith("\n") else "\n")
                  print("MAPPED_PROBE_STDERR_END")

              try:
                  result = subprocess.run(
                      command,
                      cwd=work,
                      env={"PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8"},
                      stdout=subprocess.PIPE,
