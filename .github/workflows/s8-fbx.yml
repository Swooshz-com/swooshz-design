                  ("REQUIRED_FIELD_CONTINUATION_VERSION", _required_continuation("Version"), "REQUIRED_FIELD_CONTINUATION"),
                  ("REQUIRED_FIELD_CONTINUATION_ARCHITECTURE", _required_continuation("Architecture"), "REQUIRED_FIELD_CONTINUATION"),
                  ("REQUIRED_FIELD_CONTINUATION_FILENAME", _required_continuation("Filename"), "REQUIRED_FIELD_CONTINUATION"),
                  ("REQUIRED_FIELD_CONTINUATION_SIZE", _required_continuation("Size"), "REQUIRED_FIELD_CONTINUATION"),
                  ("REQUIRED_FIELD_CONTINUATION_SHA256", _required_continuation("SHA256"), "REQUIRED_FIELD_CONTINUATION"),
                  ("ORPHAN_CONTINUATION", b" continuation text\n" + exact, "ORPHAN_CONTINUATION"),
                  ("MALFORMED_FIELD_LINE", b"Package bubblewrap\n" + exact, "MALFORMED_FIELD_LINE"),
                  ("VALID_MULTILINE_UNRELATED_FIELD", _exact(extra_fields=(("Description", "first line"), ("Details", "one\n two"))), None),
                  ("EOF_WITHOUT_FINAL_NEWLINE", _exact(final_lf=False), None),
