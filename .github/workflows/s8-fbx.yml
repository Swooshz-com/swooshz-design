              "PLAIN_WAIT":source.replace('wait -p wait_witness "$pid"','wait "$pid"',1),
              "WITNESS_NOT_RESET":source.replace('unset -v wait_witness','wait_witness=stale',1),
              "MISMATCHED_WITNESS":source.replace('"$wait_witness" == "$pid"','"$wait_witness" != "$pid"',1),
              "STATUS_OVERWRITTEN":re.sub(r'else\n(\s*)wait_status=\$\?',r'else\n\1:\n\1wait_status=$?',source,count=1),
              "BANG_WAIT":source.replace('if wait -p wait_witness "$pid"; then','if ! wait -p wait_witness "$pid"; then',1),
              "RAW_WAIT":re.sub(r'if wait -p wait_witness "\$pid"; then\s+wait_status=0;\s+else\s+wait_status=\$\?;\s+fi;', 'wait -p wait_witness "$pid"; wait_status=$?;', source, count=1),
              "EXIT127_UNKNOWN":source.replace('out_status="$wait_status";','out_status="$wait_status"; [[ "$wait_status" == 127 ]] && return 1;',1),
              "EXIT143_INTERRUPTED":source.replace('out_status="$wait_status";','out_status="$wait_status"; [[ "$wait_status" == 143 ]] && continue;',1),
              "BLANKET_CLEAR":source.replace('if (( ${#tracked_children[@]} == 0 && unresolved == 0 )); then','tracked_children=(); if (( ${#tracked_children[@]} == 0 && unresolved == 0 )); then',1),
          }
          for label,mutated in variants.items():
              if mutated==source: raise SystemExit("mutation did not apply:"+label)
              if valid(mutated): raise SystemExit("defective variant accepted:"+label)
              print("WAIT_POSITIVE_CONTROL_"+label+"=PASS")
          print("REGISTRATION_CRITICAL_SECTION=PASS")
          print("WAIT_REAP_POSITIVE_CONTROLS=PASS")
          PY
            status=$?
            /usr/bin/rm -rf -- "$regression_root"
            [[ "$status" == 0 ]]
          }

          wait_reap_regression || fail_amendment "WAIT_REAP_REGRESSION_FAILED"
          wait_reap_positive_controls || fail_amendment "WAIT_REAP_POSITIVE_CONTROLS_FAILED"

          delete_carrier_exact() {
