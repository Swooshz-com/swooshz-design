              stdout_lines = result.stdout.split(b"\n")
              if not stdout_lines or stdout_lines[-1] != b"":
                  prove_seed_candidate_defect("MAPPED_SEED_PROBE_OUTPUT_INVALID", "MAPPED")
              stdout_lines = stdout_lines[:-1]
              receipt_line_indexes = [
                  index for index, line in enumerate(stdout_lines)
                  if line.startswith(receipt_prefix)
              ]
              if result.stdout.count(receipt_prefix) != 1 or len(receipt_line_indexes) != 1:
                  prove_seed_candidate_defect("MAPPED_SEED_RUNNER_RECEIPT_MISSING_OR_DUPLICATE", "MAPPED")
              receipt_line_index = receipt_line_indexes[0]
