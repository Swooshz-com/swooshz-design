              else
                DAEMON_RELOAD=FAIL
                mark_unqualified SYSTEMD_DAEMON_RELOAD_FAILED
              fi
              echo "DAEMON_RELOAD=$DAEMON_RELOAD"
            fi
          else
            mark_unqualified REAL_SYSTEMD_QUALIFICATION_PREREQUISITE_MISSING
          fi

          echo "DIAGNOSTIC_REQUEST_SEMANTICS=PING_OR_FIXED_HOLD_ONLY;NO_PRODUCT_AUTHORITY_OR_REPLAY"
          cleanup_objects
          trap - EXIT
          SYSTEMD_TARGET_QUALIFICATION=UNQUALIFIED
          if [[ $ALL_PROOFS == 1 && $CLEANUP_OK == 1 && $SOCKET_PROOF == YES && $CLIENT_PROOF == YES && $SERVICE_LIFECYCLE_PROOF == YES && $UID_MAP_KIND == IDENTITY && $GID_MAP_KIND == IDENTITY && $UID_CANDIDATE_MAP == IDENTITY && $GID_CANDIDATE_MAP == IDENTITY ]]; then
            SYSTEMD_TARGET_QUALIFICATION=QUALIFIED
          fi
          echo "SYSTEMD_TARGET_QUALIFICATION=$SYSTEMD_TARGET_QUALIFICATION"
          echo "INHERITED_NAMESPACE_DEFECT=OPEN_UNCHANGED"
          echo "PRODUCT_SEMANTICS_PROVEN_BAD=NO"
          echo "G3_ATTEMPT_IMPACT=NONE"
          echo "PRODUCT_MUTATION_PERFORMED=NO"
          echo "VALIDATION_MUTATION_PERFORMED=NO"
          echo "DIAGNOSTIC_ONLY_MUTATION=YES"
          echo "SUBAGENTS_USED=NO"
          echo "G2_RESUMED=NO"
          echo "G3_LAUNCHED=NO"
          echo "G4_LAUNCHED=NO"
          echo "READY_CHANGED=NO"
          echo "MERGE_PERFORMED=NO"
          if [[ $CLEANUP_OK == 1 ]]; then
            echo "RESULT=G0_EVIDENCE_COMPLETE"
          else
            echo "RESULT=G0_EVIDENCE_COMPLETE_WITH_CLEANUP_FAILURE"
            exit 1
          fi
