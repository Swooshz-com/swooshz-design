                  observed_signed + 1,
                  observed_signed + 1,
                  observed_signed + LOCAL_MAX_AGE,
              )
              print("UBUNTU_INRELEASE_FRESHNESS_REGRESSION=PASS")


          def emit_evidence(parsed, result, before, after):
              valid_until = parsed["valid_until"]
              print(f"UBUNTU_INRELEASE_DATE_COUNT={parsed['date_count']}")
              print(f"UBUNTU_INRELEASE_VALID_UNTIL_COUNT={parsed['valid_until_count']}")
              print(f"UBUNTU_INRELEASE_SIGNED_DATE_EPOCH={parsed['signed_date']}")
              print(f"UBUNTU_INRELEASE_VALID_UNTIL_PRESENT={'YES' if valid_until is not None else 'NO'}")
              print(f"UBUNTU_INRELEASE_VALID_UNTIL_EPOCH={valid_until if valid_until is not None else 'ABSENT'}")
              print(f"UBUNTU_INRELEASE_NOW_BEFORE_EPOCH={before}")
              print(f"UBUNTU_INRELEASE_NOW_AFTER_EPOCH={after}")
              print(f"UBUNTU_INRELEASE_MAX_FUTURE_SKEW_SECONDS={MAX_FUTURE_SKEW}")
              print(f"UBUNTU_INRELEASE_MAX_AGE_SECONDS={LOCAL_MAX_AGE}")
              print(f"UBUNTU_INRELEASE_EFFECTIVE_EXPIRY_EPOCH={result['effective_expiry']}")
              print("UBUNTU_INRELEASE_FRESHNESS=PASS")


          def main(arguments):
              if not arguments:
                  reject("MODE_MISSING")
              if arguments[0] == "--regression":
                  run_regressions()
                  return 0
              if arguments[0] == "--validate" and len(arguments) == 2:
                  parse_payload(arguments[1])
                  return 0
              if arguments[0] == "--evaluate" and len(arguments) == 4:
                  parsed = parse_payload(arguments[1])
                  before = parse_epoch(arguments[2], "NOW_UTC_BEFORE")
                  after = parse_epoch(arguments[3], "NOW_UTC_AFTER")
                  result = evaluate(parsed, before, after)
                  emit_evidence(parsed, result, before, after)
                  return 0
              reject("ARGUMENTS_INVALID")


