              for (index = 1; index <= NF; index += 1) {
                if ($index == "Package: bubblewrap") package = "bubblewrap"
                else if ($index == "Version: " expected_version) version = expected_version
                else if ($index == "Architecture: amd64") architecture = "amd64"
              }
              if (package == "bubblewrap" && version == expected_version && architecture == "amd64") count += 1
