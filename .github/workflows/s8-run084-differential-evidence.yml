name: S8 Run-084 corrected differential evidence

on:
  pull_request:
    branches:
      - codex/s8-g3-native-process-boundary-hosted-carrier-001
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  run084-differential-evidence:
    name: Run-084 bounded S8 differential evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact carrier head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install JavaScript dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install bounded hosted evidence prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          root="/tmp/s8-run084-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root" && test ! -L "$root"
          /usr/bin/install -d -m 0700 -- "$root"
          /usr/bin/sudo -n /usr/bin/apt-get update
          /usr/bin/sudo -n /usr/bin/apt-get install --yes --no-install-recommends acl binutils
          test -x /usr/bin/getfacl
          test -x /usr/bin/setfacl
          test -x /usr/bin/readelf
          bwrap_deb="$root/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb"
          /usr/bin/curl --fail --location --retry 3 --output "$bwrap_deb" \
            https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          bwrap_root="$root/bubblewrap-extracted"
          /usr/bin/install -d -m 0700 -- "$bwrap_root"
          /usr/bin/dpkg-deb --extract "$bwrap_deb" "$bwrap_root"
          bwrap="$bwrap_root/usr/bin/bwrap"
          test -x "$bwrap"
          printf 'e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71  %s\n' "$bwrap" | /usr/bin/sha256sum --check --status
          printf 'S8_RUN084_BWRAP=%s\n' "$bwrap"

      - name: Build pinned runtime and native targets
        shell: bash
        run: |
          set -Eeuo pipefail
          root="/tmp/s8-run084-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          test -d "$root" && test ! -L "$root"
          archive="$root/blender-5.2.2-linux-x64.tar.xz"
          /usr/bin/curl --fail --location --retry 3 --output "$archive" \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          printf '84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  %s\n' "$archive" | /usr/bin/sha256sum --check --status
          /usr/bin/tar -tJf "$archive" | /usr/bin/awk '/^\/|(^|\/)\.\.(\/|$)/ { bad = 1 } END { exit bad }'
          /usr/bin/install -d -m 0700 -- "$root/extracted"
          /usr/bin/tar -xJf "$archive" --directory "$root/extracted" --no-same-owner --no-same-permissions
          blender_source="$root/extracted/blender-5.2.2-linux-x64"
          test -x "$blender_source/blender"

          /usr/local/bin/cmake -S native/s8-process-runner -B "$root/runner" -DCMAKE_BUILD_TYPE=Release
          /usr/local/bin/cmake --build "$root/runner" --config Release --parallel
          /usr/local/bin/cmake -S native/s8-fbx-validator -B "$root/validator" -DCMAKE_BUILD_TYPE=Release
          /usr/local/bin/cmake --build "$root/validator" --config Release --parallel
          test -x "$root/runner/s8-process-runner"
          test -x "$root/validator/s8-fbx-validator"

          /usr/bin/install -d -m 0700 -- "$root/layout/runtime" "$root/layout/native" "$root/layout/writer"
          /usr/bin/cp -a --no-dereference -- "$blender_source" "$root/layout/runtime/"
          /usr/bin/install -m 0755 -- "$root/runner/s8-process-runner" "$root/layout/native/s8-process-runner"
          /usr/bin/install -m 0755 -- "$root/validator/s8-fbx-validator" "$root/layout/native/s8-fbx-validator"
          /usr/bin/cp -a --no-dereference -- blender/s8-fbx-writer/. "$root/layout/writer/"
          /usr/bin/find -P "$root/layout/runtime" -type d -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$root/layout/runtime" -type f -perm /111 -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$root/layout/runtime" -type f ! -perm /111 -exec /usr/bin/chmod 0444 {} +
          /usr/bin/find -P "$root/layout/writer" -type d -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$root/layout/writer" -type f -perm /111 -exec /usr/bin/chmod 0555 {} +
          /usr/bin/find -P "$root/layout/writer" -type f ! -perm /111 -exec /usr/bin/chmod 0444 {} +
          /usr/bin/chmod 0555 "$root/layout/native/s8-process-runner" "$root/layout/native/s8-fbx-validator"
          /usr/bin/chmod 0755 "$root" "$root/layout"
          printf 'S8_RUN084_LAYOUT=%s\n' "$root/layout"

      - name: Execute Run-084 evidence acquisition
        shell: bash
        run: |
          set -Eeuo pipefail
          root="/tmp/s8-run084-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/evidence"
          node_dir="$(dirname "$(command -v node)")"
          pnpm_bin="$(command -v pnpm)"
          clean_path="$node_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          clean=(/usr/bin/env -i "PATH=$clean_path" HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "S8_RUN084_DOMAIN_A_EXPECTED_PATH=$clean_path" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT")
          set +e
          "${clean[@]}" "$pnpm_bin" exec tsx scripts/s8/run084_differential_evidence.ts \
            --blender-root "$root/layout/runtime/blender-5.2.2-linux-x64" \
            --blender "$root/layout/runtime/blender-5.2.2-linux-x64/blender" \
            --writer "$root/layout/writer/writer.py" \
            --runner "$root/layout/native/s8-process-runner" \
            --validator "$root/layout/native/s8-fbx-validator" \
            --bubblewrap "$root/bubblewrap-extracted/usr/bin/bwrap" \
            --evidence-dir "$root/evidence" | /usr/bin/env -i "PATH=$clean_path" HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/tee "$root/evidence/terminal-packet.txt"
          status=${PIPESTATUS[0]}
          set -e
          printf 'RUN084_SCRIPT_STATUS=%s\n' "$status"
          exit "$status"
