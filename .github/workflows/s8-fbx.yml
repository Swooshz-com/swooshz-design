            [[ -n "$work" && "$work" == "$immutable_work_path" ]] || return 1
            before="$(stable_identity "$work")" || return 1
            [[ -d "$work" && ! -L "$work" ]] || return 1
            resolved="$(/usr/bin/realpath -e -- "$work")" || return 1
