          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/runtime" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/native" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/writer" "$carrier/"
          /usr/bin/sudo -n /usr/bin/cp -a --no-dereference -- "$source_layout/support" "$carrier/"
          /usr/bin/sudo -n /usr/bin/chown -R --no-dereference root:root -- "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" || fail_hold "ROOT_STAGE_OWNERSHIP_FAILED"
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type d -exec /usr/bin/chmod 0555 {} +
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f -perm /111 -exec /usr/bin/chmod 0555 {} +
          /usr/bin/sudo -n /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f ! -perm /111 -exec /usr/bin/chmod 0444 {} +
          admit_root_and_carrier || fail_hold "AFTER_STAGING_IDENTITY_FAILED"
          mount_table_admission "$carrier" || fail_hold "MOUNT_ADMISSION_AFTER_STAGING_FAILED"
          admit_work_for_use || fail_hold "WORK_AFTER_STAGING_ADMISSION_FAILED"

          for direct_surface in native probe runtime support work writer; do
            [[ -e "$carrier/$direct_surface" && ! -L "$carrier/$direct_surface" ]] || fail_hold "STAGED_SURFACE_INVALID_$direct_surface"
          done
          actual_surfaces="$(/usr/bin/find -P "$carrier" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C /usr/bin/sort)"
          expected_surfaces=$'native\nprobe\nruntime\nsupport\nwork\nwriter'
          [[ "$actual_surfaces" == "$expected_surfaces" ]] || fail_hold "STAGED_SURFACE_SET_MISMATCH"
          printf 'DIRECT_SURFACE_SET=native,probe,runtime,support,work,writer\nRETAINED_PROBE=YES\nPROBE_BOUND_IN_INITIAL_ONLY=YES\n'
          admit_root_and_carrier || fail_hold "STAGED_CARRIER_OWNER_MODE_FAILED"
          if /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type d -perm /022 -print -quit | grep -q .; then
            fail_hold "RUNTIME_CODE_DIRECTORY_WRITABLE"
          fi
          if /usr/bin/find -P "$carrier/runtime" "$carrier/native" "$carrier/writer" "$carrier/support" -type f -perm /022 -print -quit | grep -q .; then
            fail_hold "RUNTIME_CODE_FILE_WRITABLE"
          fi

          manifest_surfaces "$carrier" runtime native writer support > "$staged_manifest" || fail_hold "STAGED_MANIFEST_FAILED"
          staged_manifest_sha="$(sha256sum -- "$staged_manifest" | awk '{print $1}')"
          cmp --silent "$source_manifest" "$staged_manifest" || fail_hold "SOURCE_STAGED_MANIFEST_MISMATCH"
          blender_staged_sha="$(sha256sum -- "$carrier/runtime/blender-5.2.2-linux-x64/blender" | awk '{print $1}')"
          runner_staged_sha="$(sha256sum -- "$carrier/native/s8-process-runner" | awk '{print $1}')"
          validator_staged_sha="$(sha256sum -- "$carrier/native/s8-fbx-validator" | awk '{print $1}')"
          [[ "$blender_pre_stage_sha" == "$blender_staged_sha" ]] || fail_hold "BLENDER_STAGE_HASH_MISMATCH"
          [[ "$runner_pre_stage_sha" == "$runner_staged_sha" ]] || fail_hold "RUNNER_STAGE_HASH_MISMATCH"
          [[ "$validator_pre_stage_sha" == "$validator_staged_sha" ]] || fail_hold "VALIDATOR_STAGE_HASH_MISMATCH"
          printf 'STAGED_MANIFEST_SHA=%s\nBLENDER_STAGED_SHA=%s\nRUNNER_STAGED_SHA=%s\nVALIDATOR_STAGED_SHA=%s\nMANIFEST_EQUALITY_RESULT=PASS\n' "$staged_manifest_sha" "$blender_staged_sha" "$runner_staged_sha" "$validator_staged_sha"

          build_common_bwrap_args
          if ! run_capability_probe staged; then
            fail_hold "ACTUAL_STAGED_PATH_ADMISSION_FAILED"
          fi
          printf 'ACTUAL_STAGED_PATH_ADMISSION=PASS\nSTAGED_CAPABILITY_PROBE=PASS\n'

          candidate_marker_file="$temp_root/candidate-started"
          launcher="$temp_root/s8-bwrap-launcher"
          {
            printf '%s\n' '#!/usr/bin/bash'
            printf '%s\n' 'set -Eeuo pipefail'
            printf 'carrier_root=%q\n' "$carrier"
            printf 'carrier=%q\n' "$carrier"
            printf 'root_baseline_identity=%q\n' "$root_baseline_identity"
            printf 'carrier_baseline_identity=%q\n' "$carrier_baseline_identity"
            printf 'work=%q\n' "$work"
            printf 'immutable_work_path=%q\n' "$immutable_work_path"
            printf 'work_device_inode=%q\n' "$work_device_inode"
            printf 'runner_uid=%q\n' "$runner_uid"
            printf '%s\n' 'mount_table_output_file=""' 'mount_table_error_file=""'
            printf 'tmpfs_bytes=%q\n' "$tmpfs_bytes"
            printf 'destination_validator=%q\n' "$destination_validator"
            declare -f stable_identity
            declare -f acl_perm_for_mode
            declare -f ordinary_acl_is_exact
            declare -f work_acl_is_exact
            declare -f verify_mountinfo
            declare -f raw_mount_target_filter
            declare -f mount_target_admission
            declare -f read_mount_table
            declare -f mount_table_admission
            declare -f admit_root_owned_directory
            declare -f work_identity_admission
            declare -f admit_embedded_carrier_state
            declare -f bwrap_validator_expect
            declare -f bwrap_mutate_pair
            declare -f bwrap_run_029_regression
            declare -f run_bwrap_argv_grammar_regression
            cat <<'SH'
          source "$destination_validator"
          args=("$@")
          admission_only=0
          if [[ "${args[0]:-}" == --s8-destination-admission-only ]]; then
            admission_only=1
            args=("${args[@]:1}")
          fi
          separator=-1
          for ((index = 0; index < ${#args[@]}; index++)); do
            if [[ "${args[$index]}" == "--" ]]; then
              separator=$index
              break
            fi
          done
          (( separator > 0 )) || { echo "sandbox command separator missing" >&2; exit 70; }

          final_args=(
            --unshare-user
            --unshare-net
            --unshare-pid
            --unshare-ipc
            --unshare-uts
            --disable-userns
            --assert-userns-disabled
            --uid 65534
            --gid 65534
            --cap-drop ALL
            --die-with-parent
            --new-session
            --clearenv
          )
          for system_path in /usr /lib /etc; do
            system_source="$(realpath -e -- "$system_path")"
            final_args+=(--ro-bind "$system_source" "$system_path")
          done
          if [[ -e /lib64 || -L /lib64 ]]; then
            final_args+=(--ro-bind "$(realpath -e -- /lib64)" /lib64)
          fi

          runtime_seen=0
          runner_seen=0
          validator_seen=0
          writer_seen=0
          support_seen=0
          work_seen=0
          input_tmpfs_count=0
          input_tmpfs_destination=""
          for ((index = 0; index < separator;)); do
            option="${args[$index]}"
            case "$option" in
              --ro-bind|--bind)
                kind="$option"
                source="${args[$((index + 1))]:-}"
                destination="${args[$((index + 2))]:-}"
                [[ -n "$source" && -n "$destination" ]] || { echo "incomplete bind" >&2; exit 71; }
                if [[ "$kind" == "--ro-bind" && "$source" == "/carrier/runtime/blender-5.2.2-linux-x64" && "$destination" == "/runtime/blender-root" ]]; then
                  final_args+=(--ro-bind "$carrier_root/runtime/blender-5.2.2-linux-x64" /runtime/blender-root)
                  runtime_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/native/s8-process-runner" && "$destination" == "/runtime/process-runner" ]]; then
                  final_args+=(--ro-bind "$carrier_root/native/s8-process-runner" /runtime/process-runner)
                  runner_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/native/s8-fbx-validator" && "$destination" == "/runtime/validator" ]]; then
                  final_args+=(--ro-bind "$carrier_root/native/s8-fbx-validator" /runtime/validator)
                  validator_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/writer" && "$destination" == "/runtime/writer" ]]; then
                  final_args+=(--ro-bind "$carrier_root/writer" /runtime/writer)
                  writer_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/support/blender_validate.py" && "$destination" == "/runtime/support/blender_validate.py" ]]; then
                  final_args+=(--ro-bind "$carrier_root/support/blender_validate.py" /runtime/support/blender_validate.py)
                  support_seen=1
                elif [[ "$kind" == "--ro-bind" && "$source" == "/carrier/support/blender_reopen_validate.py" && "$destination" == "/runtime/support/blender_reopen_validate.py" ]]; then
                  final_args+=(--ro-bind "$carrier_root/support/blender_reopen_validate.py" /runtime/support/blender_reopen_validate.py)
                  support_seen=1
                elif [[ "$kind" == "--bind" && "$source" == "/carrier/work" && "$destination" == "/work" ]]; then
                  final_args+=(--bind "$carrier_root/work" /work)
                  work_seen=1
                else
                  echo "unexpected bind" >&2
                  exit 72
                fi
                index=$((index + 3))
                ;;
              --proc|--dev|--chdir)
                expected="${args[$((index + 1))]:-}"
                case "$option:$expected" in
                  --proc:/proc|--dev:/dev|--chdir:/work) ;;
                  *) echo "unexpected sandbox mount option" >&2; exit 73 ;;
                esac
                index=$((index + 2))
                ;;
              --tmpfs)
                expected="${args[$((index + 1))]:-}"
                [[ "$expected" == /tmp && "$input_tmpfs_count" == 0 ]] || { echo "candidate tmpfs request invalid" >&2; exit 78; }
                input_tmpfs_count=1
                input_tmpfs_destination="$expected"
                index=$((index + 2))
                ;;
              --unshare-user|--unshare-net|--unshare-pid|--unshare-ipc|--unshare-uts|--die-with-parent|--new-session)
                index=$((index + 1))
                ;;
              *)
                echo "unsupported sandbox option" >&2
                exit 74
                ;;
            esac
          done

          [[ "$input_tmpfs_count" == 1 && "$input_tmpfs_destination" == /tmp ]] || { echo "candidate tmpfs request missing" >&2; exit 78; }
          printf 'INPUT_TMPFS_COUNT=%s\nINPUT_TMPFS_DESTINATION=%s\nCANDIDATE_INPUT_TMPFS_COUNT_CHECK=PASS\n' "$input_tmpfs_count" "$input_tmpfs_destination"
          (( runtime_seen == 1 && runner_seen == 1 && writer_seen == 1 && work_seen == 1 )) || { echo "required runtime bind missing" >&2; exit 75; }
          (( separator + 1 < ${#args[@]} )) || { echo "sandbox payload missing" >&2; exit 76; }
          [[ "${args[$((separator + 1))]}" == "/runtime/process-runner" ]] || { echo "native runner is not the first sandbox process" >&2; exit 77; }
          final_args+=(
            --size "$tmpfs_bytes"
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --chdir /work
            --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --setenv LANG C.UTF-8
            --setenv LC_ALL C.UTF-8
            --setenv HOME /tmp
            --
            "${args[@]:$((separator + 1))}"
          )
          run_bwrap_argv_grammar_regression candidate /runtime/process-runner "${final_args[@]}" || { echo "BWRAP_ARGV_GRAMMAR_REGRESSION_FAILED_CANDIDATE" >&2; exit 82; }
          validate_bwrap_destination_order candidate /runtime/process-runner "${final_args[@]}" || { echo "BWRAP_DESTINATION_ORDER_ADMISSION_FAILED" >&2; exit 78; }
          admit_embedded_carrier_state || { echo "BWRAP_CARRIER_ADMISSION_FAILED" >&2; exit 79; }
          if (( admission_only == 1 )); then
            exit 0
          fi
          admit_embedded_carrier_state || { echo "BWRAP_PRE_EXEC_ADMISSION_FAILED" >&2; exit 80; }
          exec /usr/bin/sudo -n /usr/bin/bwrap "${final_args[@]}"
          SH
          } > "$launcher"
          /usr/bin/chmod 0700 -- "$launcher"
          /usr/bin/bash -n "$launcher" || fail_amendment "SANDBOX_LAUNCHER_SYNTAX"

          run_candidate_input_case() {
            local label="$1"
            local expected="$2"
            shift 2
            local stdout_path="$temp_root/candidate-input-$label.stdout"
            local stderr_path="$temp_root/candidate-input-$label.stderr"
            local status=0
            set +e
            "$launcher" --s8-destination-admission-only "$@" >"$stdout_path" 2>"$stderr_path"
            status=$?
            set -e
            if [[ "$expected" == ACCEPT ]]; then
              [[ "$status" == 0 ]] || fail_amendment "CANDIDATE_INPUT_${label}_REJECTED"
            else
              [[ "$status" != 0 ]] || fail_amendment "CANDIDATE_INPUT_${label}_ACCEPTED"
            fi
            [[ ! -e "$candidate_marker_file" && ! -L "$candidate_marker_file" ]] || fail_amendment "CANDIDATE_MARKER_CREATED_DURING_INPUT_REGRESSION"
            printf 'CANDIDATE_INPUT_%s=PASS\n' "$label"
          }

          candidate_common_prefix=(
            --unshare-user
            --unshare-net
            --die-with-parent
            --new-session
            --ro-bind /carrier/runtime/blender-5.2.2-linux-x64 /runtime/blender-root
            --ro-bind /carrier/writer /runtime/writer
            --ro-bind /carrier/native/s8-process-runner /runtime/process-runner
            --bind /carrier/work /work
            --chdir /work
            --proc /proc
            --dev /dev
            --tmpfs /tmp
          )
          candidate_runner_prefix=(
            -- /runtime/process-runner
            --address-space-bytes 4294967296
            --file-bytes 134217728
            --timeout-ms 300000
            --stdout-bytes 1048576
            --stderr-bytes 1048576
            --max-children 0
            --
          )
          candidate_writer_payload=(
            "${candidate_runner_prefix[@]}"
            /runtime/blender-root/blender
            --background
            --factory-startup
            --disable-autoexec
            --offline-mode
            --python-exit-code 50
            --python /runtime/writer/writer.py
            --
          )
          candidate_validator_payload=(
            "${candidate_runner_prefix[@]}"
            /runtime/validator
            /work/artifact.fbx
          )
          candidate_import_payload=(
            "${candidate_runner_prefix[@]}"
            /runtime/blender-root/blender
            --background
            --factory-startup
            --disable-autoexec
            --offline-mode
            --python-exit-code 50
            --python /runtime/support/blender_validate.py
            --
          )
          candidate_reopen_payload=(
            "${candidate_runner_prefix[@]}"
            /runtime/blender-root/blender
            --background
            --factory-startup
            --disable-autoexec
            --offline-mode
            --python-exit-code 50
            --python /runtime/support/blender_reopen_validate.py
            --
            --phase reopen
          )
          candidate_writer_input=( "${candidate_common_prefix[@]}" "${candidate_writer_payload[@]}" )
          candidate_validator_input=(
            "${candidate_common_prefix[@]}"
            --ro-bind /carrier/native/s8-fbx-validator /runtime/validator
            "${candidate_validator_payload[@]}"
          )
          candidate_import_input=(
            "${candidate_common_prefix[@]}"
            --ro-bind /carrier/support/blender_validate.py /runtime/support/blender_validate.py
            "${candidate_import_payload[@]}"
          )
          candidate_reopen_input=(
            "${candidate_common_prefix[@]}"
            --ro-bind /carrier/support/blender_reopen_validate.py /runtime/support/blender_reopen_validate.py
            "${candidate_reopen_payload[@]}"
          )
          candidate_tmpfs_index=-1
          for ((index = 0; index < ${#candidate_writer_input[@]}; index++)); do
            if [[ "${candidate_writer_input[index]}" == --tmpfs ]]; then
              candidate_tmpfs_index=$index
              break
            fi
          done
          [[ "$candidate_tmpfs_index" -ge 0 ]] || fail_amendment "CANDIDATE_INPUT_REGRESSION_FIXTURE_MISSING_TMPFS"
          candidate_missing_tmpfs=(
            "${candidate_writer_input[@]:0:$candidate_tmpfs_index}"
            "${candidate_writer_input[@]:$((candidate_tmpfs_index + 2))}"
          )
          candidate_duplicate_tmpfs=(
            "${candidate_writer_input[@]:0:$candidate_tmpfs_index}"
            --tmpfs /tmp
            --tmpfs /tmp
            "${candidate_writer_input[@]:$((candidate_tmpfs_index + 2))}"
          )
          candidate_tmpfs_without_destination=(
            "${candidate_writer_input[@]:0:$candidate_tmpfs_index}"
            --tmpfs
            "${candidate_writer_input[@]:$((candidate_tmpfs_index + 2))}"
          )
          candidate_wrong_tmpfs_destination=(
            "${candidate_writer_input[@]:0:$candidate_tmpfs_index}"
            --tmpfs /var/tmp
            "${candidate_writer_input[@]:$((candidate_tmpfs_index + 2))}"
          )
          candidate_caller_supplied_size=(
            "${candidate_writer_input[@]:0:$candidate_tmpfs_index}"
            --size "$tmpfs_bytes"
            "${candidate_writer_input[@]:$candidate_tmpfs_index}"
          )
          run_candidate_input_case VALID_WRITER ACCEPT "${candidate_writer_input[@]}"
          run_candidate_input_case VALID_VALIDATOR ACCEPT "${candidate_validator_input[@]}"
          run_candidate_input_case VALID_IMPORT ACCEPT "${candidate_import_input[@]}"
          run_candidate_input_case VALID_REOPEN ACCEPT "${candidate_reopen_input[@]}"
          run_candidate_input_case MISSING_TMPFS REJECT "${candidate_missing_tmpfs[@]}"
          run_candidate_input_case DUPLICATE_TMPFS REJECT "${candidate_duplicate_tmpfs[@]}"
          run_candidate_input_case TMPFS_WITHOUT_DESTINATION REJECT "${candidate_tmpfs_without_destination[@]}"
          run_candidate_input_case WRONG_TMPFS_DESTINATION REJECT "${candidate_wrong_tmpfs_destination[@]}"
          run_candidate_input_case CALLER_SUPPLIED_SIZE REJECT "${candidate_caller_supplied_size[@]}"
          printf 'CANDIDATE_INPUT_SIZE_REJECTION=PASS\nCANDIDATE_INPUT_REGRESSION=PASS\n'

          qualified_helper="$temp_root/s8-runtime-sensitivity-hosted.py"
          /usr/bin/python3 - "$GITHUB_WORKSPACE/scripts/s8/s8_runtime_sensitivity.py" "$qualified_helper" "$candidate_marker_file" <<'PY'
          import builtins
          import contextlib
          import io
          from pathlib import Path
          import json
          import tempfile
          import sys
          from types import SimpleNamespace

          source_path = Path(sys.argv[1])
          target_path = Path(sys.argv[2])
          marker_path = Path(sys.argv[3])
          source = source_path.read_text(encoding="utf-8")
          admission_anchor = "    try:\n        result = subprocess.run(\n"
          if source.count(admission_anchor) != 1:
              raise SystemExit("destination admission anchor is not unique")
          admission_block = (
              "    admission_command = [str(sandbox), \"--s8-destination-admission-only\", *command[1:]]\n"
              "    try:\n"
              "        admission_result = subprocess.run(\n"
              "            admission_command,\n"
              "            cwd=work,\n"
              "            env={\"PATH\": \"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\", \"LANG\": \"C.UTF-8\", \"LC_ALL\": \"C.UTF-8\"},\n"
              "            stdout=subprocess.PIPE,\n"
              "            stderr=subprocess.PIPE,\n"
              "            timeout=30,\n"
              "            check=False,\n"
              "        )\n"
              "    except (OSError, subprocess.TimeoutExpired):\n"
              "        fail(\"BWRAP_DESTINATION_ORDER_ADMISSION_FAILED\", \"HOSTED_SANDBOX_ENVIRONMENT_HOLD\")\n"
              "    if admission_result.returncode != 0:\n"
              "        fail(\"BWRAP_DESTINATION_ORDER_ADMISSION_FAILED\", \"HOSTED_SANDBOX_ENVIRONMENT_HOLD\")\n"
              "    if not marker_path.exists():\n"
              "        marker_path.write_text(\"1\\n\", encoding=\"ascii\")\n"
              "        print(\"BWRAP_DESTINATION_ORDER_ADMISSION=candidate\", flush=True)\n"
              "        print(\"BWRAP_SETUP_DESTINATION_INVARIANT=fresh_bwrap_owned_root+fixed_top_level_destinations_only+no_bind_destination_root+writable_/work_mounted_only_at_/work+no_bwrap_file_dir_symlink_creation_beneath_/work+no_destination_beneath_any_prior_candidate_controlled_or_writable_bind+destination_order_mechanically_validated_before_bwrap_execution\", flush=True)\n"
              "        print(\"CANDIDATE_EXECUTION_START=S8_PINNED_BLENDER_PRIVATE_EXPORTER\", flush=True)\n"
          )
          source = source.replace(admission_anchor, admission_block + admission_anchor, 1)
          marker_binding_literal = json.dumps(str(marker_path), ensure_ascii=True)
          marker_binding = f"marker_path = pathlib.Path({marker_binding_literal})\n\n"
          run_sandbox_anchor = "def run_sandbox(\n"
          if source.count(run_sandbox_anchor) != 1:
              raise SystemExit("run_sandbox anchor is not unique")
          diagnostic_helpers = r'''
          import hashlib
          import re
          import sys

          diagnostic_phase = "UNKNOWN"

          def _s8_diagnostic_scalar(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "true" if value else "false"
              return str(value)

          def _s8_diagnostic_payload(label, payload):
              secret_pattern = re.compile(
                  r"(?is)-----BEGIN (?:RSA|EC|OPENSSH|PRIVATE) KEY-----.*?-----END (?:RSA|EC|OPENSSH|PRIVATE) KEY-----|sk-[A-Za-z0-9_-]{20,}|gh[pous]_[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}"
              )
              text = payload.decode("utf-8", errors="replace")
              redacted = secret_pattern.search(text) is not None
              if redacted:
                  text = secret_pattern.sub("[REDACTED_SECRET]", text)
              print(f"{label}_SECRET_SAFETY={'REDACTED' if redacted else 'PASS'}", flush=True)
              sys.stdout.write(f"--- {label}_BEGIN ---\n")
              sys.stdout.write(text)
              if not text.endswith("\n"):
                  sys.stdout.write("\n")
              sys.stdout.write(f"--- {label}_END ---\n")

          def _s8_emit_runner_diagnostic(result):
              try:
                  print(f"FAILING_RUNTIME_PHASE={diagnostic_phase}", flush=True)
                  print(f"RUNNER_PROCESS_RETURN_CODE={result.returncode}", flush=True)
                  receipt_prefix = b"S8_RUNNER_RECEIPT:"
                  receipt_line = None
                  receipt_start = -1
                  offset = 0
                  for line in result.stdout.splitlines(keepends=True):
                      if line.startswith(receipt_prefix):
                          receipt_line = line
                          receipt_start = offset
                          break
                      offset += len(line)
                  if receipt_line is None:
                      print("DIAGNOSTIC_RECEIPT_PARSE=NOT_FOUND", flush=True)
                      return
                  receipt_text = receipt_line.rstrip(b"\r\n").decode("utf-8", errors="strict")
                  receipt = json.loads(receipt_text[len(receipt_prefix):])
                  parent_verification = receipt.get("runnerParentVerification") or {}
                  result_data = receipt.get("result") or {}
                  sys.stdout.write("--- S8_RUNNER_RECEIPT_RAW_BEGIN ---\n")
                  sys.stdout.write(receipt_text)
                  sys.stdout.write("\n--- S8_RUNNER_RECEIPT_RAW_END ---\n")
                  for label, value in (
                      ("RECEIPT_SCHEMA_VERSION", receipt.get("schemaVersion", "<MISSING>")),
                      ("RECEIPT_PROTOCOL", receipt.get("protocol", "<MISSING>")),
                      ("RECEIPT_POLICY_ID", receipt.get("policyId", "<MISSING>")),
                      ("RUNNER_PARENT_VERIFICATION_STATUS", parent_verification.get("status", "<MISSING>")),
                      ("RUNNER_PARENT_MISMATCH_CODE", parent_verification.get("mismatchCode", "<MISSING>")),
                      ("RUNNER_RESULT_CODE", result_data.get("code", "<MISSING>")),
                      ("RUNNER_RESULT_NAME", result_data.get("name", "<MISSING>")),
                      ("RUNNER_TERMINATION_CLASS", result_data.get("terminationClass", "<MISSING>")),
                      ("RUNNER_TARGET_EXIT", result_data.get("targetExit", "<MISSING>")),
                      ("RUNNER_TARGET_SIGNAL", result_data.get("targetSignal", "<MISSING>")),
                      ("RUNNER_ELAPSED_MS", result_data.get("elapsedMs", "<MISSING>")),
                      ("RUNNER_STDOUT_BYTES", result_data.get("stdoutBytes", "<MISSING>")),
                      ("RUNNER_STDERR_BYTES", result_data.get("stderrBytes", "<MISSING>")),
                      ("RUNNER_SETUP_STAGE", result_data.get("setupStage", "<MISSING>")),
                      ("RUNNER_EVIDENCE_CODE", result_data.get("evidenceCode", "<MISSING>")),
                  ):
                      print(f"{label}={_s8_diagnostic_scalar(value)}", flush=True)
