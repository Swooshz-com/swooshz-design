              def make_runner_receipt(
                  code=0, target_stdout=b"", target_stderr=b"", *,
                  result_updates=None, parent_updates=None,
              ):
                  name, termination = test_runner_results.get(
                      code, ("S8_RUNNER_ARGUMENT_INVALID", "argument-invalid")
                  )
                  result = {
                      "code": code,
                      "name": name,
                      "terminationClass": termination,
                      "targetExit": 0 if code == 0 else 23 if code == 76 else None,
                      "targetSignal": 9 if code == 77 else None,
                      "elapsedMs": 17,
                      "stdoutBytes": len(target_stdout),
                      "stderrBytes": len(target_stderr),
                      "setupStage": "seccomp" if code == 71 else None,
                      "evidenceCode": "CHILD_EVIDENCE_MALFORMED" if code == 72 else None,
                  }
                  if result_updates:
                      result.update(result_updates)
                  parent = {"status": "PASS", "mismatchCode": None}
                  if code in {71, 72}:
                      parent["status"] = "FAIL"
                  if code == 72:
                      parent["mismatchCode"] = "CHILD_EVIDENCE_MALFORMED"
                  if code == 70:
                      parent["mismatchCode"] = "CAPTURE_INIT"
                  if parent_updates:
                      parent.update(parent_updates)
                  return {
                      "schemaVersion": "s8-process-runner-receipt-v2",
                      "protocol": "s8-process-runner-receipt-v2",
                      "policyId": "s8-zero-child-seccomp-x86_64-v2",
                      "runnerParentVerification": parent,
                      "result": result,
                  }

              def frame_runner_receipt(receipt, target_stdout=b"", prelude=b""):
                  encoded = json.dumps(receipt, ensure_ascii=True, sort_keys=True, separators=(",", ":")).encode("ascii")
                  return prelude + b"S8_RUNNER_RECEIPT:" + encoded + b"\n" + target_stdout

              def raw_runner_frame(payload, target_stdout=b"", prelude=b"", final_lf=True):
                  return prelude + b"S8_RUNNER_RECEIPT:" + payload + (b"\n" if final_lf else b"") + target_stdout

