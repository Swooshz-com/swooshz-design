              )
              expect_raw_reject("CHANGED_DIRECTIVE_ORDER", b"".join(reordered_lines))
              expect_raw_reject("WRONG_LENGTH_REMOVE_FINAL_BYTE", TRIGGER_FIXTURE[:-1])
              expect_raw_reject("WRONG_LENGTH_APPEND_LF", TRIGGER_FIXTURE + b"\n")
              same_length_wrong_hash = bytearray(TRIGGER_FIXTURE)
              same_length_wrong_hash[0] ^= 1
              expect_raw_reject("SAME_LENGTH_WRONG_HASH", bytes(same_length_wrong_hash))
              expect_raw_reject("CRLF_CONVERSION", TRIGGER_FIXTURE.replace(b"\n", b"\r\n"))
              expect_raw_reject("COMMENT_CHANGE", TRIGGER_FIXTURE.replace(b"Several", b"General", 1))
              expect_raw_reject("WHITESPACE_CHANGE", TRIGGER_FIXTURE.replace(b"interest-noawait /usr/man", b"interest-noawait\t/usr/man", 1))
              print("RAW_FIXTURE_REGRESSION=PASS")

          def run_package_binding_regression():
              for name, value in (
                  ("WRONG_PACKAGE", PACKAGE_RECORD.replace(b"man-db", b"other", 1)),
                  ("WRONG_STATUS", PACKAGE_RECORD.replace(b"install ok installed", b"deinstall ok config-files", 1)),
                  ("WRONG_VERSION", PACKAGE_RECORD.replace(b"2.12.0-4build2", b"2.12.0-4build1", 1)),
                  ("WRONG_ARCHITECTURE", PACKAGE_RECORD.replace(b"amd64", b"arm64", 1)),
              ):
                  expect_query_reject(name, 0, value, PACKAGE_RECORD)
              expect_query_reject("CONTROL_QUERY_FAILURE", 1, CONTROL_PATH, CONTROL_PATH)
              expect_query_reject("MISSING_CONTROL_PATH", 0, b"", CONTROL_PATH)
              expect_query_reject(
                  "MULTIPLE_CONTROL_PATH",
                  0,
                  CONTROL_PATH + b"/var/lib/dpkg/info/other.triggers\n",
                  CONTROL_PATH,
              )
              expect_query_reject(
                  "WRONG_CONTROL_PATH",
                  0,
                  b"/var/lib/dpkg/info/other.triggers\n",
                  CONTROL_PATH,
              )
              print("PACKAGE_BINDING_REGRESSION=PASS")

          def run_path_identity_regression():
              good_ancestor = {
                  "actual_directory": True,
                  "symlink": False,
                  "owner": "root",
                  "group_or_other_writable": False,
              }
              for name, field, value in (
                  ("UNSAFE_ANCESTOR_NOT_DIRECTORY", "actual_directory", False),
                  ("UNSAFE_ANCESTOR_SYMLINK", "symlink", True),
                  ("UNSAFE_ANCESTOR_OWNER", "owner", "user"),
                  ("UNSAFE_ANCESTOR_MODE", "group_or_other_writable", True),
              ):
                  mutated = copy.deepcopy(good_ancestor)
                  mutated[field] = value
                  expect_ancestor_reject(name, mutated)
              print("ANCESTOR_REGRESSION=PASS")

              good_file = {
                  "exists": True,
                  "open_failure": False,
                  "stat_failure": False,
                  "symlink": False,
                  "kind": "regular",
                  "uid": 0,
                  "gid": 0,
                  "writable": False,
                  "link_count": 1,
              }
              for name, field, value in (
                  ("MISSING_FILE", "exists", False),
                  ("SYMLINK_FILE", "symlink", True),
                  ("HARD_LINK_FILE", "link_count", 2),
                  ("DIRECTORY_INSTEAD_OF_FILE", "kind", "directory"),
                  ("SPECIAL_FILE", "kind", "fifo"),
                  ("UNSAFE_OWNER", "uid", 1000),
                  ("UNSAFE_FILE_MODE", "writable", True),
                  ("OPEN_FAILURE", "open_failure", True),
                  ("STAT_FAILURE", "stat_failure", True),
              ):
                  mutated = copy.deepcopy(good_file)
                  mutated[field] = value
                  expect_file_reject(name, mutated)
              print("PATH_FILE_IDENTITY_REGRESSION=PASS")

          def bounded_read_model(data, fail=False):
              if fail:
                  reject("READ_FAILURE")
              return data[:TRIGGER_MAX_READ]

          def run_read_and_stability_regression():
              expect_reject(
                  "READ_FAILURE",
                  lambda: bounded_read_model(TRIGGER_FIXTURE, fail=True),
              )
              bounded = bounded_read_model(TRIGGER_FIXTURE + b"x")
              require(len(bounded) == TRIGGER_MAX_READ, "BOUNDED_READ")
              require(not trigger_bytes_valid(bounded), "BOUNDED_READ_ACCEPTED")
              print("READ_FAILURE_REGRESSION=PASS")

              metadata = {
                  "st_dev": 1,
                  "st_ino": 2,
                  "st_mode": 0o100644,
                  "st_uid": 0,
                  "st_gid": 0,
                  "st_nlink": 1,
                  "st_size": TRIGGER_LENGTH,
                  "st_mtime_ns": 3,
                  "st_ctime_ns": 4,
              }
              for field in IDENTITY_FIELDS:
                  changed = dict(metadata)
                  changed[field] = changed[field] + 1
                  if metadata_stable(metadata, changed):
                      raise AssertionError(f"{field} metadata change accepted")
                  print(f"CONCURRENT_METADATA_CHANGE_{field}=REJECT")
              print("CONCURRENT_IDENTITY_CHANGE_REGRESSION=PASS")

          def run_single_byte_exhaustive_regression():
              for position, original in enumerate(TRIGGER_FIXTURE):
                  for replacement in range(256):
                      if replacement == original:
                          continue
                      mutated = bytearray(TRIGGER_FIXTURE)
                      mutated[position] = replacement
                      if trigger_bytes_valid(bytes(mutated)):
                          raise AssertionError(
                              f"single-byte substitution accepted at {position}:{replacement}"
                          )
              print("SINGLE_BYTE_EXHAUSTIVE_REGRESSION=PASS")

          EXPECTED_TRIGGER_LINES = [
              line.decode("ascii").rstrip("\n")
              for line in ACTIVE_TRIGGER_LINES
          ]
          EXPECTED_SKIP = "Not building database; man-db/auto-update is not 'true'."
          EXPECTED_EPISODE = "Processing triggers for man-db (2.12.0-4build2) ..."
          BASE_LOG = f"{EXPECTED_EPISODE}\n{EXPECTED_SKIP}\n"

          def run_runtime_regression():
              def check(snapshot):
                  if not snapshot["dpkg_success"]:
                      reject("DPKG_FAILURE")
                  if snapshot["man_db_version"] != "2.12.0-4build2":
                      reject("WRONG_MAN_DB_VERSION")
                  if snapshot["trigger_lines"] != EXPECTED_TRIGGER_LINES:
                      reject("TRIGGER_IDENTITY_INVALID")
                  if snapshot["auto_update_sentinel_present"]:
                      reject("AUTO_UPDATE_SENTINEL_PRESENT")
                  if not snapshot["cache_exists"]:
                      reject("CACHE_DIRECTORY_MISSING")
                  if not snapshot["cache_safe"]:
                      reject("CACHE_DIRECTORY_UNSAFE")
                  if snapshot["cache_before"] != snapshot["cache_after"]:
                      reject("CACHE_MANIFEST_CHANGE")
                  episodes = [
                      line
                      for line in snapshot["install_log"].splitlines()
                      if line.startswith("Processing triggers for ")
                  ]
                  if episodes != [EXPECTED_EPISODE]:
                      reject("TRIGGER_EPISODE_INVALID")
                  if snapshot["install_log"].splitlines().count(EXPECTED_SKIP) != 1:
                      reject("SKIP_RESULT_INVALID")
                  if re.search(
                      r"^(Building|Updating) database of manual pages",
                      snapshot["install_log"],
                      re.MULTILINE,
                  ):
                      reject("DATABASE_BUILD_OUTPUT")
                  if snapshot["pending"] or snapshot["awaited"]:
                      reject("PENDING_OR_AWAITED_TRIGGER_STATE")
                  if snapshot["other_trigger_count"] != 0:
                      reject("OTHER_TRIGGER")
                  if snapshot["man_db_status"] != "install ok installed":
                      reject("MAN_DB_STATUS_INVALID")
                  return True

              base = {
                  "dpkg_success": True,
                  "man_db_version": "2.12.0-4build2",
                  "man_db_status": "install ok installed",
                  "trigger_lines": list(EXPECTED_TRIGGER_LINES),
                  "auto_update_sentinel_present": False,
                  "cache_exists": True,
                  "cache_safe": True,
                  "cache_before": "manifest-v1",
                  "cache_after": "manifest-v1",
                  "install_log": BASE_LOG,
                  "pending": False,
                  "awaited": False,
                  "other_trigger_count": 0,
              }
              require(check(base), "RUNTIME_BASE_REJECTED")
              print("EXACT_MAN_DB_SKIP_CASE=ACCEPT")
              cases = [
                  ("MISSING_TRIGGER", lambda value: value.update(trigger_lines=[])),
                  (
                      "EXTRA_TRIGGER",
                      lambda value: value.update(
                          install_log=BASE_LOG
                          + "Processing triggers for libc-bin (2.39-0ubuntu8.6) ...\n",
                          other_trigger_count=1,
                      ),
                  ),
                  ("WRONG_MAN_DB_VERSION", lambda value: value.update(man_db_version="2.12.0-4build1")),
                  ("AUTO_UPDATE_SENTINEL_PRESENT", lambda value: value.update(auto_update_sentinel_present=True)),
                  ("CACHE_DIRECTORY_MISSING", lambda value: value.update(cache_exists=False)),
                  ("CACHE_DIRECTORY_UNSAFE", lambda value: value.update(cache_safe=False)),
                  ("CACHE_MANIFEST_CHANGE", lambda value: value.update(cache_after="manifest-v2")),
                  ("DATABASE_BUILD_OUTPUT", lambda value: value.update(install_log=BASE_LOG + "Building database of manual pages ...\n")),
                  ("PENDING_TRIGGER_STATE", lambda value: value.update(pending=True)),
                  ("AWAITED_TRIGGER_STATE", lambda value: value.update(awaited=True)),
                  ("DPKG_FAILURE", lambda value: value.update(dpkg_success=False)),
              ]
              for name, mutate in cases:
                  snapshot = copy.deepcopy(base)
                  mutate(snapshot)
                  try:
                      check(snapshot)
                  except Reject:
                      print(f"{name}=REJECT")
                  else:
                      raise AssertionError(f"{name} unexpectedly accepted")
              print("RUNTIME_TRIGGER_REGRESSION=PASS")
              print("PACKAGE_TRIGGER_REGRESSION=PASS")

          try:
              if sys.argv[1] == "production":
                  run_production_check()
              elif sys.argv[1] == "regression":
                  run_raw_identity_regression()
                  run_package_binding_regression()
                  run_path_identity_regression()
                  run_read_and_stability_regression()
                  run_single_byte_exhaustive_regression()
                  run_runtime_regression()
              else:
                  reject("MODE_INVALID")
          except Reject as error:
              print(f"MAN_DB_TRIGGER_CHECK_REJECT={error}", file=sys.stderr)
              raise SystemExit(1)
          except Exception as error:
              print(f"MAN_DB_TRIGGER_CHECK_INTERNAL_FAILURE={type(error).__name__}", file=sys.stderr)
              raise SystemExit(1)
          PY
          }

          run_package_trigger_regression() {
            trigger_identity_checker regression
          }

          run_bwrap_mode_regression || fail_hold "PRIVILEGE_MODE_REGRESSION_FAILED"
          run_old_decimal_mask_regression || fail_hold "OLD_DECIMAL_MASK_REGRESSION_FAILED"
          run_package_trigger_regression || fail_hold "PACKAGE_TRIGGER_REGRESSION_FAILED"
          metadata_file="$archive_root/bubblewrap.metadata"
          [[ ! -e "$metadata_file" && ! -L "$metadata_file" ]] || fail_hold "UBUNTU_PACKAGES_METADATA_PATH_NOT_FRESH"
          if ! ubuntu_packages_parser --select "$packages_plain" > "$metadata_file"; then
            /usr/bin/rm -f -- "$metadata_file"
            fail_hold "UBUNTU_PACKAGES_PARSER_REJECTED"
          fi
          metadata_line_count="$(wc -l < "$metadata_file")"
          [[ "$metadata_line_count" == 3 ]] || fail_hold "UBUNTU_PACKAGES_METADATA_LINE_COUNT_INVALID"
          mapfile -t metadata_lines < "$metadata_file" || fail_hold "UBUNTU_PACKAGES_METADATA_READ_FAILED"
          [[ "${#metadata_lines[@]}" == 3 ]] || fail_hold "UBUNTU_PACKAGES_METADATA_CARDINALITY_INVALID"
          [[ "${metadata_lines[0]}" == "FILENAME=pool/main/b/bubblewrap/$expected_bwrap_deb" ]] || fail_hold "UBUNTU_BUBBLEWRAP_FILENAME_FIELD_INVALID"
          [[ "${metadata_lines[1]}" =~ ^SIZE=[0-9]+$ ]] || fail_hold "UBUNTU_BUBBLEWRAP_SIZE_FIELD_INVALID"
          [[ "${metadata_lines[2]}" =~ ^SHA256=[A-Fa-f0-9]{64}$ ]] || fail_hold "UBUNTU_BUBBLEWRAP_SHA_FIELD_INVALID"
          stanza_filename="${metadata_lines[0]#FILENAME=}"
          stanza_size="${metadata_lines[1]#SIZE=}"
          stanza_sha="${metadata_lines[2]#SHA256=}"
          fetch_exact_archive "$bubblewrap_deb" "$archive_base_url/$stanza_filename" || fail_hold "UBUNTU_BUBBLEWRAP_DOWNLOAD_FAILED"
          [[ "$(stat -c '%s' -- "$bubblewrap_deb")" == "$stanza_size" ]] || fail_hold "UBUNTU_BUBBLEWRAP_SIZE_MISMATCH"
          printf '%s  %s\n' "$stanza_sha" "$bubblewrap_deb" | /usr/bin/sha256sum --check --status || fail_hold "UBUNTU_BUBBLEWRAP_SHA256_MISMATCH"
          printf 'BUBBLEWRAP_DEB_FILENAME=%s\nBUBBLEWRAP_DEB_SIZE=%s\nBUBBLEWRAP_DEB_SHA256=%s\n' "$stanza_filename" "$stanza_size" "$stanza_sha"

          deb_package="$(/usr/bin/dpkg-deb -f "$bubblewrap_deb" Package)" || fail_hold "UBUNTU_BUBBLEWRAP_DEB_METADATA_FAILED"
          deb_version="$(/usr/bin/dpkg-deb -f "$bubblewrap_deb" Version)" || fail_hold "UBUNTU_BUBBLEWRAP_DEB_VERSION_FAILED"
          deb_architecture="$(/usr/bin/dpkg-deb -f "$bubblewrap_deb" Architecture)" || fail_hold "UBUNTU_BUBBLEWRAP_DEB_ARCHITECTURE_FAILED"
          [[ "$deb_package" == bubblewrap ]] || fail_hold "UBUNTU_BUBBLEWRAP_DEB_PACKAGE_INVALID"
          [[ "$deb_version" == "$expected_bwrap_version" ]] || fail_hold "UBUNTU_BUBBLEWRAP_DEB_VERSION_INVALID"
          [[ "$deb_architecture" == amd64 ]] || fail_hold "UBUNTU_BUBBLEWRAP_DEB_ARCHITECTURE_INVALID"
          /usr/bin/dpkg-deb -x "$bubblewrap_deb" "$verify_root" || fail_hold "UBUNTU_BUBBLEWRAP_DEB_EXTRACTION_FAILED"
          verified_bwrap="$verify_root/usr/bin/bwrap"
          [[ -f "$verified_bwrap" && ! -L "$verified_bwrap" ]] || fail_hold "VERIFIED_BWRAP_PAYLOAD_PATH_INVALID"
          verified_bwrap_sha256="$(sha256sum -- "$verified_bwrap" | awk '{print $1}')" || fail_hold "VERIFIED_BWRAP_PAYLOAD_HASH_FAILED"
          [[ "$verified_bwrap_sha256" =~ ^[A-Fa-f0-9]{64}$ ]] || fail_hold "VERIFIED_BWRAP_PAYLOAD_HASH_INVALID"
          printf 'PACKAGE=bubblewrap\nPACKAGE_VERSION_EXACT=%s\nPACKAGE_ARCHITECTURE=amd64\nVERIFIED_DEB_BWRAP_PAYLOAD_SHA256=%s\n' "$deb_version" "$verified_bwrap_sha256"

          /usr/bin/cp -- "$packages_index" "$apt_lists/security.ubuntu.com_ubuntu_dists_noble-security_main_binary-amd64_Packages.xz"
          /usr/bin/cp -- "$inrelease" "$apt_lists/security.ubuntu.com_ubuntu_dists_noble-security_InRelease"
          apt_plan_output="$(/usr/bin/apt-get --simulate --no-remove --no-install-recommends \
            -o Debug::NoLocking=true \
            -o Dir::Etc::sourcelist="$apt_sources" \
            -o Dir::Etc::sourceparts=- \
            -o Dir::State::lists="$apt_lists/" \
            -o Dir::State::status=/var/lib/dpkg/status \
            -o Dir::Cache="$apt_cache/" \
            -o Dir::Cache::archives="$apt_archives/" \
            -o Acquire::AllowInsecureRepositories=false \
            -o Acquire::AllowDowngradeToInsecureRepositories=false \
            install "$bubblewrap_deb" 2>&1)" || {
              printf '%s\n' "$apt_plan_output" > "$package_plan"
              fail_hold "BUBBLEWRAP_INSTALL_PLAN_SIMULATION_FAILED"
            }
          printf '%s\n' "$apt_plan_output" > "$package_plan"
          mapfile -t plan_installs < <(awk '$1 == "Inst" { print $2 }' "$package_plan")
          mapfile -t plan_confs < <(awk '$1 == "Conf" { print $2 }' "$package_plan")
          [[ "${#plan_installs[@]}" == 1 && "${plan_installs[0]}" == bubblewrap ]] || fail_hold "BUBBLEWRAP_INSTALL_PLAN_PACKAGE_SET_INVALID"
          [[ "${#plan_confs[@]}" == 1 && "${plan_confs[0]}" == bubblewrap ]] || fail_hold "BUBBLEWRAP_INSTALL_PLAN_CONFIGURATION_SET_INVALID"
          if grep -Eiq '^(Trig|Processing triggers)' "$package_plan"; then
            fail_hold "BUBBLEWRAP_INSTALL_PLAN_TRIGGER_SET_INVALID"
          fi
          if grep -E '^(Remv|Purg|Del|Downgrade|Remove|Inst )' "$package_plan" | grep -Ev '^Inst bubblewrap( |$)' >/dev/null; then
            fail_hold "BUBBLEWRAP_INSTALL_PLAN_MUTATION_SET_INVALID"
          fi
          grep -F "Inst bubblewrap ($expected_bwrap_version" "$package_plan" >/dev/null || fail_hold "BUBBLEWRAP_INSTALL_PLAN_VERSION_INVALID"
          printf 'ONE_NEW_PACKAGE=bubblewrap:amd64=0.9.0-1ubuntu0.3\nNO_VERSION_SUBSTITUTION=PASS\nPACKAGE_INSTALL_PLAN=PASS\n'

          if ! trigger_identity_checker production; then
            fail_hold "MAN_DB_TRIGGER_IDENTITY_INVALID"
          fi
          [[ ! -e "$man_db_auto_update_sentinel" && ! -L "$man_db_auto_update_sentinel" ]] || fail_hold "AUTO_UPDATE_SENTINEL_PRESENT_PREINSTALL"
          assert_root_component /var || fail_hold "VAR_PROTECTED_ANCESTOR_INVALID"
          assert_root_component /var/cache || fail_hold "VAR_CACHE_PROTECTED_ANCESTOR_INVALID"
          protected_host_path_is_safe "$man_db_cache" || fail_hold "MAN_CACHE_DIRECTORY_UNSAFE"
          man_cache_manifest "$man_db_cache" > "$man_cache_manifest_before" || fail_hold "MAN_CACHE_MANIFEST_PREINSTALL_FAILED"
          [[ -s "$man_cache_manifest_before" ]] || fail_hold "MAN_CACHE_MANIFEST_PREINSTALL_EMPTY"
          pre_trigger_state="$(dpkg_trigger_state)"
          [[ -z "$pre_trigger_state" ]] || fail_hold "DPKG_PREINSTALL_TRIGGER_STATE_NOT_CLEAN"
          printf 'MAN_DB_STATUS=install ok installed\nMAN_DB_VERSION=%s\nTRIGGER_REGISTERED_INTEREST_COUNT=6\nTRIGGER_REGISTERED_INTERESTS=PROVEN_BY_RAW_BYTE_IDENTITY\nAUTO_UPDATE_SENTINEL=ABSENT\nMAN_CACHE_PATH=%s\nMAN_CACHE_PREINSTALL_MANIFEST=%s\nDPKG_PREINSTALL_TRIGGER_STATE=CLEAN\n' \
            "$expected_man_db_version" "$man_db_cache" "$man_cache_manifest_before"

          install_status=0
          /usr/bin/sudo -n /usr/bin/dpkg --install "$bubblewrap_deb" > "$bubblewrap_install_log" 2>&1 || install_status=$?
          [[ "$install_status" == 0 ]] || fail_hold "BUBBLEWRAP_INSTALL_FAILED"
          [[ -s "$bubblewrap_install_log" ]] || fail_hold "BUBBLEWRAP_INSTALL_LOG_EMPTY"
          expected_man_db_trigger_episode="Processing triggers for man-db ($expected_man_db_version) ..."
          expected_man_db_skip="Not building database; man-db/auto-update is not 'true'."
          mapfile -t trigger_episodes < <(/usr/bin/grep -E '^Processing triggers for [^ ]+ \([^)]*\) \.\.\.$' "$bubblewrap_install_log" || true)
          [[ "${#trigger_episodes[@]}" == 1 && "${trigger_episodes[0]}" == "$expected_man_db_trigger_episode" ]] || fail_hold "MAN_DB_TRIGGER_EPISODE_INVALID"
          skip_count="$(/usr/bin/grep -Fxc -- "$expected_man_db_skip" "$bubblewrap_install_log" || true)"
          [[ "$skip_count" == 1 ]] || fail_hold "MAN_DB_SKIP_RESULT_INVALID"
          other_trigger_count=0
          while IFS= read -r trigger_episode; do
            [[ -z "$trigger_episode" ]] && continue
            [[ "$trigger_episode" == "$expected_man_db_trigger_episode" ]] || other_trigger_count=$((other_trigger_count + 1))
          done < <(/usr/bin/grep -E '^Processing triggers for [^ ]+ \([^)]*\) \.\.\.$' "$bubblewrap_install_log" || true)
          [[ "$other_trigger_count" == 0 ]] || fail_hold "OTHER_TRIGGER_PRESENT"
          if /usr/bin/grep -Eiq '^(Building|Updating) database of manual pages' "$bubblewrap_install_log"; then
            fail_hold "DATABASE_BUILD_OR_UPDATE_OUTPUT_PRESENT"
          fi
          [[ ! -e "$man_db_auto_update_sentinel" && ! -L "$man_db_auto_update_sentinel" ]] || fail_hold "AUTO_UPDATE_SENTINEL_PRESENT_POSTINSTALL"
          man_cache_manifest "$man_db_cache" > "$man_cache_manifest_after" || fail_hold "MAN_CACHE_MANIFEST_POSTINSTALL_FAILED"
          /usr/bin/cmp --silent "$man_cache_manifest_before" "$man_cache_manifest_after" || fail_hold "MAN_CACHE_MANIFEST_CHANGED"
          post_trigger_state="$(dpkg_trigger_state)"
          [[ -z "$post_trigger_state" ]] || fail_hold "DPKG_POSTINSTALL_TRIGGER_STATE_NOT_CLEAN"
          man_db_status_post="$(/usr/bin/dpkg-query -W -f='${Status}' man-db 2>/dev/null)" || fail_hold "MAN_DB_POST_STATUS_UNAVAILABLE"
          man_db_version_post="$(/usr/bin/dpkg-query -W -f='${Version}' man-db 2>/dev/null)" || fail_hold "MAN_DB_POST_VERSION_UNAVAILABLE"
          [[ "$man_db_status_post" == 'install ok installed' ]] || fail_hold "MAN_DB_POST_STATUS_INVALID"
          [[ "$man_db_version_post" == "$expected_man_db_version" ]] || fail_hold "MAN_DB_POST_VERSION_INVALID"
          printf 'MAN_DB_TRIGGER_IDENTITY=%s\nMAN_DB_TRIGGER_COUNT=1\nMAN_DB_TRIGGER_EPISODE_COUNT=1\nMAN_DB_SKIP_RESULT=PASS\nMAN_DB_SKIP_COUNT=%s\nMAN_DB_CACHE_MANIFEST_UNCHANGED=PASS\nMAN_CACHE_MANIFEST_UNCHANGED=YES\nOTHER_TRIGGER_COUNT=0\nOTHER_TRIGGER_EPISODES=0\nDATABASE_BUILD_OR_UPDATE=NONE\nDATABASE_BUILD_OR_UPDATE_OUTPUT=NONE\nTRIGGER_PENDING_STATE=CLEAN\nTRIGGER_AWAITED_STATE=CLEAN\nPOST_PENDING_TRIGGER_STATE=EMPTY\nPOST_AWAITED_TRIGGER_STATE=EMPTY\nMAN_DB_STATUS_AND_VERSION=UNCHANGED\n' \
            "$expected_man_db_trigger_episode" "$skip_count"

          installed_status="$(/usr/bin/dpkg-query -W -f='${Status}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_STATUS_UNAVAILABLE"
          installed_version="$(/usr/bin/dpkg-query -W -f='${Version}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_VERSION_UNAVAILABLE"
          installed_architecture="$(/usr/bin/dpkg-query -W -f='${Architecture}' bubblewrap 2>/dev/null)" || fail_hold "BUBBLEWRAP_INSTALLED_ARCHITECTURE_UNAVAILABLE"
          [[ "$installed_status" == 'install ok installed' ]] || fail_hold "BUBBLEWRAP_INSTALLED_STATUS_INVALID"
          [[ "$installed_version" == "$expected_bwrap_version" ]] || fail_hold "BUBBLEWRAP_INSTALLED_VERSION_INVALID"
          [[ "$installed_architecture" == amd64 ]] || fail_hold "BUBBLEWRAP_INSTALLED_ARCHITECTURE_INVALID"

          bwrap_path=/usr/bin/bwrap
          bwrap_realpath="$(realpath -e -- "$bwrap_path")" || fail_hold "BWRAP_REALPATH_FAILED"
          [[ "$bwrap_realpath" == "$bwrap_path" ]] || fail_hold "BWRAP_REALPATH_UNEXPECTED"
          [[ -f "$bwrap_path" && ! -L "$bwrap_path" ]] || fail_hold "BWRAP_PATH_INVALID"
          assert_root_component /usr || fail_hold "USR_PROTECTED_ANCESTOR_INVALID"
          assert_root_component /usr/bin || fail_hold "USR_BIN_PROTECTED_ANCESTOR_INVALID"
          [[ "$(stat -c '%u:%g' -- "$bwrap_path")" == '0:0' ]] || fail_hold "BWRAP_OWNER_INVALID"
          bwrap_owner_record="$(/usr/bin/dpkg-query -S "$bwrap_path" 2>/dev/null)" || fail_hold "BWRAP_DPKG_OWNER_UNAVAILABLE"
          [[ "${bwrap_owner_record%%:*}" == bubblewrap ]] || fail_hold "BWRAP_DPKG_OWNER_INVALID"
          bwrap_pre_sha256="$(sha256sum -- "$bwrap_path" | awk '{print $1}')" || fail_hold "BWRAP_PRE_HASH_FAILED"
          [[ "$bwrap_pre_sha256" =~ ^[A-Fa-f0-9]{64}$ ]] || fail_hold "BWRAP_PRE_HASH_INVALID"
          [[ "$bwrap_pre_sha256" == "$verified_bwrap_sha256" ]] || fail_hold "BWRAP_PRE_HASH_MISMATCH"
          command -v /usr/sbin/getcap >/dev/null 2>&1 || fail_hold "GETCAP_UNAVAILABLE"
          bwrap_getcap_pre_output="$archive_root/bwrap-getcap-pre.stdout"
          bwrap_getcap_pre_error="$archive_root/bwrap-getcap-pre.stderr"
          set +e
          /usr/sbin/getcap -n -- "$bwrap_path" > "$bwrap_getcap_pre_output" 2> "$bwrap_getcap_pre_error"
          getcap_pre_exit=$?
          set -e
          [[ "$getcap_pre_exit" == 0 ]] || fail_hold "GETCAP_PRE_QUERY_FAILED"
          [[ ! -s "$bwrap_getcap_pre_output" ]] || fail_hold "BWRAP_FILE_CAPABILITIES_PRESENT"
          bwrap_mode_raw="$(stat -c '%a' -- "$bwrap_path")"
          [[ "$bwrap_mode_raw" =~ ^[0-7]{3,4}$ ]] || fail_hold "BWRAP_MODE_MALFORMED"
          bwrap_mode_value=$((8#$bwrap_mode_raw))
          (( (bwrap_mode_value & 0777) == 0755 )) || fail_hold "BWRAP_ORDINARY_MODE_INVALID"
          (( (bwrap_mode_value & 01000) == 0 )) || fail_hold "BWRAP_UNRELATED_SPECIAL_BIT_PRESENT"
          bwrap_privilege_bits=$((bwrap_mode_value & 06000))
          if ! (( bwrap_privilege_bits == 0 || bwrap_privilege_bits == 02000 || bwrap_privilege_bits == 04000 || bwrap_privilege_bits == 06000 )); then
            fail_hold "BWRAP_PRIVILEGE_BITS_INVALID"
          fi
          if (( bwrap_mode_value < 01000 )); then
            printf -v bwrap_pre_mode '0%03o' "$bwrap_mode_value"
          else
            printf -v bwrap_pre_mode '0%04o' "$bwrap_mode_value"
          fi
          if (( bwrap_privilege_bits == 0 )); then
            bwrap_privilege_bits_display=0000
          else
            printf -v bwrap_privilege_bits_display '0%04o' "$bwrap_privilege_bits"
          fi
          case "$bwrap_pre_mode" in
            0755|02755|04755|06755) ;;
            *) fail_hold "BWRAP_MODE_COMBINATION_INVALID" ;;
          esac
          printf 'PACKAGE=bubblewrap\nVERSION=%s\nARCHITECTURE=%s\nSTATUS=%s\nPATH=%s\nREALPATH=%s\nTYPE=regular_file\nSYMLINK=NO\nOWNER=root:root\nBWRAP_OWNER=root:root\nDPKG_OWNER=bubblewrap\nBWRAP_DPKG_OWNER=bubblewrap\nINSTALLED_SHA256=%s\nBWRAP_PRE_SHA256=%s\nAUTHENTICATED_PAYLOAD_SHA256=%s\nBWRAP_PRE_MODE_RAW=%s\nBWRAP_PRE_MODE=%s\nBWRAP_PRIVILEGE_BITS=%s\nGETCAP_PRE_EXIT=%s\nGETCAP_PRE_EMPTY=PASS\n' \
            "$installed_version" "$installed_architecture" "$installed_status" "$bwrap_path" "$bwrap_realpath" "$bwrap_pre_sha256" "$bwrap_pre_sha256" "$verified_bwrap_sha256" "$bwrap_mode_raw" "$bwrap_pre_mode" "$bwrap_privilege_bits_display" "$getcap_pre_exit"
          printf 'BUBBLEWRAP_PRE_MODE=%s\nBUBBLEWRAP_PRE_HASH=%s\nGETCAP_QUERY_SUCCESS=YES\nGETCAP_EMPTY=YES\n' \
            "$bwrap_pre_mode" "$bwrap_pre_sha256"

          bwrap_transformation=NOOP
          if [[ "$bwrap_pre_mode" != 0755 ]]; then
            /usr/bin/sudo -n /usr/bin/chmod u-s,g-s -- "$bwrap_path" || fail_hold "BWRAP_CHMOD_PRIVILEGE_CLEAR_FAILED"
            bwrap_transformation=CLEARED_SUID_SGID
          fi

          bwrap_post_realpath="$(realpath -e -- "$bwrap_path")" || fail_hold "BWRAP_POST_REALPATH_FAILED"
          [[ "$bwrap_post_realpath" == "$bwrap_path" ]] || fail_hold "BWRAP_POST_REALPATH_UNEXPECTED"
          [[ -f "$bwrap_path" && ! -L "$bwrap_path" ]] || fail_hold "BWRAP_POST_PATH_INVALID"
          [[ "$(stat -c '%u:%g' -- "$bwrap_path")" == '0:0' ]] || fail_hold "BWRAP_POST_OWNER_INVALID"
          bwrap_post_mode_raw="$(stat -c '%a' -- "$bwrap_path")"
          [[ "$bwrap_post_mode_raw" =~ ^[0-7]{3,4}$ ]] || fail_hold "BWRAP_POST_MODE_MALFORMED"
          bwrap_post_mode_value=$((8#$bwrap_post_mode_raw))
          (( (bwrap_post_mode_value & 0777) == 0755 )) || fail_hold "BWRAP_POST_ORDINARY_MODE_INVALID"
          (( (bwrap_post_mode_value & 06000) == 0 )) || fail_hold "BWRAP_POST_SUID_SGID_PRESENT"
          printf -v bwrap_post_mode '%04o' "$bwrap_post_mode_value"
          [[ "$bwrap_post_mode" == 0755 ]] || fail_hold "BWRAP_POST_MODE_NOT_0755"
          bwrap_getcap_post_output="$archive_root/bwrap-getcap-post.stdout"
          bwrap_getcap_post_error="$archive_root/bwrap-getcap-post.stderr"
          set +e
          /usr/sbin/getcap -n -- "$bwrap_path" > "$bwrap_getcap_post_output" 2> "$bwrap_getcap_post_error"
          getcap_post_exit=$?
          set -e
          [[ "$getcap_post_exit" == 0 ]] || fail_hold "GETCAP_POST_QUERY_FAILED"
          [[ ! -s "$bwrap_getcap_post_output" ]] || fail_hold "BWRAP_POST_FILE_CAPABILITIES_PRESENT"
          post_installed_status="$(/usr/bin/dpkg-query -W -f='${Status}' bubblewrap 2>/dev/null)" || fail_hold "BWRAP_POST_STATUS_UNAVAILABLE"
          post_installed_version="$(/usr/bin/dpkg-query -W -f='${Version}' bubblewrap 2>/dev/null)" || fail_hold "BWRAP_POST_VERSION_UNAVAILABLE"
          post_installed_architecture="$(/usr/bin/dpkg-query -W -f='${Architecture}' bubblewrap 2>/dev/null)" || fail_hold "BWRAP_POST_ARCHITECTURE_UNAVAILABLE"
          [[ "$post_installed_status" == 'install ok installed' ]] || fail_hold "BWRAP_POST_STATUS_INVALID"
          [[ "$post_installed_version" == "$expected_bwrap_version" ]] || fail_hold "BWRAP_POST_VERSION_INVALID"
          [[ "$post_installed_architecture" == amd64 ]] || fail_hold "BWRAP_POST_ARCHITECTURE_INVALID"
          bwrap_post_owner_record="$(/usr/bin/dpkg-query -S "$bwrap_path" 2>/dev/null)" || fail_hold "BWRAP_POST_DPKG_OWNER_UNAVAILABLE"
          [[ "${bwrap_post_owner_record%%:*}" == bubblewrap ]] || fail_hold "BWRAP_POST_DPKG_OWNER_INVALID"
          bwrap_post_sha256="$(sha256sum -- "$bwrap_path" | awk '{print $1}')" || fail_hold "BWRAP_POST_HASH_FAILED"
          [[ "$bwrap_post_sha256" =~ ^[A-Fa-f0-9]{64}$ ]] || fail_hold "BWRAP_POST_HASH_INVALID"
          [[ "$bwrap_post_sha256" == "$bwrap_pre_sha256" ]] || fail_hold "BWRAP_POST_HASH_MISMATCH"
          [[ "$bwrap_post_sha256" == "$verified_bwrap_sha256" ]] || fail_hold "BWRAP_POST_AUTHENTICATED_HASH_MISMATCH"
          printf 'PATH=%s\nREALPATH=%s\nTYPE=regular_file\nSYMLINK=NO\nOWNER=root:root\nBWRAP_OWNER=root:root\nMODE=%s\nNO_SUID=PASS\nNO_SGID=PASS\nGETCAP_EXIT=%s\nGETCAP_POST_EXIT=%s\nFILE_CAPABILITIES=NONE\nGETCAP_POST_EMPTY=PASS\nDPKG_OWNER=bubblewrap\nBWRAP_DPKG_OWNER=bubblewrap\nPACKAGE_STATUS=%s\nBWRAP_PACKAGE_STATUS=%s\nPACKAGE_VERSION=%s\nBWRAP_PACKAGE_VERSION=%s\nPACKAGE_ARCHITECTURE=%s\nBWRAP_PACKAGE_ARCHITECTURE=%s\nPOST_SHA256=%s\nBWRAP_POST_SHA256=%s\nAUTHENTICATED_PAYLOAD_SHA256=%s\nPOST_SHA256_EQUALS_PRE_SHA256=YES\nPOST_SHA256_EQUALS_AUTHENTICATED_PAYLOAD=YES\nBWRAP_HASH_EQUALITY=PASS\nBWRAP_TRANSFORMATION=%s\nBWRAP_POST_MODE=%s\nBWRAP_ADMISSION=PASS\n' \
            "$bwrap_path" "$bwrap_post_realpath" "$bwrap_post_mode" "$getcap_post_exit" "$getcap_post_exit" "$post_installed_status" "$post_installed_status" "$post_installed_version" "$post_installed_version" "$post_installed_architecture" "$post_installed_architecture" "$bwrap_post_sha256" "$bwrap_post_sha256" "$verified_bwrap_sha256" "$bwrap_transformation" "$bwrap_post_mode"
          printf 'BUBBLEWRAP_POST_MODE=%s\nBUBBLEWRAP_POST_HASH=%s\nBUBBLEWRAP_TRANSFORMATION=%s\nGETCAP_QUERY_SUCCESS=YES\nGETCAP_EMPTY=YES\n' \
            "$bwrap_post_mode" "$bwrap_post_sha256" "$bwrap_transformation"
          for system_path in /usr /lib /etc; do
            [[ -e "$system_path" ]] || fail_hold "SYSTEM_BIND_SOURCE_MISSING_${system_path#/}"
            [[ -d "$(realpath -e -- "$system_path")" ]] || fail_hold "SYSTEM_BIND_SOURCE_NOT_DIRECTORY_${system_path#/}"
          done
          if [[ -e /lib64 || -L /lib64 ]]; then
            [[ -d "$(realpath -e -- /lib64)" ]] || fail_hold "LIB64_BIND_SOURCE_INVALID"
            printf 'LIB64_BIND=present\n'
          else
            printf 'LIB64_BIND=absent\n'
          fi

          host_user_ns="$(readlink /proc/self/ns/user)" || fail_hold "HOST_USER_NAMESPACE_READ_FAILED"
          host_pid_ns="$(readlink /proc/self/ns/pid)" || fail_hold "HOST_PID_NAMESPACE_READ_FAILED"
          host_net_ns="$(readlink /proc/self/ns/net)" || fail_hold "HOST_NETWORK_NAMESPACE_READ_FAILED"
          host_ipc_ns="$(readlink /proc/self/ns/ipc)" || fail_hold "HOST_IPC_NAMESPACE_READ_FAILED"
          host_uts_ns="$(readlink /proc/self/ns/uts)" || fail_hold "HOST_UTS_NAMESPACE_READ_FAILED"
          runner_image_identity="$(awk -F= '/^(NAME|VERSION_ID|ID)=/ { gsub(/"/, "", $2); printf "%s=%s;", $1, $2 }' /etc/os-release)ImageOS=${ImageOS:-unknown};ImageVersion=${ImageVersion:-unknown};Kernel=$(uname -r)"
          printf 'RUNNER_IMAGE_IDENTITY=%s\n' "$runner_image_identity"

          critical_section=1
          admit_root_snapshot || {
            critical_section=0
            fail_hold "ROOT_ADMISSION_FAILED_PRE_CREATE"
          }
          run_live_mount_reader_admission || {
            critical_section=0
            fail_hold "MOUNT_ADMISSION_PRE_CREATE_FAILED"
          }
          mount_table_admission "$carrier" || {
            critical_section=0
            fail_hold "CARRIER_MOUNT_ADMISSION_PRE_CREATE_FAILED"
          }
          require_enoent_only "$carrier" || {
            critical_section=0
            fail_hold "CARRIER_PREEXISTENCE_NOT_ABSENT"
          }
          printf 'CARRIER_PREEXISTENCE=ABSENT\nMOUNT_CHECKPOINT=PRE_CREATE\n'
          admit_root_snapshot || {
            critical_section=0
            fail_hold "ROOT_IDENTITY_CHANGED_BEFORE_CREATE"
          }
          set +e
          /usr/bin/sudo -n /usr/bin/mkdir -m 0755 -- "$carrier"
          carrier_mkdir_status=$?
          set -e
          printf 'CARRIER_MKDIR_STATUS=%s\n' "$carrier_mkdir_status"
          if (( carrier_mkdir_status != 0 )); then
            critical_section=0
            fail_hold "CARRIER_MKDIR_FAILED"
          fi
          carrier_created_by_attempt=1
          carrier_lifecycle=CREATED_UNRECORDED
          if ! admit_carrier_snapshot; then
            critical_section=0
            fail_hold "CARRIER_IDENTITY_RECORD_FAILED"
          fi
          carrier_identity_recorded=1
          carrier_lifecycle=RECORDED
          critical_section=0
          flush_pending_signal
          printf 'CARRIER_CREATION=PASS\nCARRIER_LIFECYCLE=RECORDED\n'
          printf 'CARRIER_IDENTITY_RECORDED=PASS\nCARRIER_LIFECYCLE=RECORDED\n'
          admit_root_and_carrier || fail_hold "POST_CREATE_IDENTITY_ADMISSION_FAILED"
          mount_table_admission "$carrier" || fail_hold "MOUNT_ADMISSION_POST_CREATE_FAILED"
          printf 'MOUNT_CHECKPOINT=POST_CREATE\n'

          work="$carrier/work"
          immutable_work_path="$work"
          admit_root_and_carrier || fail_hold "BEFORE_WORK_ROOT_CARRIER_ADMISSION_FAILED"
          mount_table_admission "$carrier" || fail_hold "MOUNT_ADMISSION_BEFORE_WORK_OPERATIONS_FAILED"
          require_enoent_only "$work" || fail_hold "WORK_PREEXISTENCE_NOT_ABSENT"
          set +e
          /usr/bin/sudo -n /usr/bin/mkdir -m 0700 -- "$work"
          work_mkdir_status=$?
          set -e
          printf 'WORK_MKDIR_STATUS=%s\n' "$work_mkdir_status"
          (( work_mkdir_status == 0 )) || fail_hold "WORK_MKDIR_FAILED"
          work_identity="$(work_identity_admission 0700 ordinary)" || fail_hold "WORK_INITIAL_ADMISSION_FAILED"
          work_device_inode="$(printf '%s\n' "$work_identity" | /usr/bin/awk -F: '{ print $1 ":" $2 }')"
          printf 'WORK_CREATION=PASS\nWORK_INITIAL_MODE=0700\nWORK_IDENTITY=%s\nWORK_DEVICE_INODE=%s\n' "$work_identity" "$work_device_inode"
          apply_work_acl_once "$work" || fail_hold "WORK_ACL_MUTATION_FAILED"
          printf 'MOUNT_CHECKPOINT=BEFORE_WORK_OPERATIONS\n'
          carrier_lifecycle=ACTIVE
          printf 'CARRIER_LIFECYCLE=ACTIVE\n'
          bwrap_info_version="$archive_root/bwrap-version.stdout"
          bwrap_info_help="$archive_root/bwrap-help.stdout"
          validate_bwrap_info_after_carrier "$bwrap_info_version" "$bwrap_info_help" || fail_hold "BWRAP_INFO_ADMISSION_FAILED"

          validate_bwrap_destination_order() {
            local context="$1"
            local expected_payload="$2"
            shift 2
            local -a setup_args=( "$@" )
            local -a destinations=()
            local index=0
            local option source destination name value prior
            local separator_seen=0
            local work_bind_seen=0
            local work_chdir_seen=0
            local proc_seen=0
            local dev_seen=0
            local tmpfs_count=0
            local size_count=0
            local pair_count=0
            local size_applies_to=""
            local probe_seen=0
            local runtime_seen=0
            local runner_seen=0
            local validator_seen=0
            local writer_seen=0
            local support_seen=0
            local as_pid_1_seen=0
            local array_length="${#setup_args[@]}"
            while (( index < array_length )); do
              option="${setup_args[index]}"
              case "$option" in
                --ro-bind|--bind)
                  (( index + 2 < array_length )) || return 1
                  source="${setup_args[index + 1]}"
                  destination="${setup_args[index + 2]}"
                  [[ -n "$source" && -n "$destination" && "$destination" == /* ]] || return 1
                  case "$destination" in
                    /|/work/*) return 1 ;;
                  esac
                  case "$destination" in
                    /usr|/lib|/etc|/lib64|/probe|/runtime/blender-root|/runtime/process-runner|/runtime/validator|/runtime/writer|/runtime/support|/runtime/support/blender_validate.py|/runtime/support/blender_reopen_validate.py|/work) ;;
                    *) return 1 ;;
                  esac
                  for prior in "${destinations[@]}"; do
                    [[ "$destination" != "$prior" && "$destination" != "$prior"/* ]] || return 1
                  done
                  if [[ "$option" == --bind ]]; then
                    [[ "$destination" == /work && "$work_bind_seen" == 0 ]] || return 1
                    work_bind_seen=1
                  else
                    [[ "$destination" != /work ]] || return 1
                  fi
                  case "$destination" in
                    /probe) probe_seen=1 ;;
                    /runtime/blender-root) runtime_seen=1 ;;
                    /runtime/process-runner) runner_seen=1 ;;
                    /runtime/validator) validator_seen=1 ;;
                    /runtime/writer) writer_seen=1 ;;
                    /runtime/support|/runtime/support/blender_validate.py|/runtime/support/blender_reopen_validate.py) support_seen=1 ;;
                  esac
                  destinations+=("$destination")
                  index=$((index + 3))
                  ;;
                --proc|--dev)
                  (( index + 1 < array_length )) || return 1
                  destination="${setup_args[index + 1]}"
                  case "$option:$destination" in
                    --proc:/proc) [[ "$proc_seen" == 0 ]] || return 1; proc_seen=1 ;;
                    --dev:/dev) [[ "$dev_seen" == 0 ]] || return 1; dev_seen=1 ;;
                    *) return 1 ;;
                  esac
                  for prior in "${destinations[@]}"; do
                    [[ "$destination" != "$prior" && "$destination" != "$prior"/* ]] || return 1
                  done
                  destinations+=("$destination")
                  index=$((index + 2))
                  ;;
                --chdir)
                  (( index + 1 < array_length )) || return 1
                  [[ "${setup_args[index + 1]}" == /work && "$work_bind_seen" == 1 && "$work_chdir_seen" == 0 ]] || return 1
                  work_chdir_seen=1
                  index=$((index + 2))
                  ;;
                --size)
                  (( index + 3 < array_length )) || return 1
                  [[ "${setup_args[index + 1]}" == "$tmpfs_bytes" &&
                     "${setup_args[index + 2]}" == --tmpfs &&
                     "${setup_args[index + 3]}" == /tmp &&
                     "$size_count" == 0 &&
                     "$tmpfs_count" == 0 ]] || return 1
                  destination=/tmp
                  for prior in "${destinations[@]}"; do
                    [[ "$destination" != "$prior" &&
                       "$destination" != "$prior"/* ]] || return 1
                  done
                  destinations+=("$destination")
                  size_count=1
                  tmpfs_count=1
                  pair_count=1
                  size_applies_to=/tmp
                  index=$((index + 4))
                  ;;
                --setenv)
                  (( index + 2 < array_length )) || return 1
                  name="${setup_args[index + 1]}"
                  value="${setup_args[index + 2]}"
                  [[ -n "$value" ]] || return 1
                  case "$name" in
                    PATH|LANG|LC_ALL|HOME|EXPECTED_HOST_USER_NS|EXPECTED_HOST_PID_NS|EXPECTED_HOST_NET_NS|EXPECTED_HOST_IPC_NS|EXPECTED_HOST_UTS_NS|S8_ADMISSION_MODE) ;;
                    *) return 1 ;;
                  esac
                  index=$((index + 3))
                  ;;
                --as-pid-1)
                  [[ "$as_pid_1_seen" == 0 ]] || return 1
                  as_pid_1_seen=1
                  index=$((index + 1))
                  ;;
                --unshare-user|--unshare-net|--unshare-pid|--unshare-ipc|--unshare-uts|--disable-userns|--assert-userns-disabled|--die-with-parent|--new-session|--clearenv)
                  index=$((index + 1))
                  ;;
                --uid|--gid|--cap-drop)
                  (( index + 1 < array_length )) || return 1
                  case "$option:${setup_args[index + 1]}" in
                    --uid:65534|--gid:65534|--cap-drop:ALL) ;;
                    *) return 1 ;;
                  esac
                  index=$((index + 2))
                  ;;
                --)
                  [[ "$separator_seen" == 0 && $((index + 1)) -lt array_length ]] || return 1
                  [[ "${setup_args[index + 1]}" == "$expected_payload" ]] || return 1
                  separator_seen=1
                  break
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            [[ "$separator_seen" == 1 &&
               "$work_bind_seen" == 1 &&
               "$work_chdir_seen" == 1 &&
               "$proc_seen" == 1 &&
               "$dev_seen" == 1 &&
               "$size_count" == 1 &&
               "$tmpfs_count" == 1 &&
               "$pair_count" == 1 &&
               "$size_applies_to" == /tmp ]] || return 1
            if [[ "$context" == initial ]]; then
              [[ "$as_pid_1_seen" == 1 && "$probe_seen" == 1 && "$runtime_seen" == 0 && "$runner_seen" == 0 && "$validator_seen" == 0 && "$writer_seen" == 0 && "$support_seen" == 0 ]] || return 1
            elif [[ "$context" == staged ]]; then
              [[ "$as_pid_1_seen" == 1 && "$probe_seen" == 0 && "$runtime_seen" == 1 && "$runner_seen" == 1 && "$validator_seen" == 1 && "$writer_seen" == 1 && "$support_seen" == 1 ]] || return 1
            elif [[ "$context" == candidate ]]; then
              [[ "$as_pid_1_seen" == 0 && "$probe_seen" == 0 && "$runtime_seen" == 1 && "$runner_seen" == 1 && "$writer_seen" == 1 ]] || return 1
              (( validator_seen + support_seen <= 1 )) || return 1
            else
              return 1
            fi
            printf 'BWRAP_DESTINATION_ORDER_ADMISSION=%s\n' "$context"
            printf 'SIZE_COUNT=%s\nTMPFS_/tmp_COUNT=%s\nPAIR_COUNT=%s\nSIZE_APPLIES_TO=%s\n' "$size_count" "$tmpfs_count" "$pair_count" "$size_applies_to"
            printf 'BWRAP_SETUP_DESTINATION_INVARIANT=fresh_bwrap_owned_root+fixed_top_level_destinations_only+no_bind_destination_root+writable_/work_mounted_only_at_/work+no_bwrap_file_dir_symlink_creation_beneath_/work+no_destination_beneath_any_prior_candidate_controlled_or_writable_bind+destination_order_mechanically_validated_before_bwrap_execution\n'
          }

          destination_validator="$provision_root/s8-bwrap-destination-validator.sh"
          declare -f validate_bwrap_destination_order > "$destination_validator"
          /usr/bin/chmod 0555 -- "$destination_validator"
          /usr/bin/bash -n "$destination_validator" || fail_amendment "DESTINATION_VALIDATOR_SYNTAX"
          printf 'BWRAP_DESTINATION_VALIDATOR=%s\n' "$destination_validator"

          build_common_bwrap_args() {
            common_bwrap_args=(
              --unshare-user
              --unshare-net
              --unshare-pid
              --unshare-ipc
              --unshare-uts
              --disable-userns
              --assert-userns-disabled
              --uid 65534
              --gid 65534
              --cap-drop ALL
              --die-with-parent
              --new-session
              --clearenv
            )
            for system_path in /usr /lib /etc; do
              system_source="$(realpath -e -- "$system_path")"
              common_bwrap_args+=(--ro-bind "$system_source" "$system_path")
            done
            if [[ -e /lib64 || -L /lib64 ]]; then
              lib64_source="$(realpath -e -- /lib64)"
              common_bwrap_args+=(--ro-bind "$lib64_source" /lib64)
            fi
            common_bwrap_args+=(
              --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              --setenv LANG C.UTF-8
              --setenv LC_ALL C.UTF-8
              --setenv HOME /tmp
            )
          }

          bwrap_validator_expect() {
            local label="$1"
            local expected="$2"
            local context="$3"
            local expected_payload="$4"
            shift 4
            local status=0
            if validate_bwrap_destination_order "$context" "$expected_payload" "$@"; then
              status=0
            else
              status=$?
            fi
            if [[ "$expected" == ACCEPT ]]; then
              [[ "$status" == 0 ]] || return 1
            else
              [[ "$status" != 0 ]] || return 1
            fi
            printf 'BWRAP_GRAMMAR_CASE=%s RESULT=PASS EXPECTED=%s\n' "$label" "$expected"
          }

          bwrap_mutate_pair() {
            local mutation="$1"
            shift
            local -a original=( "$@" )
            local -a replacement=()
            local pair_index=-1
            local index
            for ((index = 0; index < ${#original[@]}; index++)); do
              if [[ "${original[index]}" == --size ]]; then
                pair_index=$index
                break
              fi
            done
            [[ "$pair_index" -ge 0 ]] || return 1
            case "$mutation" in
              SIZE_THEN_SETENV_THEN_TMPFS)
                replacement=(--size "$tmpfs_bytes" --setenv LANG C.UTF-8 --tmpfs /tmp)
                ;;
              SIZE_THEN_BIND_THEN_TMPFS)
                replacement=(--size "$tmpfs_bytes" --ro-bind /carrier/probe /probe --tmpfs /tmp)
                ;;
              SIZE_THEN_PROC_THEN_TMPFS)
                replacement=(--size "$tmpfs_bytes" --proc /proc --tmpfs /tmp)
                ;;
              SIZE_THEN_DEV_THEN_TMPFS)
                replacement=(--size "$tmpfs_bytes" --dev /dev --tmpfs /tmp)
                ;;
              SIZE_THEN_CHDIR_THEN_TMPFS)
                replacement=(--size "$tmpfs_bytes" --chdir /work --tmpfs /tmp)
                ;;
              MISSING_SIZE)
                replacement=(--tmpfs /tmp)
                ;;
              MISSING_TMPFS)
                replacement=(--size "$tmpfs_bytes")
                ;;
              DUPLICATE_SIZE)
                replacement=(--size "$tmpfs_bytes" --tmpfs /tmp --size "$tmpfs_bytes" --tmpfs /tmp)
                ;;
              DUPLICATE_TMPFS)
                replacement=(--size "$tmpfs_bytes" --tmpfs /tmp --tmpfs /tmp)
                ;;
              SIZE_WITHOUT_VALUE)
                replacement=(--size --tmpfs /tmp)
                ;;
              TMPFS_WITHOUT_DESTINATION)
                replacement=(--size "$tmpfs_bytes" --tmpfs)
                ;;
              WRONG_TMPFS_DESTINATION)
                replacement=(--size "$tmpfs_bytes" --tmpfs /var/tmp)
                ;;
              WRONG_SIZE_VALUE)
                replacement=(--size 1073741825 --tmpfs /tmp)
                ;;
              SIZE_AFTER_TMPFS)
                replacement=(--tmpfs /tmp --size "$tmpfs_bytes")
                ;;
              DUPLICATED_COMPLETE_PAIR)
                replacement=(--size "$tmpfs_bytes" --tmpfs /tmp --size "$tmpfs_bytes" --tmpfs /tmp)
                ;;
              TRUNCATED_PAIR)
                replacement=(--size "$tmpfs_bytes" --tmpfs)
                ;;
              EMPTY_SIZE_OPERAND)
                replacement=(--size "" --tmpfs /tmp)
                ;;
              EMPTY_TMPFS_DESTINATION)
                replacement=(--size "$tmpfs_bytes" --tmpfs "")
                ;;
              INTERVENING_SEPARATOR)
                replacement=(--size "$tmpfs_bytes" -- /usr/bin/sh --tmpfs /tmp)
                ;;
              INTERVENING_PERMS)
                replacement=(--size "$tmpfs_bytes" --perms 1777 --tmpfs /tmp)
                ;;
              *)
                return 1
                ;;
            esac
            BWRAP_MUTATED_ARGS=(
              "${original[@]:0:$pair_index}"
              "${replacement[@]}"
              "${original[@]:$((pair_index + 4))}"
            )
          }

          bwrap_run_029_regression() {
            local context="$1"
            local expected_payload="$2"
            shift 2
            local -a original=( "$@" )
            local -a without_size=()
            local -a mutated=()
            local size_index=-1
            local path_index=-1
            local index
            for ((index = 0; index < ${#original[@]}; index++)); do
              if [[ "${original[index]}" == --size && "$size_index" == -1 ]]; then
                size_index=$index
              fi
              if [[ "${original[index]}" == --setenv && "${original[index + 1]:-}" == PATH && "$path_index" == -1 ]]; then
                path_index=$index
              fi
            done
            [[ "$size_index" -ge 0 && "$path_index" -ge 0 && "$path_index" -lt "$size_index" ]] || return 1
            without_size=(
              "${original[@]:0:$size_index}"
              "${original[@]:$((size_index + 2))}"
            )
            mutated=(
              "${without_size[@]:0:$path_index}"
              --size "$tmpfs_bytes"
              "${without_size[@]:$path_index}"
            )
            bwrap_validator_expect RUN_029_BAD_ARGV REJECT "$context" "$expected_payload" "${mutated[@]}" || return 1
            printf 'RUN_029_%s_BAD_ARGV_REGRESSION=PASS\nRUN_029_BAD_ARGV_REGRESSION=PASS\n' "${context^^}"
          }

          run_bwrap_argv_grammar_regression() {
            local context="$1"
            local expected_payload="$2"
            shift 2
            local -a actual=( "$@" )
            local -a rejection_cases=(
              SIZE_THEN_SETENV_THEN_TMPFS
              SIZE_THEN_BIND_THEN_TMPFS
              SIZE_THEN_PROC_THEN_TMPFS
              SIZE_THEN_DEV_THEN_TMPFS
              SIZE_THEN_CHDIR_THEN_TMPFS
              MISSING_SIZE
              MISSING_TMPFS
              DUPLICATE_SIZE
              DUPLICATE_TMPFS
              SIZE_WITHOUT_VALUE
              TMPFS_WITHOUT_DESTINATION
              WRONG_TMPFS_DESTINATION
              WRONG_SIZE_VALUE
              SIZE_AFTER_TMPFS
              DUPLICATED_COMPLETE_PAIR
              TRUNCATED_PAIR
              EMPTY_SIZE_OPERAND
              EMPTY_TMPFS_DESTINATION
              INTERVENING_SEPARATOR
              INTERVENING_PERMS
            )
            local mutation
            bwrap_validator_expect "VALID_${context^^}_ARGV" ACCEPT "$context" "$expected_payload" "${actual[@]}" || return 1
            bwrap_validator_expect SIZE_IMMEDIATELY_BEFORE_TMPFS ACCEPT "$context" "$expected_payload" "${actual[@]}" || return 1
            bwrap_validator_expect VALID_PAIR_WITH_SYSTEM_BINDS_BEFORE_IT ACCEPT "$context" "$expected_payload" "${actual[@]}" || return 1
            bwrap_validator_expect VALID_PAIR_WITH_SETENV_AFTER_IT ACCEPT "$context" "$expected_payload" "${actual[@]}" || return 1
            if [[ "$context" == initial || "$context" == staged ]]; then
              bwrap_run_029_regression "$context" "$expected_payload" "${actual[@]}" || return 1
            fi
            for mutation in "${rejection_cases[@]}"; do
              bwrap_mutate_pair "$mutation" "${actual[@]}" || return 1
              bwrap_validator_expect "$mutation" REJECT "$context" "$expected_payload" "${BWRAP_MUTATED_ARGS[@]}" || return 1
            done
            case "$context" in
              initial)
                printf 'VALID_INITIAL_ARGV=PASS\nINITIAL_ARGV_REGRESSION=PASS\n'
                ;;
              staged)
                printf 'VALID_STAGED_ARGV=PASS\nSTAGED_ARGV_REGRESSION=PASS\n'
                ;;
              candidate)
                printf 'VALID_CANDIDATE_ARGV=PASS\nCANDIDATE_ARGV_REGRESSION=PASS\n'
                ;;
              *)
                return 1
                ;;
            esac
            printf 'BWRAP_ARGV_GRAMMAR_REGRESSION=PASS\n'
          }

          run_bwrap_parser_proof() {
            local context="$1"
            local expected_status="$2"
            local stdout_path="$3"
            local stderr_path="$4"
            local proof_status=0
            [[ ! -e "$stdout_path" && ! -L "$stdout_path" && ! -e "$stderr_path" && ! -L "$stderr_path" ]] || fail_hold "BWRAP_GRAMMAR_PROOF_OUTPUT_PATH_NOT_FRESH"
            [[ -z "$candidate_marker_file" ]] || fail_hold "CANDIDATE_MARKER_PREEXISTS_BEFORE_GRAMMAR_PROOF"
            admit_before_bwrap "$context" || fail_hold "BWRAP_GRAMMAR_PROOF_ADMISSION_FAILED_${context}"
            set +e
            if [[ "$context" == bwrap_bad_grammar ]]; then
              run_tracked_command /usr/bin/sudo -n /usr/bin/bwrap \
                --size "$tmpfs_bytes" \
                --setenv LANG C.UTF-8 \
                --tmpfs /tmp \
                --help >"$stdout_path" 2>"$stderr_path"
            else
              run_tracked_command /usr/bin/sudo -n /usr/bin/bwrap \
                --size "$tmpfs_bytes" \
                --tmpfs /tmp \
                --setenv LANG C.UTF-8 \
                --help >"$stdout_path" 2>"$stderr_path"
            fi
            proof_status=$?
            set -e
            printf 'BWRAP_GRAMMAR_PROOF_CONTEXT=%s\nEXIT_STATUS=%s\n' "$context" "$proof_status"
            [[ "$proof_status" == "$expected_status" ]] || fail_hold "BWRAP_GRAMMAR_PROOF_EXIT_STATUS_${context}"
            if [[ "$context" == bwrap_bad_grammar ]]; then
              grep -F -- '--size must be followed by --tmpfs' "$stderr_path" >/dev/null || fail_hold "BWRAP_BAD_GRAMMAR_DIAGNOSTIC_MISSING"
              printf 'BAD_GRAMMAR_STATUS=%s\nEXPECTED_SIZE_FOLLOWING_DIAGNOSTIC=YES\nBWRAP_BAD_GRAMMAR_PROOF=PASS\n' "$proof_status"
            else
              grep -F -- 'usage:' "$stdout_path" >/dev/null || fail_hold "BWRAP_GOOD_GRAMMAR_HELP_OUTPUT_MISSING"
              if grep -F -- '--size must be followed by --tmpfs' "$stdout_path" "$stderr_path" >/dev/null 2>&1; then
                fail_hold "BWRAP_GOOD_GRAMMAR_DIAGNOSTIC_PRESENT"
              fi
              printf 'GOOD_GRAMMAR_STATUS=%s\nEXPECTED_HELP_OUTPUT=YES\nSIZE_FOLLOWING_DIAGNOSTIC=NO\nBWRAP_GOOD_GRAMMAR_PROOF=PASS\n' "$proof_status"
            fi
            printf 'CANDIDATE_MARKER_CREATED=NO\nAPPARMOR_MUTATION=NO\nSYSCTL_MUTATION=NO\nPAYLOAD_EXECUTION=NO\n'
          }

          run_bwrap_parser_proof bwrap_bad_grammar 1 "$archive_root/bwrap-bad-grammar.stdout" "$archive_root/bwrap-bad-grammar.stderr"
          run_bwrap_parser_proof bwrap_good_grammar 0 "$archive_root/bwrap-good-grammar.stdout" "$archive_root/bwrap-good-grammar.stderr"
          printf 'GOOD_GRAMMAR_CONTROL=CAPABILITY_PROBE_NEXT\n'

          iproute2_image_version_is_allowed() {
            case "$1" in
              20260907.300.1|20260920.314.1) return 0 ;;
              *) return 1 ;;
            esac
          }

          iproute2_metadata_query() {
            case "$1" in
              status) /usr/bin/dpkg-query -W -f='${Status}' iproute2 2>/dev/null ;;
              version) /usr/bin/dpkg-query -W -f='${Version}' iproute2 2>/dev/null ;;
              architecture) /usr/bin/dpkg-query -W -f='${Architecture}' iproute2 2>/dev/null ;;
              *) return 1 ;;
            esac
          }

          iproute2_capture_metadata() {
            local ps pv pa
            ps="$(iproute2_metadata_query status)" || return 1
            pv="$(iproute2_metadata_query version)" || return 1
            pa="$(iproute2_metadata_query architecture)" || return 1
            [[ -n "$ps" && -n "$pv" && -n "$pa" ]] || return 1
            IPROUTE2_PACKAGE_STATUS="$ps"
            IPROUTE2_PACKAGE_VERSION="$pv"
            IPROUTE2_PACKAGE_ARCHITECTURE="$pa"
          }

          iproute2_host_metadata_query() {
            case "$1" in
              ID|VERSION_ID|VERSION_CODENAME)
                /usr/bin/awk -v key="$1" -F= '
                  $1 == key {
                    count++
                    value = substr($0, index($0, "=") + 1)
                    if (value ~ /^".*"$/) value = substr(value, 2, length(value) - 2)
                  }
                  END { if (count != 1 || value == "") exit 1; print value }
                ' /etc/os-release
                ;;
              DPKG_ARCH) /usr/bin/dpkg --print-architecture ;;
              KERNEL_RELEASE) /usr/bin/cat /proc/sys/kernel/osrelease ;;
              *) return 1 ;;
            esac
          }

          iproute2_capture_host_metadata() {
            local id version_id version_codename dpkg_arch kernel_release
            id="$(iproute2_host_metadata_query ID)" || return 1
            version_id="$(iproute2_host_metadata_query VERSION_ID)" || return 1
            version_codename="$(iproute2_host_metadata_query VERSION_CODENAME)" || return 1
            dpkg_arch="$(iproute2_host_metadata_query DPKG_ARCH)" || return 1
            kernel_release="$(iproute2_host_metadata_query KERNEL_RELEASE)" || return 1
            [[ -n "$id" && -n "$version_id" && -n "$version_codename" && -n "$dpkg_arch" && -n "$kernel_release" ]] || return 1
            IPROUTE2_HOST_ID="$id"
            IPROUTE2_HOST_VERSION_ID="$version_id"
            IPROUTE2_HOST_VERSION_CODENAME="$version_codename"
            IPROUTE2_HOST_DPKG_ARCH="$dpkg_arch"
            IPROUTE2_HOST_KERNEL_RELEASE="$kernel_release"
          }

          iproute2_snapshot_fingerprint_payload() {
            printf '%s\n' "$@"
          }

          iproute2_sha256_command() {
            /usr/bin/sha256sum --text
          }

          iproute2_fingerprint_sha256() {
            local payload="$1" raw command_status fingerprint
            raw="$(
              iproute2_sha256_command <<< "$payload"
              command_status=$?
              printf '\001'
              exit "$command_status"
            )" || return 1
            [[ "$raw" == *$'\001' ]] || return 1
            raw="${raw%$'\001'}"
            [[ "$raw" == *$'\n' ]] || return 1
            raw="${raw%$'\n'}"
            [[ "$raw" =~ ^([A-Fa-f0-9]{64})[[:space:]][[:space:]]-$ ]] || return 1
            fingerprint="${BASH_REMATCH[1]}"
            [[ "$fingerprint" =~ ^[A-Fa-f0-9]{64}$ ]] || return 1
            printf '%s\n' "$fingerprint"
          }

          iproute2_accept_fingerprint() {
            local payload="$1" fp
            fp="$(iproute2_fingerprint_sha256 "$payload")" || return 1
            [[ "$fp" =~ ^[A-Fa-f0-9]{64}$ ]] || return 1
            if [[ -z "${iproute2_admission_baseline:-}" ]]; then
              iproute2_admission_baseline="$fp"
              readonly iproute2_admission_baseline
            else
              [[ "$fp" == "$iproute2_admission_baseline" ]] || return 1
            fi
          }

          iproute2_contract_values_valid() {
            local rl="$1" iv="$2" ios="$3" ps="$4" pv="$5" pa="$6" dm="$7" fm="$8" cm="$9"
            local cc="${10}" th="${11}" acl="${12}" alias="${13}" same_inode="${14}"
            local dq="${15}" dqe="${16}" ver="${17}" vere="${18}" id="${19}" version_id="${20}"
            local version_codename="${21}" dpkg_arch="${22}" kernel_release="${23}"
            [[ "$rl" == ubuntu-24.04 && "$ios" == ubuntu24 ]] || return 1
            iproute2_image_version_is_allowed "$iv" || return 1
            [[ "$ps" == 'install ok installed' && "$pv" == 6.1.0-1ubuntu6.4 && "$pa" == amd64 ]] || return 1
            [[ "$dm" == 'directory|755|0:0' && "$fm" == 'regular file|644|0:0' && "$cm" == 'directory|755|0:0' ]] || return 1
            [[ "$cc" == 0 && "$th" == 08c418b8469951cd5c59da91e4b116cd62cb125478dfac12e5f5067d4d07ad3f ]] || return 1
            [[ "$acl" == 1 && "$alias" == 1 && "$same_inode" == 1 && "$dq" == 1 && "$dqe" == 1 && "$ver" == 1 && "$vere" == 1 ]] || return 1
            [[ "$id" == ubuntu && "$version_id" == 24.04 && "$version_codename" == noble && "$dpkg_arch" == amd64 && "$kernel_release" == 6.17.0-1022-azure ]] || return 1
          }

          iproute2_admit_values() {
            (( $# == 27 )) || return 1
            local br="${24}" ur="${25}" bd="${26}" ud="${27}" fingerprint_payload
            iproute2_contract_values_valid "${@:1:23}" || return 1
            [[ "$br" == /usr/bin/ip && "$ur" == /usr/bin/ip && "$bd" == "$ud" ]] || return 1
            fingerprint_payload="$(iproute2_snapshot_fingerprint_payload "$@")" || return 1
            iproute2_accept_fingerprint "$fingerprint_payload" || return 1
          }

          admit_iproute2_snapshot() {
            local phase="$1"
            local ps pv pa dm fm cm cc th acl=1 alias=0 same_inode=0 br ur bd ud
            local dm_value fm_value cm_value dout derr vout verr ds vs
            local id version_id version_codename dpkg_arch kernel_release
            [[ "${S8_RUNNER_LABEL:-}" == ubuntu-24.04 && "${ImageOS:-}" == ubuntu24 ]] || return 1
            iproute2_image_version_is_allowed "${ImageVersion:-}" || return 1
            iproute2_capture_metadata || return 1
            ps="$IPROUTE2_PACKAGE_STATUS"
            pv="$IPROUTE2_PACKAGE_VERSION"
            pa="$IPROUTE2_PACKAGE_ARCHITECTURE"
            iproute2_capture_host_metadata || return 1
            id="$IPROUTE2_HOST_ID"
            version_id="$IPROUTE2_HOST_VERSION_ID"
            version_codename="$IPROUTE2_HOST_VERSION_CODENAME"
            dpkg_arch="$IPROUTE2_HOST_DPKG_ARCH"
            kernel_release="$IPROUTE2_HOST_KERNEL_RELEASE"
            [[ -d /etc/iproute2 && ! -L /etc/iproute2 && -f /etc/iproute2/rt_tables && ! -L /etc/iproute2/rt_tables && -d /etc/iproute2/rt_tables.d && ! -L /etc/iproute2/rt_tables.d ]] || return 1
            dm_value="$(/usr/bin/stat -c '%a|%u:%g' -- /etc/iproute2)" || return 1
            fm_value="$(/usr/bin/stat -c '%a|%u:%g' -- /etc/iproute2/rt_tables)" || return 1
            cm_value="$(/usr/bin/stat -c '%a|%u:%g' -- /etc/iproute2/rt_tables.d)" || return 1
            dm="directory|$dm_value"
            fm="regular file|$fm_value"
            cm="directory|$cm_value"
            ordinary_acl_is_exact /etc/iproute2 0755 || acl=0
            ordinary_acl_is_exact /etc/iproute2/rt_tables 0644 || acl=0
            ordinary_acl_is_exact /etc/iproute2/rt_tables.d 0755 || acl=0
            cc="$(/usr/bin/find -P /etc/iproute2/rt_tables.d -mindepth 1 -maxdepth 1 -name '*.conf' -printf '.' | /usr/bin/wc -c)" || return 1
            th="$(/usr/bin/sha256sum -- /etc/iproute2/rt_tables | /usr/bin/awk '{print $1}')" || return 1
            [[ -x /usr/bin/ip && -f /usr/bin/ip ]] || return 1
            br="$(/usr/bin/readlink -e -- /bin/ip)" || return 1
            ur="$(/usr/bin/readlink -e -- /usr/bin/ip)" || return 1
            [[ "$br" == "$ur" && "$ur" == /usr/bin/ip ]] || return 1
            alias=1
            bd="$(/usr/bin/stat -Lc '%d:%i' -- /bin/ip)" || return 1
            ud="$(/usr/bin/stat -Lc '%d:%i' -- /usr/bin/ip)" || return 1
            [[ "$bd" == "$ud" ]] || return 1
            same_inode=1
            dout="$archive_root/ip-${phase}.dpkg.stdout"
            derr="$archive_root/ip-${phase}.dpkg.stderr"
            vout="$archive_root/ip-${phase}.version.stdout"
            verr="$archive_root/ip-${phase}.version.stderr"
            /usr/bin/rm -f -- "$dout" "$derr" "$vout" "$verr"
            set +e
            /usr/bin/dpkg-query -S -- /bin/ip >"$dout" 2>"$derr"
            ds=$?
            /usr/bin/ip -Version >"$vout" 2>"$verr"
            vs=$?
            set -e
            [[ "$ds" == 0 && "$vs" == 0 ]] || return 1
            [[ ! -s "$derr" ]] && dqe=1
            [[ ! -s "$verr" ]] && vere=1
            if printf 'iproute2: /bin/ip\n' | /usr/bin/cmp --silent - "$dout"; then dq=1; fi
            if printf 'ip utility, iproute2-6.1.0, libbpf 1.3.0\n' | /usr/bin/cmp --silent - "$vout"; then ver=1; fi
            iproute2_admit_values "${S8_RUNNER_LABEL:-}" "${ImageVersion:-}" "${ImageOS:-}" "$ps" "$pv" "$pa" "$dm" "$fm" "$cm" "$cc" "$th" "$acl" "$alias" "$same_inode" "$dq" "$dqe" "$ver" "$vere" "$id" "$version_id" "$version_codename" "$dpkg_arch" "$kernel_release" "$br" "$ur" "$bd" "$ud" || return 1
            /usr/bin/rm -f -- "$dout" "$derr" "$vout" "$verr"
            printf 'IMAGE_VERSION_ADMISSION=PASS\nIMAGE_VERSION=%s\nHOST_IDENTITY_ADMISSION=PASS\nHOST_ID=%s\nHOST_VERSION_ID=%s\nHOST_VERSION_CODENAME=%s\nHOST_DPKG_ARCH=%s\nHOST_KERNEL_RELEASE=%s\nIPROUTE2_ADMISSION_%s=PASS\n' "${ImageVersion:-}" "$id" "$version_id" "$version_codename" "$dpkg_arch" "$kernel_release" "$phase"
          }

          validate_capability_ip_paths() {
            local script="$1"
            [[ "$script" == *'/usr/bin/ip -j -Numeric -details -4 route show table all'* ]] || return 1
            [[ "$script" == *'/usr/bin/ip -j -Numeric -details -6 route show table all'* ]] || return 1
            [[ "$script" != *'/usr/sbin/ip '* && "$script" != *' /bin/ip '* && "$script" != *'command -v'* ]] || return 1
          }

          validate_route_evidence() {
            local mode="$1"
            local v4="$work/.s8-${mode}-route-v4.json" v6="$work/.s8-${mode}-route-v6.json"
            local e4="$work/.s8-${mode}-route-v4.stderr" e6="$work/.s8-${mode}-route-v6.stderr"
            [[ -f "$v4" && ! -L "$v4" && -f "$v6" && ! -L "$v6" && -f "$e4" && ! -L "$e4" && -f "$e6" && ! -L "$e6" && ! -s "$e4" && ! -s "$e6" ]] || return 1
            /usr/bin/python3 - "$v4" "$v6" <<'PY'
          import json, pathlib, re, sys
          allowed={"type","dst","src","gateway","via","dev","protocol","scope","prefsrc","metric","table","flags","mtu","advmss","hoplimit","pref","expires","features","nhid","uid","error","cacheinfo","newdst","encap","weight","nexthops","tos","realm","quickack","congctl","rto_min","initcwnd","initrwnd","fastopen_no_cookie"}
          types={"unicast","local","broadcast","multicast","unreachable","prohibit","blackhole","throw","anycast"}
          numeric_types={"1":"unicast","2":"local","3":"broadcast","4":"anycast","5":"multicast","6":"blackhole","7":"unreachable","8":"prohibit","9":"throw"}
          blocked={"unreachable","prohibit","blackhole","throw"}
          numeric=re.compile(r"^[1-9][0-9]*$")
          def hook(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError("duplicate key")
                  out[k]=v
              return out
          def canonical_route_type(value):
              if not isinstance(value,str): raise SystemExit("unsupported route type")
              value=numeric_types.get(value,value)
              if value not in types: raise SystemExit("unsupported route type")
              return value
          for path in sys.argv[1:]:
              try: routes=json.loads(pathlib.Path(path).read_bytes().decode("utf-8"),object_pairs_hook=hook)
              except Exception as exc: raise SystemExit(f"invalid route json: {exc}")
              if not isinstance(routes,list): raise SystemExit("route top level")
              for route in routes:
                  if not isinstance(route,dict) or set(route)-allowed: raise SystemExit("unsupported route structure")
                  table=route.get("table")
                  if not isinstance(table,str) or not numeric.fullmatch(table): raise SystemExit("route table identity")
                  route_type=canonical_route_type(route.get("type","unicast"))
                  dev=route.get("dev")
                  if dev is not None and (not isinstance(dev,str) or not dev): raise SystemExit("invalid route device")
                  flags=route.get("flags",[])
                  if not isinstance(flags,list) or any(not isinstance(flag,str) for flag in flags): raise SystemExit("invalid flags")
                  if route_type not in blocked and dev!="lo": raise SystemExit("non-loopback routable path admitted")
          print("NETWORK_ROUTE_RESULT=PASS")
          PY
            local route_status=$?
            (( route_status == 0 )) || return 1
            /usr/bin/rm -f -- "$v4" "$v6" "$e4" "$e6"
            printf 'ROUTE_EVIDENCE_%s=PASS\n' "$mode"
          }

          run_route_parser_regressions() {
            local regression_root route_type status
            regression_root="$(/usr/bin/mktemp -d)" || return 1
            set +e
            (
              set -Eeuo pipefail
              work="$regression_root"
              run049_v4='[{"type":"2","dst":"127.0.0.0/8","dev":"lo","table":"255","protocol":"2","scope":"254","prefsrc":"127.0.0.1","flags":[]},{"type":"2","dst":"127.0.0.1","dev":"lo","table":"255","protocol":"2","scope":"254","prefsrc":"127.0.0.1","flags":[]},{"type":"3","dst":"127.255.255.255","dev":"lo","table":"255","protocol":"2","scope":"253","prefsrc":"127.0.0.1","flags":[]}]'
              run049_v6='[{"type":"2","dst":"::1","dev":"lo","table":"255","protocol":"2","scope":"0","metric":0,"flags":[],"pref":"medium"}]'
              local_v4='[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]'
              local_v6='[{"type":"2","dst":"::1","dev":"lo","table":"255","flags":[]}]'

              write_route_case() {
                local case_mode="$1" v4_json="$2" v6_json="$3" stderr_text=""
                if (( $# >= 4 )); then stderr_text="$4"; fi
                printf '%s' "$v4_json" > "$work/.s8-$case_mode-route-v4.json"
                printf '%s' "$v6_json" > "$work/.s8-$case_mode-route-v6.json"
                printf '%s' "$stderr_text" > "$work/.s8-$case_mode-route-v4.stderr"
                : > "$work/.s8-$case_mode-route-v6.stderr"
              }

              clear_route_case() {
                local case_mode="$1"
                /usr/bin/rm -f -- "$work/.s8-$case_mode-route-v4.json" "$work/.s8-$case_mode-route-v6.json" "$work/.s8-$case_mode-route-v4.stderr" "$work/.s8-$case_mode-route-v6.stderr"
              }

              expect_route_accept() {
                local case_mode="$1" v4_json="$2" v6_json="$3"
                write_route_case "$case_mode" "$v4_json" "$v6_json"
                if ! validate_route_evidence "$case_mode"; then
                  clear_route_case "$case_mode"
                  return 1
                fi
                clear_route_case "$case_mode"
                printf 'ROUTE_ACCEPT_%s=PASS\n' "$case_mode"
              }

              expect_route_reject() {
                local case_mode="$1" v4_json="$2" v6_json="$3" stderr_text=""
                if (( $# >= 4 )); then stderr_text="$4"; fi
                write_route_case "$case_mode" "$v4_json" "$v6_json" "$stderr_text"
                if validate_route_evidence "$case_mode"; then
                  clear_route_case "$case_mode"
                  return 1
                fi
                clear_route_case "$case_mode"
                printf 'ROUTE_REJECT_%s=PASS\n' "$case_mode"
              }

              expect_route_accept RUN049_EXACT "$run049_v4" "$run049_v6"
              printf 'RUN049_EXACT_ROUTE_EVIDENCE_REGRESSION=PASS\n'
              printf 'R29_RUN049_EXACT_ROUTE_EVIDENCE=PASS\n'
              expect_route_accept NUMERIC_LOCAL "$local_v4" "$local_v6"
              broadcast_v4='[{"type":"3","dst":"127.255.255.255","dev":"lo","table":"255","flags":[]}]'
              broadcast_v6="$local_v6"
              expect_route_accept NUMERIC_BROADCAST "$broadcast_v4" "$broadcast_v6"
              for route_type in 1 4 5; do
                loopback_route="$(printf '[{"type":"%s","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$route_type")"
                expect_route_accept "NUMERIC_LOOPBACK_$route_type" "$loopback_route" "$local_v6"
              done
              expect_route_accept TEXTUAL_LOCAL '[{"type":"local","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              expect_route_accept TEXTUAL_UNICAST_LOOPBACK '[{"type":"unicast","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              printf 'NUMERIC_ROUTE_TYPE_POSITIVE_CONTROLS=PASS\n'
              printf 'TEXTUAL_ROUTE_TYPE_COMPATIBILITY=PASS\n'

              routable_unicast='[{"type":"1","dst":"192.0.2.0/24","dev":"eth0","table":"255","flags":[]}]'
              expect_route_reject NUMERIC_UNICAST_NON_LOOPBACK "$routable_unicast" "$local_v6"
              printf 'R17_NON_LOOPBACK_ROUTE=REJECT\n'
              for route_type in 0 10 11 99; do
                invalid_numeric="$(printf '[{"type":"%s","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$route_type")"
                expect_route_reject "NUMERIC_UNSUPPORTED_$route_type" "$invalid_numeric" "$local_v6"
              done
              expect_route_reject INTEGER_TYPE '[{"type":2,"dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              expect_route_reject UNKNOWN_TEXT_TYPE '[{"type":"bogus","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              expect_route_reject EMPTY_TYPE '[{"type":"","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              expect_route_reject MALFORMED_TYPE '[{"type":[],"dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              for route_type in 6 7 8 9; do
                blocked_route="$(printf '[{"type":"%s","dst":"192.0.2.1","dev":"eth0","table":"255","flags":[]}]' "$route_type")"
                expect_route_accept "NUMERIC_BLOCKED_$route_type" "$blocked_route" "$blocked_route"
              done
              printf 'R27_ROUTE_POSITIVE_CONTROLS=PASS\n'
              printf 'NUMERIC_ROUTE_TYPE_NEGATIVE_CONTROLS=PASS\n'

              expect_route_reject TABLE_STRING_ZERO '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"0","flags":[]}]' "$local_v6"
              expect_route_reject TABLE_INTEGER_ZERO '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":0,"flags":[]}]' "$local_v6"
              expect_route_reject TABLE_MAIN '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"main","flags":[]}]' "$local_v6"
              expect_route_reject TABLE_LOCAL '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"local","flags":[]}]' "$local_v6"
              expect_route_reject TABLE_NULL '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":null,"flags":[]}]' "$local_v6"
              expect_route_reject UNKNOWN_KEY '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"255","flags":[],"unexpected":true}]' "$local_v6"
              expect_route_reject DUPLICATE_KEY '[{"type":"2","dst":"127.0.0.1","dev":"lo","table":"255","flags":[],"flags":[]}]' "$local_v6"
              expect_route_reject MALFORMED_JSON 'not-json' "$local_v6"
              expect_route_reject IPV4_VALID_V6_INVALID "$local_v4" '[{"type":"99","dst":"::1","dev":"lo","table":"255","flags":[]}]'
              expect_route_reject IPV4_INVALID_V6_VALID '[{"type":"99","dst":"127.0.0.1","dev":"lo","table":"255","flags":[]}]' "$local_v6"
              expect_route_reject NONEMPTY_STDERR "$local_v4" "$local_v6" 'route stderr is not accepted'
              printf 'STRICT_ROUTE_POLICY_REVALIDATION=PASS\nNUMERIC_ROUTE_TYPE_CANONICALISATION=PASS\n'
              printf 'R28_ROUTE_NEGATIVE_CONTROLS=PASS\n'
            )
            status=$?
            set -e
            /usr/bin/rm -rf -- "$regression_root"
            return "$status"
          }

          iproute2_positive_controls() {
            run_iproute2_contract_regressions || return 1
            run_iproute2_acquisition_regressions || return 1
            printf 'IPROUTE2_POSITIVE_CONTROLS=PASS\n'
          }

          run_iproute2_contract_regressions() {
            local -a stable rollout bad stable_fp rollout_fp drift_fp bad_fp
            local phase
            stable=(ubuntu-24.04 20260907.300.1 ubuntu24 'install ok installed' 6.1.0-1ubuntu6.4 amd64 'directory|755|0:0' 'regular file|644|0:0' 'directory|755|0:0' 0 08c418b8469951cd5c59da91e4b116cd62cb125478dfac12e5f5067d4d07ad3f 1 1 1 1 1 1 1 ubuntu 24.04 noble amd64 6.17.0-1022-azure)
            rollout=("${stable[@]}")
            rollout[1]=20260920.314.1
            stable_fp=("${stable[@]}" /usr/bin/ip /usr/bin/ip 8:1234 8:1234)
            rollout_fp=("${rollout[@]}" /usr/bin/ip /usr/bin/ip 8:1234 8:1234)

            ( iproute2_admission_baseline=''; iproute2_admit_values "${stable_fp[@]}" ) || return 1
            printf 'R1_STABLE_IMAGE_EXACT_EVIDENCE=ACCEPT\n'
            ( iproute2_admission_baseline=''; iproute2_admit_values "${rollout_fp[@]}" ) || return 1
            printf 'R2_ROLLOUT_IMAGE_EXACT_EVIDENCE=ACCEPT\n'
            iproute2_image_version_is_allowed 20260907.300.1 && iproute2_image_version_is_allowed 20260920.314.1 || return 1
            printf 'DUAL_BOUNDED_IMAGE_ALLOWLIST=PASS\n'

            expect_iproute2_reject() {
              local label="$1"
              local -a values
              shift
              values=("$@")
              if (( ${#values[@]} == 23 )); then values+=(/usr/bin/ip /usr/bin/ip 8:1234 8:1234); fi
              if iproute2_admit_values "${values[@]}"; then return 1; fi
              printf '%s=REJECT\n' "$label"
            }

            bad=("${stable[@]}"); bad[1]=20260920.314.2
            expect_iproute2_reject R3_UNKNOWN_IMAGE "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[1]=''
            expect_iproute2_reject R4_MISSING_IMAGE "${bad[@]}" || return 1
            printf 'UNKNOWN_IMAGE_REJECTION=PASS\n'

            bad=("${stable[@]}"); bad[4]=6.1.0-1ubuntu6.3
            expect_iproute2_reject R5_WRONG_PACKAGE_VERSION "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[5]=arm64
            expect_iproute2_reject R6_WRONG_PACKAGE_ARCHITECTURE "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[10]=deadbeef
            expect_iproute2_reject R7_WRONG_RT_TABLES_HASH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[9]=1
            expect_iproute2_reject R8_EXTRA_CONF "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[11]=0
            expect_iproute2_reject R9_ACL_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[6]='directory|775|0:0'
            expect_iproute2_reject R10_MODE_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[7]='regular file|644|0:4'
            expect_iproute2_reject R10_OWNER_MISMATCH "${bad[@]}" || return 1
            bad_fp=("${stable[@]}" /usr/bin/ip /usr/local/bin/ip 8:1234 8:1234)
            expect_iproute2_reject R11_ALIAS_MISMATCH "${bad_fp[@]}" || return 1
            bad_fp=("${stable[@]}" /usr/bin/ip /usr/bin/ip 8:1234 8:5678)
            expect_iproute2_reject R12_DEVICE_INODE_MISMATCH "${bad_fp[@]}" || return 1
            bad=("${stable[@]}"); bad[14]=0
            expect_iproute2_reject R13_WRONG_DPKG_STDOUT "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[15]=0
            expect_iproute2_reject R14_DPKG_STDERR "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[16]=0
            expect_iproute2_reject R15_WRONG_IP_VERSION_STDOUT "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[17]=0
            expect_iproute2_reject R16_IP_VERSION_STDERR "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[18]=ubuntu-22.04
            expect_iproute2_reject R18_ID_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[19]=22.04
            expect_iproute2_reject R19_VERSION_ID_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[20]=jammy
            expect_iproute2_reject R20_VERSION_CODENAME_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[21]=arm64
            expect_iproute2_reject R21_DPKG_ARCH_MISMATCH "${bad[@]}" || return 1
            bad=("${stable[@]}"); bad[22]=6.17.0-1021-azure
            expect_iproute2_reject R22_KERNEL_MISMATCH "${bad[@]}" || return 1

            (
              iproute2_admission_baseline=''
              local payload phase
              payload="$(iproute2_snapshot_fingerprint_payload "${stable_fp[@]}")" || exit 1
              iproute2_contract_values_valid "${stable[@]}" || exit 1
              iproute2_accept_fingerprint "$payload" || exit 1
              for phase in initial_pre_probe initial_post_reap staged_pre_probe staged_post_reap post_candidate_reap; do
                iproute2_accept_fingerprint "$payload" || exit 1
              done
            ) || return 1
            drift_fp=("${stable_fp[@]}")
            drift_fp[25]=8:5678
            drift_fp[26]=8:5678
            (
              iproute2_admission_baseline=''
              iproute2_admit_values "${stable_fp[@]}" || exit 1
              if iproute2_admit_values "${drift_fp[@]}"; then exit 1; fi
            ) || return 1
            printf 'R23_BASELINE_FIELD_DRIFT=REJECT\nBASELINE_NON_RESETTABLE=PASS\n'
            bad=("${stable[@]}"); bad[18]=ubuntu-24.04
            drift_fp=("${bad[@]}" /usr/bin/ip /usr/bin/ip 8:1234 8:1234)
            (
              iproute2_admission_baseline=''
              iproute2_admit_values "${stable_fp[@]}" || exit 1
              if iproute2_admit_values "${drift_fp[@]}"; then exit 1; fi
            ) || return 1
            printf 'MIDRUN_IDENTITY_DRIFT_REJECTION=PASS\n'

            (
              iproute2_admission_baseline=''
              iproute2_admit_values "${stable_fp[@]}" || exit 1
              if iproute2_admit_values "${rollout_fp[@]}"; then exit 1; fi
            ) || return 1
            printf 'R24_STABLE_TO_ROLLOUT_IMAGE_SWITCH=REJECT\n'
            (
              iproute2_admission_baseline=''
              iproute2_admit_values "${rollout_fp[@]}" || exit 1
              if iproute2_admit_values "${stable_fp[@]}"; then exit 1; fi
            ) || return 1
            printf 'R24_ROLLOUT_TO_STABLE_IMAGE_SWITCH=REJECT\nIMAGE_SWITCH_REJECTION=PASS\n'
            if (
              iproute2_admission_baseline=''
              iproute2_admit_values "${stable_fp[@]}" || exit 1
              iproute2_admission_baseline=''
            ) 2>/dev/null; then return 1; fi
            printf 'R25_BASELINE_RESET_ATTEMPT=REJECT\n'
          }

          run_iproute2_acquisition_regressions() {
            local valid short long nonhex raw
            local -a malformed
            valid=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            short="${valid:0:63}"
            long="${valid}0"
            nonhex="g${valid:1}"
            (
              iproute2_metadata_query() {
                local field="$1" value
                case "$field" in
                  status) value='install ok installed' ;;
                  version) value=6.1.0-1ubuntu6.4 ;;
                  architecture) value=amd64 ;;
                  *) return 1 ;;
                esac
                [[ "${IPROUTE2_TEST_METADATA_MISSING:-}" == "$field" ]] && return 0
                printf '%s\n' "$value"
                [[ "${IPROUTE2_TEST_METADATA_FAILURE:-}" == "$field" ]] && return 43
                return 0
              }
              iproute2_capture_metadata || exit 1
              [[ "$IPROUTE2_PACKAGE_STATUS" == 'install ok installed' && "$IPROUTE2_PACKAGE_VERSION" == 6.1.0-1ubuntu6.4 && "$IPROUTE2_PACKAGE_ARCHITECTURE" == amd64 ]] || exit 1
              local field
              for field in status version architecture; do
                if IPROUTE2_TEST_METADATA_FAILURE="$field" iproute2_capture_metadata; then exit 1; fi
                if IPROUTE2_TEST_METADATA_MISSING="$field" iproute2_capture_metadata; then exit 1; fi
              done
            ) || return 1
            printf 'METADATA_ACQUISITION_FAIL_CLOSED=PASS\n'

            malformed=(
              ''
              "$short  -"
              "$long  -"
              "$nonhex  -"
              " $valid  -"
              "$valid  - "
              "${valid:0:32} ${valid:32}  -"
              "$valid  - extra"
              "$valid  -"$'\n'"$valid  -"
              "$valid"
              "${valid}suffix  -"
            )
            (
              iproute2_sha256_command() {
                printf '%s' "${IPROUTE2_TEST_SHA_RAW:-}"
                [[ "${IPROUTE2_TEST_SHA_FAILURE:-}" != 1 ]] || return 47
                return 0
              }
              local raw
              for raw in "${malformed[@]}"; do
                (
                  iproute2_admission_baseline=''
                  if IPROUTE2_TEST_SHA_RAW="$raw" iproute2_accept_fingerprint regression-payload; then exit 1; fi
                  [[ -z "${iproute2_admission_baseline:-}" ]] || exit 1
                ) || exit 1
              done
              (
                iproute2_admission_baseline=''
                if IPROUTE2_TEST_SHA_RAW="${valid}  -"$'\n' IPROUTE2_TEST_SHA_FAILURE=1 iproute2_accept_fingerprint regression-payload; then exit 1; fi
                [[ -z "${iproute2_admission_baseline:-}" ]] || exit 1
              ) || exit 1
              (
                iproute2_admission_baseline=''
                IPROUTE2_TEST_SHA_RAW="${valid}  -"$'\n' iproute2_accept_fingerprint regression-payload || exit 1
                [[ "$iproute2_admission_baseline" == "$valid" ]] || exit 1
              ) || exit 1
            ) || return 1
            printf 'FINGERPRINT_ACQUISITION_FAIL_CLOSED=PASS\nFINGERPRINT_CANONICAL_SHA256_GUARD=PASS\nR26_ACQUISITION_FAILURE_MATRIX=PASS\n'
          }

          read -r -d '' capability_script <<'SH' || true
          set -Eeuo pipefail
          status_file=/proc/self/status
          printf 'SANDBOX_UID=%s\nSANDBOX_GID=%s\n' "$(id -u)" "$(id -g)"
          test "$(id -u)" = 65534
          test "$(id -g)" = 65534
          printf 'SANDBOX_UID_GID=65534:65534\n'
          printf 'UID_MAP='
          tr '\n' ';' < /proc/self/uid_map
          printf 'GID_MAP='
          tr '\n' ';' < /proc/self/gid_map
          test "$(awk 'NF { printf "%s %s %s", $1, $2, $3 }' /proc/self/uid_map)" = '65534 0 1'
          test "$(awk 'NF { printf "%s %s %s", $1, $2, $3 }' /proc/self/gid_map)" = '65534 0 1'
          test "$(readlink /proc/self/ns/user)" != "$EXPECTED_HOST_USER_NS"
          test "$(readlink /proc/self/ns/pid)" != "$EXPECTED_HOST_PID_NS"
          test "$(readlink /proc/self/ns/net)" != "$EXPECTED_HOST_NET_NS"
          test "$(readlink /proc/self/ns/ipc)" != "$EXPECTED_HOST_IPC_NS"
          test "$(readlink /proc/self/ns/uts)" != "$EXPECTED_HOST_UTS_NS"
          printf 'USER_NAMESPACE_RESULT=PASS\nPID_NAMESPACE_RESULT=PASS\nNETWORK_NAMESPACE_RESULT=PASS\nIPC_NAMESPACE_RESULT=PASS\nUTS_NAMESPACE_RESULT=PASS\n'
          printf 'NAMESPACE_PROOF=PASS\nNAMESPACE_BOUNDARY=PASS\n'
          for capability_name in CapInh CapPrm CapEff CapBnd CapAmb; do
            capability_value="$(awk -v key="${capability_name}:" '$1 == key { print $2 }' "$status_file")"
            [[ "$capability_value" =~ ^0+$ ]] || exit 41
          done
          printf 'CAPABILITY_SET_RESULT=PASS\n'
          printf 'CAPABILITY_SETS_ZERO=PASS\n'
          test "$(awk '$1 == "NoNewPrivs:" { print $2 }' "$status_file")" = 1
          printf 'NO_NEW_PRIVS_RESULT=PASS\n'
          printf 'NO_NEW_PRIVS=PASS\n'
          for proc_field in Name Pid PPid Uid Gid CapInh CapPrm CapEff CapBnd CapAmb NoNewPrivs Seccomp; do
            grep -q "^${proc_field}:" "$status_file"
          done
          test -r /proc/1/status
          printf 'PROC_RESULT=PASS\n'
          test "$(stat -f -c '%T' /tmp)" = tmpfs
          tmpfs_size="$(df -B1 --output=size /tmp | awk 'NR == 2 { print $1 }')"
          test "$tmpfs_size" -le 1073741824
          printf 'TMPFS_RESULT=PASS\n'
          test "$(findmnt -T /dev -n -o FSTYPE)" = tmpfs
          test -c /dev/null
          printf 'DEV_RESULT=PASS\n'
          if /usr/bin/unshare -Ur /usr/bin/true >/dev/null 2>&1; then
            exit 42
          fi
          printf 'NESTED_USERNS_RESULT=PASS\n'
          printf 'NESTED_USERNS_REJECTION=PASS\n'
          test -x /usr/bin/unshare
          route_prefix="/work/.s8-${S8_ADMISSION_MODE}-route"
          test ! -e "${route_prefix}-v4.json" && test ! -e "${route_prefix}-v4.stderr" && test ! -e "${route_prefix}-v6.json" && test ! -e "${route_prefix}-v6.stderr"
          if /usr/bin/ip -j -Numeric -details -4 route show table all >"${route_prefix}-v4.json" 2>"${route_prefix}-v4.stderr"; then :; else exit 43; fi
          test ! -s "${route_prefix}-v4.stderr"
          if /usr/bin/ip -j -Numeric -details -6 route show table all >"${route_prefix}-v6.json" 2>"${route_prefix}-v6.stderr"; then :; else exit 43; fi
          test ! -s "${route_prefix}-v6.stderr"
          printf 'NETWORK_ROUTE_EVIDENCE_READY=YES\n'
          test "$(stat -c '%u:%g' /work)" = 65534:65534
          printf 'WORK_SANDBOX_OWNER_RESULT=PASS\n'
          printf 'probe-data\n' > /work/.s8-work-probe
          test "$(cat /work/.s8-work-probe)" = probe-data
          mv /work/.s8-work-probe /work/.s8-work-probe-renamed
          rm -f /work/.s8-work-probe-renamed
          printf 'WORK_WRITE_RESULT=PASS\n'
          if [[ "${S8_ADMISSION_MODE}" == initial ]]; then
            test "$(cat /probe/input.txt)" = s8-benign-probe
            if printf bad >> /probe/input.txt; then exit 44; fi
            if mv /probe/input.txt /probe/input-renamed; then exit 45; fi
            if rm -f /probe/input.txt; then exit 46; fi
            test "$(cat /probe/input.txt)" = s8-benign-probe
            printf 'PROBE_READ_ONLY_RESULT=PASS\n'
          else
            test -r /runtime/blender-root/blender
            test -x /runtime/blender-root/blender
            test -r /runtime/writer/writer.py
            test -x /runtime/process-runner
            test -x /runtime/validator
            test -r /runtime/support/blender_validate.py
            test -r /runtime/support/blender_reopen_validate.py
            printf 'REAL_PATH_PREFLIGHT_RESULT=PASS\n'
            if printf bad >> /runtime/writer/writer.py; then exit 47; fi
            if mv /runtime/writer/writer.py /runtime/writer/writer-renamed.py; then exit 48; fi
            if rm -f /runtime/writer/writer.py; then exit 49; fi
            printf 'RUNTIME_CODE_IMMUTABLE_RESULT=PASS\n'
          fi
          /usr/bin/true
          SH

          run_capability_probe() {
            local mode="$1" probe_status
            local -a args
            admit_iproute2_snapshot "${mode}_pre_probe" || fail_hold "IPROUTE2_ADMISSION_FAILED_${mode}_PRE"
            validate_capability_ip_paths "$capability_script" || fail_amendment "IPROUTE2_EXECUTION_PATH_CONTRACT_FAILED"
            args=( "${common_bwrap_args[@]}" --as-pid-1 )
            if [[ "$mode" == initial ]]; then
              args+=(--ro-bind "$carrier/probe" /probe)
            else
              args+=(--ro-bind "$carrier/runtime/blender-5.2.2-linux-x64" /runtime/blender-root --ro-bind "$carrier/native/s8-process-runner" /runtime/process-runner --ro-bind "$carrier/native/s8-fbx-validator" /runtime/validator --ro-bind "$carrier/writer" /runtime/writer --ro-bind "$carrier/support" /runtime/support)
            fi
            args+=(--bind "$carrier/work" /work --proc /proc --dev /dev --size "$tmpfs_bytes" --tmpfs /tmp --chdir /work)
            args+=(--setenv EXPECTED_HOST_USER_NS "$host_user_ns" --setenv EXPECTED_HOST_PID_NS "$host_pid_ns" --setenv EXPECTED_HOST_NET_NS "$host_net_ns" --setenv EXPECTED_HOST_IPC_NS "$host_ipc_ns" --setenv EXPECTED_HOST_UTS_NS "$host_uts_ns" --setenv S8_ADMISSION_MODE "$mode" -- /usr/bin/bash -ceu "$capability_script")
            run_bwrap_argv_grammar_regression "$mode" /usr/bin/bash "${args[@]}" || fail_amendment "BWRAP_ARGV_GRAMMAR_REGRESSION_FAILED_${mode}"
            validate_bwrap_destination_order "$mode" /usr/bin/bash "${args[@]}" || fail_hold "BWRAP_DESTINATION_ORDER_ADMISSION_FAILED"
            admit_before_bwrap "$mode" || fail_hold "BWRAP_IDENTITY_ADMISSION_FAILED"
            if run_tracked_command /usr/bin/sudo -n /usr/bin/bwrap "${args[@]}"; then probe_status=0; else probe_status=$?; fi
            (( probe_status == 0 )) || return "$probe_status"
            [[ "$all_launched_children_reaped" == 1 && ${#tracked_children[@]} == 0 ]] || return 1
            admit_iproute2_snapshot "${mode}_post_reap" || fail_hold "IPROUTE2_ADMISSION_FAILED_${mode}_POST_REAP"
            validate_route_evidence "$mode" || fail_hold "NETWORK_ROUTE_EVIDENCE_INVALID_${mode}"
            return 0
          }

          iproute2_positive_controls || fail_amendment "IPROUTE2_POSITIVE_CONTROLS_FAILED"
          validate_capability_ip_paths "$capability_script" || fail_amendment "IPROUTE2_EXECUTION_PATH_CONTRACT_FAILED"
          one_family_bad="${capability_script/\/usr\/bin\/ip -j -Numeric -details -6/\/usr\/sbin\/ip -j -Numeric -details -6}"
          if validate_capability_ip_paths "$one_family_bad"; then fail_amendment "IPROUTE2_ONE_FAMILY_PATH_POSITIVE_CONTROL_FAILED"; fi
          bin_fallback_bad="${capability_script/\/usr\/bin\/ip -j -Numeric -details -4/\/bin\/ip -j -Numeric -details -4}"
          if validate_capability_ip_paths "$bin_fallback_bad"; then fail_amendment "IPROUTE2_BIN_FALLBACK_POSITIVE_CONTROL_FAILED"; fi
          printf 'IPROUTE2_EXECUTION_PATH_POSITIVE_CONTROLS=PASS\n'
          set +e
          run_route_parser_regressions
          route_parser_status=$?
          set -e
          (( route_parser_status == 0 )) || fail_amendment "ROUTE_PARSER_REGRESSIONS_FAILED"
          printf 'ROUTE_PARSER_REGRESSIONS=PASS\nR1_R29_IMAGE_ADMISSION_MATRIX=PASS\n'

          run_guarded_caller_regressions() {
            local regression_root caller_script negative_script regression_status negative_status negative_case
            regression_root="$(/usr/bin/mktemp -d)" || return 1
            caller_script="$regression_root/guarded-caller-regressions.sh"
            {
              declare -f tracked_pid_is_registered
              declare -f remove_tracked_pid_exact
              declare -f wait_for_tracked_pid
              declare -f signal_exit_status
              actual_helper_definition="$(declare -f run_tracked_command)"
              printf '%s\n' "${actual_helper_definition/run_tracked_command/run_tracked_command_actual}"
              declare -f run_tracked_command
              declare -f validate_bwrap_info_after_carrier
              declare -f run_capability_probe
              /usr/bin/cat <<'SH'
          set -Eeuo pipefail
          regression_root="$1"
          candidate_marker_file=""
          tmpfs_bytes=1073741824
          bwrap_path=/usr/bin/bwrap
          carrier=/carrier
          common_bwrap_args=(--unshare-user)
          host_user_ns=user:[host]
          host_pid_ns=pid:[host]
          host_net_ns=net:[host]
          host_ipc_ns=ipc:[host]
          host_uts_ns=uts:[host]
          capability_script=':'
