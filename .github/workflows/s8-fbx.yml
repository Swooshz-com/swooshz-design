            printf 'CARRIER_IDENTITY=%s\nCARRIER_LITERAL=%s\nCARRIER_CANONICAL=%s\nCARRIER_DIRECTORY=YES\nCARRIER_SYMLINK=NO\nCARRIER_MODE=0755\nCARRIER_OWNER=root:root\nCARRIER_EXTENDED_ACCESS_ACL=NONE\nCARRIER_DEFAULT_ACL=NONE\nCARRIER_REALPATH_MATCH=YES\nCARRIER_PARENT=/\n' "$carrier_baseline_identity" "$carrier" "$carrier"
