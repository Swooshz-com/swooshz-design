              if not isinstance(receipt, dict):
                  prove_seed_candidate_defect("MAPPED_SEED_RUNNER_RECEIPT_SCHEMA_INVALID", "MAPPED")
              runner_verification = receipt.get("runnerParentVerification")
              runner_result = receipt.get("result")
              if not isinstance(runner_verification, dict) or not isinstance(runner_result, dict):
                  prove_seed_candidate_defect("MAPPED_SEED_RUNNER_RECEIPT_SCHEMA_INVALID", "MAPPED")
              if (
                  receipt.get("schemaVersion") != "s8-process-runner-receipt-v2"
                  or receipt.get("protocol") != "s8-process-runner-receipt-v2"
                  or receipt.get("policyId") != "s8-zero-child-seccomp-x86_64-v2"
                  or runner_verification.get("status") != "PASS"
                  or runner_result.get("code") != 0
                  or runner_result.get("name") != "S8_RUNNER_SUCCESS"
                  or runner_result.get("terminationClass") != "target-exit-zero"
                  or runner_result.get("targetExit") != 0
              ):
                  prove_seed_candidate_defect("MAPPED_SEED_RUNNER_RECEIPT_RESULT_INVALID", "MAPPED")
              probe_lines = stdout_lines[receipt_line_index + 1:]
              if len(probe_lines) != 2 or any(not line.startswith(probe_prefix) for line in probe_lines):
                  prove_seed_candidate_defect("MAPPED_SEED_PROBE_RECORD_COUNT_INVALID", "MAPPED")
              expected_names = {"input.json", "expected.json"}
              records: dict[str, dict[str, object]] = {}
              expected_fields = {
                  "schemaVersion", "seed", "uid", "euid", "gid", "egid", "uidMap", "gidMap",
                  "capabilities", "noNewPrivs", "readSuccess", "readError", "digest", "device", "inode",
                  "writeOpenErrno", "afterReadError", "unchanged",
              }
              for line in probe_lines:
                  try:
                      encoded = line[len(probe_prefix):].decode("utf-8", "strict")
                      record = json.loads(encoded)
                  except (UnicodeDecodeError, ValueError):
