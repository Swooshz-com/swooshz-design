                  calls_for_case = []

                  def case_fake_run(command, **kwargs):
                      calls_for_case.append(command)
                      if len(calls_for_case) == 1 and len(command) > 1 and command[1] == "--s8-destination-admission-only":
                          return SimpleNamespace(returncode=0, stdout=b"", stderr=b"")
                      if launch_exception is not None:
                          raise launch_exception
                      return SimpleNamespace(returncode=returncode, stdout=stdout, stderr=stderr)

                  prior_run = module_globals["subprocess"].run
                  module_globals["subprocess"].run = case_fake_run
                  captured_out = io.StringIO()
                  captured_err = io.StringIO()
                  value = None
                  exit_code = None
                  try:
                      with contextlib.redirect_stdout(captured_out), contextlib.redirect_stderr(captured_err):
                          try:
                              value = module_globals["run_sandbox"](*run_args, phase=phase)
                          except SystemExit as error:
                              exit_code = error.code
                  finally:
                      module_globals["subprocess"].run = prior_run
                  return {
                      "value": value,
                      "exit": exit_code,
                      "stdout": captured_out.getvalue(),
                      "stderr": captured_err.getvalue(),
                      "calls": calls_for_case,
                  }

